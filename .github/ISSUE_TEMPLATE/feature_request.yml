name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Dudo is pre-alpha and built **one small vertical feature at a time**, so the
        roadmap is deliberately narrow and most requests will wait. Suggestions are
        still useful for shaping what comes next.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the need, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core / API
        - Web application
        - Apple application
        - Contracts
        - Plugin runtime or SDK
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
