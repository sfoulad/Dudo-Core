---
# Credential reset — contract of record, version 1
#
# An operator replaces a principal's credential with a generated value, shown exactly once.
#
# THE USER ASKED TO *SEE* AN ORGANIZATION'S PASSWORD. THAT IS IMPOSSIBLE AND MUST STAY IMPOSSIBLE.
# principal_credential holds identifier_hash, principal_id, algorithm, iterations, salt, verifier —
# NO PASSWORD COLUMN AND NO REVERSIBLE FORM OF ONE. The password never reaches Dudo: the client
# derives, and the server stores a hash OF THE DERIVED VALUE. docs/decisions/0015 §D: "printed ONCE
# and cannot be recovered afterwards, because nothing stores it."
# THIS IS ARITHMETIC, NOT POLICY. It is not a feature withheld from operators — there is nothing to
# withhold. Any design that made display possible would have REPLACED the credential scheme rather
# than extended it. Recorded here and in permission-catalog.yaml AZ12 because the request will
# recur and the answer must not drift.
#
# The machine-readable half is credential-reset-v1.schema.json. BOTH ARE NORMATIVE TOGETHER.
#
# THIS IS AN OPERATION IN THE PLATFORM ROUTE CLASS. platform-operator-v1 defines the class and
# restates nothing here. organization-onboarding-v1 shares this contract's credential-write path
# and its ON-5 KDF question; they are one slice.
#
# Governed by: docs/decisions/0025 (Accepted) · platform-operator-v1 (the class)
#              docs/decisions/0015 §D (the credential format) · §B (12-hour sessions)
#              docs/decisions/0018 (session revocation, and its carriers)
#              permission-catalog.yaml AZ12
# Owner:       architecture-agent authors; Team Lead accepts.
#
# PROVENANCE: ALL NEW WORK.

contractVersion: 1
apiVersion: 1
namespace: core
domain: platform
status: accepted
acceptedBy: "Dudo Team Lead, 2026-09-05. CR-1 closed by docs/decisions/0026; the mechanism by 0027; CR-5 by the request-shape change recorded below."
acceptedNote:
  thisROUTEUSESTHECONFIRMATIONMECHANISM_ANDONBOARDINGDOESNOT: >-
    core.credential.reset STAYS `critical`, so confirmation-v1's requirement applies: the caller
    obtains a challenge from POST /api/v1/platform/confirmations naming `platform.credentials.reset`
    and this operation's exact parameters, then submits `confirmation_id` and
    `reauth_derived_value` on the reset request itself. BOTH ARE REQUIRED FIELDS IN THE SCHEMA, not
    optional ones — an optional confirmation field is a confirmation that can be omitted.
    THE BINDING COVERS THE PARAMETERS, WHICH MATTERS MORE HERE THAN ANYWHERE ELSE IN DUDO: a
    confirmation obtained for "reset principal P" cannot be spent on "reset principal Q", and the
    substitution fails by construction rather than by comparison, because the recomputed HMAC
    simply finds no row.
    ONBOARDING IS `sensitive` AND TAKES NO CONFIRMATION. See that contract's acceptance note; the
    asymmetry is docs/decisions/0026's decision and not an oversight in either file.
  CR_5_ISCLOSEDBYTHISCONTRACTANDNOTBY0026: >-
    RECORDED PRECISELY, BECAUSE THE RECORD SHOULD NOT SAY OTHERWISE. docs/decisions/0026 §"ON-5 /
    CR-5" decides WHO RUNS THE KDF — the operator's browser — and that ruling works unchanged for
    onboarding. IT CANNOT WORK HERE AS WRITTEN, because the KDF salt is the TARGET's normalised
    identifier: the console has never seen it, the server stores only its keyed hash and genuinely
    cannot recover it, and the target is not present to derive. A reset would have written a
    verifier the target could never reproduce at login — BRICKING THE ACCOUNT IT WAS MEANT TO
    RESCUE.
    WHAT CLOSES IT is the request-shape change in this contract: the operator supplies the target's
    `identifier` alongside `principal_id`, Core verifies its HMAC against the stored
    identifier_hash, and a mismatch joins the existing argument-free 404 collapse. See CR-5 below
    for why this does not reopen the account-existence oracle the original ruling forbade.
    0026 SHOULD CARRY A NOTE TO THIS EFFECT, so that "CR-5 closed in 0026" is not read as meaning
    the salt problem was solved there.
  theTwoVocabularies: >-
    THIS CONTRACT TOUCHES NO WORKSPACE AND NO CUSTOMER, so docs/decisions/0025's Amendment does not
    bite here — noted only so its absence is not read as an omission. The tenant-side audit records
    this operation writes go into `audit_event`, which the rename never concerned.
updated: "2026-09-05"
documentsExistingImplementation: false

# ---------------------------------------------------------------------------
# whatThisIs — and it is account takeover, by design
# ---------------------------------------------------------------------------
whatThisIs:
  plainly: >-
    A PLATFORM OPERATOR RESETTING A TENANT ADMIN'S CREDENTIAL IS TAKING OVER THAT ACCOUNT. Not
    metaphorically — after the operation the operator holds a working credential for a principal
    inside a customer's Organization, and the customer does not.
  whyITISSTILLTHERIGHTTHINGTOBUILD: >-
    THE ALTERNATIVE IS NOT "NO TAKEOVER", IT IS "THE SAME TAKEOVER WITH NO AUDIT TRAIL". An
    operator with database access can already replace a verifier by hand — that is how every
    credential on the platform was created — and 0018, 0019, 0020 and 0023 each record that
    operator SQL produces no audit record. THIS ROUTE MAKES THE CAPABILITY AUDITED, RATE LIMITED
    AND VISIBLE TO THE CUSTOMER, which is strictly better than the status quo on every axis except
    the surface it adds.
  soTHECONTROLSARENOTOPTIONAL: >-
    The audit record, the session revocation, and the customer-visible trail are what distinguish
    this from the thing it replaces. AN IMPLEMENTATION THAT SHIPPED THE RESET WITHOUT THEM WOULD
    HAVE BUILT THE TAKEOVER AND NOT THE ACCOUNTABILITY, and would be worse than shipping nothing.
  itSTAYS_critical: >-
    core.credential.reset IS DECLARED `critical` AND MUST NOT BE RECLASSIFIED. organization-
    onboarding-v1 ON-6 proposes reclassifying core.organization.create to `sensitive` because
    creation is not destruction; THAT ARGUMENT DOES NOT EXTEND HERE. §6's own examples of critical
    include "rotate credentials" verbatim. THE SENSITIVITY LADDER KEEPS ITS MEANING ONLY IF
    SOMETHING STAYS AT THE TOP, and if everything critical is reclassified to make it reachable,
    the class is decoration.
  theCONFIRMATIONGAP: >-
    AND THAT LEAVES THE SAME PROBLEM ON-6 NAMES. §6 requires permission + audit + EXPLICIT
    CONFIRMATION for a critical action, and 0007 D15's per-operation elevation mechanism does not
    exist. SO THIS ROUTE IS UNREACHABLE UNTIL IT DOES, exactly as customers.customer.delete is, and
    permission-catalog.yaml already calls that "the correct fail-closed state".
    THIS CONTRACT ACCEPTS BEING BLOCKED RATHER THAN ASKING FOR AN EXEMPTION. The confirmation
    mechanism is owed for DeleteCustomer anyway; building it once unblocks both. Recorded as CR-1,
    and it is the honest reason this is the last of the four contracts to become buildable.

# ---------------------------------------------------------------------------
# theSessionRevocationRequirement — the part most likely to be omitted
# ---------------------------------------------------------------------------
theSessionRevocationRequirement:
  ruling: >-
    A SUCCESSFUL RESET REVOKES EVERY LIVE SESSION OF THE TARGET PRINCIPAL. Not optionally, not as
    a follow-up call, not "on next expiry". In the same operation.
  why: >-
    WITHOUT IT THE RESET DOES NOT DO THE ONE THING IT IS USUALLY CALLED FOR. Sessions are 12 hours
    (0015 §B) with no rotation. An attacker who has already authenticated holds a session credential
    that is independent of the password — session-credential.ts's `<session_id>.<HMAC>` is verified
    against the session row, not against principal_credential. SO CHANGING THE PASSWORD ALONE
    CHANGES THE LOCK ON A DOOR THE ATTACKER IS ALREADY THROUGH, and leaves them inside for up to
    twelve more hours.
  theMECHANISMEXISTS: >-
    NOTHING NEW IS NEEDED IN THE SESSION LAYER. deleteSession already ends a session by DELETING
    the row, and 0018 established the semantics. What is missing is the ability to find every
    session for a principal, and `session_by_principal` — the index (principal_id, expires_at) that
    control-plane-admission.ts already counts in SESSION_ROW_WRITES — is exactly that access path.
    THE INDEX IS ALREADY PAID FOR ON EVERY LOGIN; this is the first thing to use it.
  theCOST: >-
    3 ROW-WRITES PER SESSION DELETED, because a DELETE leaves every index (control-plane-admission.ts,
    "session revocation: exact — a DELETE leaves EVERY index"). A principal with three live sessions
    costs 9. THE RESERVATION MUST BE COMPUTED FROM A COUNT, not from a constant, and it must be
    bounded — see theUnboundedRevocationHazard.
  theUnboundedRevocationHazard:
    finding: >-
      THE NUMBER OF SESSIONS A PRINCIPAL HOLDS IS NOT BOUNDED BY ANYTHING IN THIS PLATFORM. There
      is no per-principal session limit, no rotation, and no cap on concurrent logins. A principal
      that logged in 200 times today — which its own 600/day per-principal ceiling permits — holds
      200 live sessions, and revoking them is 600 row-writes: a fifth of the entire control-plane
      daily sub-ceiling, spent by one reset.
    ruling: >-
      THE RESERVATION IS TAKEN FOR THE MEASURED COUNT, CAPPED AT 50 SESSIONS (150 row-writes). If
      the target holds more, THE OPERATION REVOKES THE FIRST 50 BY EXPIRY ORDER, SUCCEEDS, AND
      RETURNS A `sessions_not_revoked` WARNING WITH THE REMAINING COUNT.
    whyNOTFAILINSTEAD: >-
      BECAUSE THE CREDENTIAL HAS ALREADY BEEN REPLACED BY THAT POINT AND CANNOT BE UNREPLACED.
      Failing would leave the account with a new password the operator was never shown and old
      sessions still live — strictly worse than partial revocation plus an honest warning. It is
      the same reasoning organization-onboarding-v1 applies to its step-7 failures.
    whyNOTREVOKEFIRSTTHENRESET: >-
      CONSIDERED AND REJECTED: the target could simply log in again between the two steps, using
      the password the operator is about to replace, and end up with a fresh session that survives.
      The credential must change first.
    theHONESTRESIDUAL: >-
      A TARGET WITH MORE THAN 50 LIVE SESSIONS KEEPS SOME OF THEM. That is a real hole in a
      security operation, it is bounded and reported rather than silent, and the right fix is a
      per-principal session cap — which does not exist and is a decision of its own. Recorded as
      CR-2.

# ---------------------------------------------------------------------------
# whoMayBeReset — the scoping question, and it is not obvious
# ---------------------------------------------------------------------------
whoMayBeReset:
  ruling: >-
    ANY PRINCIPAL WITH A CREDENTIAL, IDENTIFIED BY principal_id — INCLUDING TENANT MEMBERS, AND
    EXCLUDING EVERY PLATFORM OPERATOR.
  theEXCLUSIONISBINDING:
    rule: "A principal with a row in platform_operator CANNOT be reset through this route. It returns forbidden."
    why: >-
      OTHERWISE ONE OPERATOR CAN TAKE OVER ANOTHER, AND PLATFORM AUTHORITY BECOMES SELF-AMPLIFYING.
      An operator holding core.credential.reset could reset a colleague holding
      core.principal.grant-platform-scope and inherit the broadest grant in the system. That is the
      classic escalation 0007 D11 exists to prevent, arriving through a credential rather than
      through a grant — and D11's conditions do not catch it, because a reset is not a grant.
    andITISAWKWARDANDCORRECT: >-
      IT MEANS A LOCKED-OUT OPERATOR CANNOT BE RESCUED THROUGH THE CONSOLE and must be recovered by
      out-of-band SQL, exactly as they were created (platform-operator-v1, theBootstrapProblem).
      THAT ASYMMETRY IS DELIBERATE: the most privileged accounts keep the property that no request
      can change them, which is the property this whole contract gives up for everyone else.
  theTARGETISNAMEDBYprincipal_id_ANDNOTBYEMAIL:
    ruling: >-
      REVISED 2026-09-05, AND THE REVISION IS FORCED BY ARITHMETIC RATHER THAN CHOSEN. The request
      carries `principal_id` AND the target's `identifier`. The original ruling — "THERE IS NO
      IDENTIFIER, EMAIL OR SEARCH FIELD" — WAS UNBUILDABLE, and the reason is below in
      theSALTPROBLEM. What survives from it, and it is the part that mattered, is that THE
      IDENTIFIER IS NOT HOW THE TARGET IS FOUND: `principal_id` finds it, the identifier is
      verified against it, and a lookup BY identifier remains impossible on this route.
    why: >-
      A ROUTE THAT ACCEPTED AN EMAIL ADDRESS WOULD BE A PLATFORM-WIDE ACCOUNT-EXISTENCE ORACLE.
      Submit an address, learn from the response whether anyone on Dudo uses it. That is the
      disclosure control-plane/0001_principal.sql refused a whole column to prevent — "a directory
      of every user's personal details, readable without any tenant scope, would be the
      highest-value target in the system" — and credential-store.ts spends a keyed HMAC precisely so
      that a database dump is not a mailing list. ACCEPTING AN EMAIL HERE WOULD HAND BACK THROUGH AN
      API WHAT THE SCHEMA PAID TO WITHHOLD.
    theCOSTOFTHIS: >-
      STATED PLAINLY: AN OPERATOR CANNOT ANSWER "RESET THE PASSWORD FOR sam@example.com" DIRECTLY.
      They must find the principal another way. credential-store.ts already records this exact
      friction as deliberate — "an operator cannot answer 'which account is sam@example.com?' from
      the database... a deliberate friction, not an accident."
      AND THERE IS CURRENTLY NO ROUTE THAT PRODUCES A principal_id AT ALL. No route lists an
      Organization's members. SO THIS OPERATION IS UNUSABLE IN PRACTICE UNTIL ONE EXISTS, which is
      a real gap and is CR-3 — it must not be closed by adding an email field here.
  notFoundCOLLAPSE: >-
    AN UNKNOWN principal_id, A PRINCIPAL WITH NO CREDENTIAL, AND A PLATFORM OPERATOR ALL RETURN THE
    SAME ARGUMENT-FREE 404. Three cases, one answer, no distinguishing field — otherwise the route
    becomes a principal-existence probe and, worse, an ORACLE FOR WHICH PRINCIPALS ARE PLATFORM
    OPERATORS, which is the single most useful thing an attacker could learn from this surface.
    THE SAME WORK MUST HAPPEN ON ALL THREE PATHS, not merely the same code — the property
    theHintRuling establishes in organization-selection-v1, applied here.

# ---------------------------------------------------------------------------
# operations
# ---------------------------------------------------------------------------
basePath: "/api/v1/platform"

operations:
  - id: platform.credentials.reset
    title: "Reset a principal's credential"
    method: POST
    path: "/credentials/reset"
    surface: platform
    provenance: "NEW WORK."
    description: >-
      Replace a principal's credential with a generated value, revoke that principal's live
      sessions, and return the new value exactly once.
    permission: core.credential.reset
    scope: platform
    sensitivity: critical
    request: { schemaRef: "urn:dudo:schema:credential-reset:1#/$defs/resetCredentialInput" }
    response: { schemaRef: "urn:dudo:schema:credential-reset:1#/$defs/resetCredentialOutput" }
    successStatus: 200
    errors: [invalid_argument, unauthenticated, forbidden, not_found, rate_limited, quota_exceeded, unavailable]
    maxRowWrites: 154
    audit: required
    theROWWRITEFIGURE: >-
      2 (credential row + primary-key index) + 150 (up to 50 sessions at 3) + 2 (platform audit
      record) = 154 WORST CASE. The reservation is computed from the MEASURED session count, not
      from this constant — the constant is the ceiling, and 0014 §A.12 makes over-reserving correct
      but only where the over-charge is stated. A typical reset with one live session is 7.
    theORDERING: |
      1. VALIDATE, including the platform-operator exclusion. Before any reservation.
      2. COUNT the target's live sessions, capped at 50.
      3. RESERVE for 2 + 3n + 2.
      4. REPLACE the credential row. THE CREDENTIAL CHANGES FIRST — see whyNOTREVOKEFIRSTTHENRESET.
      5. DELETE the counted sessions.
      6. WRITE the platform-operator audit record. NOT SUCCESSFUL UNTIL THIS LANDS.
      7. WRITE the tenant-side audit record into every Organization the target is a member of.
      8. RETURN 200 — WITH NO CREDENTIAL IN IT. Corrected 2026-09-05: this step read "RETURN 200
         with the generated value", which the server cannot do because it never held one. The
         console generated the password at step 0 and still holds it; see theClientObligation.
    theTENANTSIDEAUDITISPERMEMBERSHIP:
      ruling: >-
        STEP 7 WRITES ONE RECORD PER ORGANIZATION THE TARGET BELONGS TO. A principal in three
        Organizations produces three tenant-side records, one in each Organization's own
        audit_event.
      why: >-
        EVERY ONE OF THOSE ORGANIZATIONS JUST HAD ONE OF ITS MEMBERS' ACCOUNTS TAKEN OVER, and each
        is entitled to see it in its own log. Writing to only one — or to none — would mean a
        customer could not discover that an operator had accessed an account inside their tenant.
      theCOSTANDTHECAP: >-
        5 ROW-WRITES PER ORGANIZATION in the `business` allocation. Bounded by membership count,
        which is bounded by nothing today. CAPPED AT 10 ORGANIZATIONS with a
        `tenant_audit_incomplete` warning beyond that — the same shape as the session cap and for
        the same reason. Recorded with CR-2.
      itMUSTNOTNAMETHEOTHERORGANIZATIONS: >-
        AND THIS IS SUBTLE AND LOAD-BEARING. Each tenant-side record says "an operator reset the
        credential of principal X, who is a member here." IT MUST NOT SAY HOW MANY OTHER
        ORGANIZATIONS X BELONGS TO, OR WHICH. That is exactly the CO1 disclosure —
        core-object-registry.yaml: "a user's list of Organizations must never be visible to any of
        them" — and an audit record that leaked it would put the disclosure in an append-only table
        that every Organization's owner may read.
    notes: >-
      NO PASSWORD MAY BE SUPPLIED. Same rule and same reason as onboarding: 0017's basis is that
      entropy protects these accounts, so a human-chosen value expires that decision.
      THE ON-5 KDF QUESTION APPLIES IDENTICALLY. This route and onboarding share one credential-write
      path; option B (derive in the admin console) is recommended for both, and whichever is chosen
      must be chosen once.
      SELF-RESET IS NOT THIS ROUTE. A user changing their own password is an ordinary authenticated
      operation with the old password as proof, and it does not exist yet either. Adding it here
      would put a tenant user's password change behind a platform permission. Recorded as CR-4.

# ---------------------------------------------------------------------------
# theClientObligation — WHERE THE "SHOWN ONCE" REQUIREMENT LIVES NOW. Added 2026-09-05.
# ---------------------------------------------------------------------------
theClientObligation:
  whyItIsHereAndNotInTheSchema: >-
    THE SERVER NEVER HOLDS THE PASSWORD, SO IT CANNOT BE A RESPONSE FIELD AND ITS HANDLING CANNOT
    BE A SERVER RULE. Under docs/decisions/0026 option B the console generates it, derives from it,
    and displays it — the value exists only in the operator's browser, from generation to display,
    and never crosses the wire in either direction. THAT IS STRICTLY BETTER THAN THE ROUND TRIP THIS
    CONTRACT ORIGINALLY SPECIFIED, and it means the obligations below are the ONLY place these
    properties are enforced. They are normative and qa-agent asserts them against the console.
  binding:
    - >-
      THE PASSWORD IS DISPLAYED EXACTLY ONCE AND IS NOT RECOVERABLE. The console MUST say so AT THE
      MOMENT IT DISPLAYS IT — not in documentation read at some other time, and not in a tooltip.
      An operator who closes the tab must run another reset, and there is no other remedy.
    - >-
      IT IS GENERATED FROM A CSPRNG WITH AT LEAST 128 BITS OF ENTROPY, in an alphabet with no
      visually confusable characters, because a human reads it aloud or retypes it from a screen.
      NEVER OPERATOR-CHOSEN: docs/decisions/0017's honest basis is that "rate limiting is not what
      protects these accounts — password entropy is", and a human-chosen value expires that
      decision.
    - >-
      IT IS NEVER PERSISTED, LOGGED, COPIED TO ANALYTICS, PLACED IN A CRASH REPORT OR BREADCRUMB,
      OR WRITTEN TO ANY STORAGE THE BROWSER KEEPS. It lives in memory for the life of one screen.
    - >-
      IT IS NEVER SENT TO ANY SERVER, DUDO'S INCLUDED. Only the derived value leaves the browser.
      A console that posted the password anywhere would have rebuilt option A by hand.
    - >-
      THE CONSOLE MUST NOT DISPLAY IT UNTIL THE 200 IS RECEIVED. Showing it earlier would hand an
      operator a credential for an account whose reset then failed — which is worse than showing
      nothing, because they would hand it to a customer who could not use it.
  theRESIDUALTHATCANNOTBECLOSEDHERE: >-
    A CLIENT OBLIGATION IS WEAKER THAN A SERVER GUARANTEE AND THAT IS STATED PLAINLY. Core cannot
    verify that the console discarded the value, said it was unrecoverable, or refrained from
    logging it — the same class of limit confirmation-v1 records as CF-2 for the statement it
    cannot prove was displayed. Enforcement is a published obligation plus qa-agent's assertions.
    IT IS STILL A BETTER POSITION THAN THE ONE IT REPLACES: a response field would have been a
    server guarantee about a value the server could not produce, which is not a guarantee at all.

# ---------------------------------------------------------------------------
# tenancy
# ---------------------------------------------------------------------------
tenancy:
  tenant: none-for-the-operation-many-for-the-audit
  ruling: >-
    THE RESET ITSELF IS A CONTROL-PLANE OPERATION AND TOUCHES NO TENANT DATA. principal_credential
    and session are both control-plane tables with no tenant_id. The operator reads no customer,
    no invoice and no row behind whereWithTenant.
  theTENANTWRITESAREAUDITONLY: >-
    Step 7 resolves a tenant handle per Organization SOLELY to append an audit record. It reads no
    business data through those handles, and the same review point organization-onboarding-v1 makes
    applies: THE HANDLES' LIFETIME IS THE OPERATION, and putting a resolver on the platform route
    context to serve them would defeat platform-operator-v1 P1 for the whole class.
  theOPERATORGAINSNOACCESS: >-
    RESETTING A CREDENTIAL GIVES THE OPERATOR A PASSWORD, NOT A SESSION AND NOT A MEMBERSHIP. To
    use it they must log in as that principal, which is a separate, logged authentication event
    against a principal whose Organizations will each hold an audit record saying their credential
    was just reset by an operator. THE TRAIL IS THE CONTROL, and it is why the audit obligations in
    this contract are not negotiable.

# ---------------------------------------------------------------------------
# freeTierImpact
# ---------------------------------------------------------------------------
freeTierImpact:
  allowancesConsumed: [d1-rows-written, d1-rows-read]
  writes: >-
    Typical (one live session, one Organization): 2 + 3 + 2 = 7 control-plane row-writes plus 5
    tenant row-writes. Worst case 154 control-plane plus 50 tenant. TWO ALLOCATIONS: `system` for
    the control plane, `business` for the tenant audit records.
  theCEILINGTHATMATTERS: >-
    A WORST-CASE RESET IS 5% OF THE ENTIRE CONTROL-PLANE DAILY SUB-CEILING (154 of 3,000). Twenty
    such resets exhaust it and no principal on the platform can log in until 00:00 UTC. THE CAP AT
    50 SESSIONS IS THEREFORE A PLATFORM-AVAILABILITY CONTROL AND NOT AN EFFICIENCY ONE, and this is
    exactly the shape docs/decisions/0013 records: the control becoming the vulnerability if it is
    unbounded.
  rateLimiting: >-
    REQUIRED, per platform-operator-v1. An unbounded reset endpoint is a lockout weapon against
    every account on the platform, and it is the one route in this class where the rate limit
    protects customers rather than capacity. 0017's in-process limiter does not bound it in a
    deployed Worker — stated, not assumed.
  cost: "USD 0 / BD 0 per month. No new service, no new table beyond the platform audit log."

# ---------------------------------------------------------------------------
# testRequirements
# ---------------------------------------------------------------------------
testRequirements:
  theCoreProperties:
    - "THE 200 BODY CONTAINS NO PASSWORD FIELD AT ALL. Corrected 2026-09-05: this asserted the opposite, and satisfying it would have required building option A — the server holding a plaintext password — which is the design 0015 §D and 0026 exist to prevent. Assert the field is absent and that additionalProperties:false rejects one."
    - "The plaintext password appears in NO server log, metric, trace, audit record or error. The server never receives it, so a hit means something upstream leaked it."
    - "The console holds the password and does not persist it: absent from localStorage, sessionStorage, IndexedDB and any analytics or breadcrumb payload after the screen is dismissed."
    - "THE CONSOLE DOES NOT DISPLAY THE PASSWORD UNTIL THE 200 ARRIVES. Showing it earlier hands an operator a credential for a reset that then failed — worse than showing nothing, because they would pass it to a customer who could not use it."
    - "The target can authenticate with the new value and CANNOT authenticate with the old one."
    - "EVERY live session of the target is gone: a request carrying a pre-reset session credential returns unauthenticated on the next call, not at expiry."
    - "NO OTHER PRINCIPAL'S SESSIONS ARE TOUCHED. Seed two principals with live sessions, reset one, assert the other's session still works — the obvious defect is a revocation query missing its principal predicate."
  authorization:
    - "A platform operator target returns 404 — the same 404 an unknown principal returns, with no distinguishing field, message or timing."
    - "A tenant principal holding `owner` receives forbidden."
    - "An operator holding core.template.create but not core.credential.reset receives forbidden."
  bounds:
    - "A target with 60 live sessions: 50 are revoked, the operation succeeds, and warnings contains sessions_not_revoked with the remaining count."
    - "The reservation is computed from the measured session count, not the 154 constant: assert a one-session reset does not reserve 154."
  audit:
    - "The platform-operator record is written and the operation fails with unavailable if it cannot be."
    - "A tenant-side record lands in EVERY Organization the target belongs to."
    - "CO1: no tenant-side audit record names, counts or implies any OTHER Organization the target belongs to. Seed a principal into three Organizations and assert each record is blind to the other two."

# ---------------------------------------------------------------------------
# openQuestions
# ---------------------------------------------------------------------------
openQuestions:
  - id: CR-1
    question: >-
      core.credential.reset is `critical`, §6 requires explicit confirmation for a critical action,
      and that mechanism does not exist. THIS ROUTE IS THEREFORE UNREACHABLE.
    recommendation: >-
      Build the confirmation mechanism — owed anyway for customers.customer.delete, so one slice
      unblocks both. DO NOT reclassify this permission to make it reachable; onboarding has a
      genuine argument for reclassification (creation is not destruction) and this does not.
    blocks: "This entire contract. It is the last of the four to become buildable, and that is correct rather than unfortunate."
  - id: CR-2
    question: >-
      The session cap (50) and the tenant-audit cap (10 Organizations) both leave a bounded,
      reported hole in a security operation.
    recommendation: "The real fix is a per-principal session cap, which does not exist. Its own decision. Until then the caps are the right trade and the warnings must be rendered prominently."
    blocks: "Nothing. It is a stated residual."
  - id: CR-3
    question: >-
      NO ROUTE ANYWHERE PRODUCES A principal_id. No route lists an Organization's members, so an
      operator has no way to discover the identifier this route requires.
    recommendation: >-
      A member-listing route, in the organization-structure slice. IT MUST NOT BE CLOSED BY ADDING
      AN EMAIL FIELD HERE — that would rebuild the platform-wide account-existence oracle the
      keyed identifier hash was designed to prevent.
    blocks: "Practical use of this route, even once CR-1 is closed. Worth knowing before the console is designed around it."
  - id: CR-4
    question: "A user changing their own password does not exist, and is not this route."
    recommendation: "An ordinary authenticated operation with the old password as proof. Putting it here would place a tenant user's password change behind a platform permission."
    blocks: "Nothing here. It is a product gap every customer will notice."
  - id: CR-5
    status: "CLOSED FOR ONBOARDING, REOPENED HERE. docs/decisions/0026 decided the mechanism and this route cannot use it as written."
    question: >-
      THE SALT PROBLEM. docs/decisions/0026 rules that the OPERATOR'S BROWSER derives: the console
      generates a password, runs PBKDF2-SHA256(NFC(password), salt = normalized_identifier,
      600,000), and sends only the derived value, so "the server never sees a password" survives
      exactly. THAT WORKS FOR ONBOARDING, WHERE THE OPERATOR TYPED THE IDENTIFIER. IT CANNOT WORK
      HERE, AND THE REASON IS THAT NOBODY CAN SUPPLY THE SALT:
        * THE CONSOLE holds only a principal_id. It has never seen the target's email address.
        * THE SERVER CANNOT TELL IT. principal_credential stores identifier_hash =
          HMAC-SHA-256(IDENTITY_LOOKUP_KEY, normalized_identifier) AND NOT THE IDENTIFIER.
          credential-store.ts records this as a deliberate cost: "AN OPERATOR CANNOT ANSWER 'WHICH
          ACCOUNT IS sam@example.com?' FROM THE DATABASE" — and the reverse is equally true and is
          the direction that bites here. THE PLATFORM DOES NOT KNOW ANY USER'S EMAIL ADDRESS.
        * THE TARGET IS NOT PRESENT. It is their account being reset; they cannot derive.
      SO A RESET CANNOT PRODUCE A VERIFIER THAT THE TARGET WILL LATER BE ABLE TO REPRODUCE AT
      LOGIN, because login derives with the identifier as salt and the reset would have used
      something else. THE ACCOUNT WOULD BE PERMANENTLY UNLOGINNABLE — a reset that bricks the
      account it was meant to rescue.
    resolution: >-
      THE OPERATOR SUPPLIES THE TARGET'S IDENTIFIER ALONGSIDE THE principal_id. Core computes its
      HMAC and requires it to match the stored identifier_hash; a mismatch returns the SAME
      argument-free 404 as an unknown principal, joining the collapse already specified in
      notFoundCOLLAPSE. The console then derives with that identifier as salt, exactly as onboarding
      does, and 0026's decision applies unchanged.
    whyTHISDOESNOTREOPENTHEORACLE: >-
      THE ORIGINAL OBJECTION WAS TO A ROUTE THAT ACCEPTED AN EMAIL AND LOOKED A PRINCIPAL UP BY IT —
      "submit an address, learn whether anyone on Dudo uses it." THAT REMAINS IMPOSSIBLE: the
      identifier is not an index into anything here, `principal_id` is, and an attacker cannot
      obtain a valid principal_id from this route or any other.
      WHAT IS LEFT IS A CONFIRMATION ORACLE AND IT IS MUCH WEAKER: someone already holding a valid
      principal_id AND core.credential.reset can test whether a guessed address belongs to it. The
      holder of that permission can already take over the account outright, so the address discloses
      nothing they could not obtain more directly — the same test theIdentifierCollision applies in
      organization-onboarding-v1 and reaches the same answer.
      IT WOULD BE UNACCEPTABLE ON ANY ROUTE REACHABLE BY A LESS PRIVILEGED CALLER, and this pattern
      must not be copied to one.
    theRESIDUALCOST: >-
      THE OPERATOR MUST KNOW THE TARGET'S EMAIL ADDRESS, from outside Dudo, because Dudo genuinely
      cannot tell them. Combined with CR-3 — no route produces a principal_id either — A RESET
      REQUIRES TWO FACTS THE PLATFORM WILL NOT SUPPLY. That is the honest operational shape of this
      route and it should be stated to whoever designs the console, not discovered by them.
    theALTERNATIVEREJECTED: >-
      STORING A RANDOM PER-CREDENTIAL SALT instead of deriving it from the identifier would solve
      this cleanly — a reset could generate a new salt freely. IT IS REJECTED because the login
      client must know the salt BEFORE authenticating, so it would need a pre-login salt-fetch
      round trip keyed by email address, WHICH IS THE ACCOUNT-EXISTENCE ORACLE, OPEN TO THE
      INTERNET, that the whole identifier-as-salt design avoids. It would also be an amendment to
      0015 §D affecting every existing credential. The salt problem is the price of that design and
      this is where the bill arrives.
    blocks: >-
      NOTHING. CORRECTED 2026-09-05: this read "Implementation of this route" and survived into an
      `accepted` contract, so the file claimed to be accepted and blocked at the same time. The
      request-shape change was accepted by the Team Lead on 2026-09-05.
      IT IS THE SAME PARTIAL-UPDATE FAILURE AS THE `required` LISTS BELOW, in the smallest possible
      form: the resolution was written, the status was changed, and the one field whose whole job
      is to say "this is still blocking" was left alone.
  - id: CR-6
    question: >-
      docs/decisions/0026 records something this contract should carry too: THERE IS NO
      SELF-SERVICE PASSWORD CHANGE, so an operator-set password is permanent until an operator
      resets it, and EVERY TENANT ADMIN'S CREDENTIAL IS KNOWN TO WHOEVER ONBOARDED THEM, FOREVER.
    recommendation: >-
      A change-password flow needs no email provider — the principal already holds a session, so it
      is an ordinary authenticated operation with the old password as proof. It is CR-4, and 0026
      raises its priority: it should be built BEFORE any non-operator user exists, alongside 0018's
      reserved allocation and 0021's OS-1.
    blocks: >-
      Nothing mechanically, and it is the strongest argument for building CR-4 early: without it,
      this route is not merely a recovery mechanism, it is the ONLY way a password ever changes.
