---
# Organization identity — contract of record, version 1
#
# AN ORGANIZATION GAINS A NAME, A COMMERCIAL REGISTRATION AND A VAT REGISTRATION.
#
# The machine-readable half is organization-identity-v1.schema.json. BOTH ARE NORMATIVE
# TOGETHER, and `required` lists are ASSERTIONS rather than description
# (.claude/rules/workflow.md §12, "prose describes; assertions instruct").
#
# THIS IS AN OPERATION IN THE PLATFORM ROUTE CLASS. platform-operator-v1 defines that class,
# its four binding properties and its audit model; this contract restates none of it.
#
# Governed by: control-plane/0002_organization.sql — which declined a name column and named
#                this exact consequence
#              docs/decisions/0028 — the tenant must see what the platform does to it
#              docs/decisions/0026 — the sensitivity ladder, and what keeps its top rung
#              docs/decisions/0019 — a column costs zero additional rows; a table does not
#              docs/decisions/0030 — the free tier may cost us configuration, never schema
#              organization-detail-v1 · platform-operator-v1 · organization-onboarding-v1
# Owner:       architecture-agent authors; Team Lead accepts.
#
# STATUS
# status: proposed. NOT YET APPROVED and NOT YET BUILT. Per .claude/rules/workflow.md §3 the
# Team Lead reviews and agrees this contract before any consumer implements against it;
# architecture-agent does not accept its own contracts.
#
# *** THIS CONTRACT REQUIRES CHANGES TO THREE ACCEPTED CONTRACTS AND MAKES NONE OF THEM. ***
# One of the three is BREAKING. See consequentialChanges, and read it before scheduling this.
#
# PROVENANCE: ALL NEW WORK. The `display_name` field is not new as a SHAPE — three contracts
# and one shipped handler already publish it as always-null — and this contract is what makes
# it carry a value.

contractVersion: 1
apiVersion: 1
namespace: core
domain: platform
status: accepted
acceptedBy: >-
  Dudo Team Lead, 2026-09-08. Unblocked by docs/decisions/0031, which is Accepted and which
  decided this contract's substance — what a Template does, and the two console rulings — and by
  the user's grant of `core.platform-organization.update` to `platform-admin` on 2026-09-07,
  relayed by the Team Lead, who does not approve (security.md §8). The permission is declared,
  granted, transcribed into `platform-permissions.ts`, and served by exactly the one route this
  contract publishes.
  THE ORDERING THIS CONTRACT REQUIRED WAS COMPLETED BEFORE ACCEPTANCE, WHICH IS WHY IT IS
  ACCEPTABLE NOW: declared in the catalog, granted by the user, transcribed into Core's envelope,
  route registered — and the permission left `HELD_BUT_UNREACHABLE` in the same change that
  registered the route, which is what `assertEveryRoutePermissionIsReachable` exists to force.
  ACCEPTANCE DOES NOT CLOSE OI-1. The customer still cannot enter or correct their own name, CR
  or VAT number, and OI-1 stays open with its recommendation intact. What acceptance settles is
  that the PLATFORM-SIDE route is the agreed shape, not that the asymmetry is resolved.
updated: "2026-09-08"
documentsExistingImplementation: none

# ---------------------------------------------------------------------------
# theGapThisCloses
# ---------------------------------------------------------------------------
theGapThisCloses:
  what: >-
    ORGANIZATIONS HAVE NO NAME. `control-plane/0002_organization.sql` declined a name column
    deliberately and stated the consequence rather than discovering it: *"an Organization picker
    built on this port can list identifiers and not names. A 22-character opaque identifier is
    not a usable choice for a human."* THE CONSOLE'S LIST, ITS DETAIL HEADER AND THE
    ORGANIZATION PICKER ARE ALL OPAQUE IDENTIFIERS TODAY.
  itIsFOUROPENQUESTIONSANDONEFIX: >-
    `PO-3` (the operator roster and lists show identifiers), `OD-4` (the detail page is headed
    by one), `OP-3` (an operator cannot tell colleagues apart) and the picker
    (`session-route-handlers.ts`). One name column closes the Organization half of all of them.
    `OP-3` IS **NOT** CLOSED BY THIS CONTRACT — it is about PRINCIPALS, and
    `platform-operators-v1` records the right answer there: *"do not close it by adding an email
    column to the roster — that is the directory `0001_principal.sql` refused."*
  andTHEPLACEHOLDERTHISDOESNOTFIX: >-
    *** STATED FIRST BECAUSE IT IS THE EASIEST THING TO BELIEVE WAS FIXED. *** The console today
    sends a fixed self-describing placeholder as `first_workspace_name`, because `business` has
    two columns and Workspace naming belongs to the organization-structure slice. THAT IS A
    DIFFERENT FIELD ON A DIFFERENT OBJECT AND THIS CONTRACT DOES NOT TOUCH IT. After this lands
    the console still does not ask for a Workspace name, and `platform/admin/README.md`'s
    explanation of why stays exactly as true as it is now.

# ---------------------------------------------------------------------------
# theCategoryRuling — two columns or a `registrations` concept
# ---------------------------------------------------------------------------
theCategoryRuling:
  ruling: >-
    *** TWO COLUMNS, NOT A GENERIC `organization_registration` TABLE — AND THE TWO SHARE ONE
    SCHEMA DEFINITION, WHICH IS THE HALF THAT MAKES THE RULING SAFE. *** `commercial_registration`
    and `vat_registration` are recorded as two nullable columns on `organization`, and both are
    `urn:dudo:schema:organization-identity:1#/$defs/registrationRecord` — one shape, referenced
    twice.
  theyARENAMEDASACATEGORYONPURPOSE:
    theCategory: >-
      A GOVERNMENT-ISSUED IDENTIFIER RECORDED ABOUT AN ORGANIZATION: a value the Organization
      does not choose, issued by an authority, verifiable in principle against that authority's
      registry, and recorded by Dudo rather than generated by it.
    theMEMBERSDUDOWILLBEASKEDFORNEXT: >-
      In Bahrain: LMRA, GOSI, and a municipality licence, each issued by a different authority
      with a different format and a different verification route. In another jurisdiction, an
      entirely different set. NAMING THEM NOW IS THE POINT — the third one must arrive as a
      DECISION rather than as a third column somebody adds by analogy with the first two.
    theTRIGGER: >-
      *** THE THIRD MEMBER OF THIS CATEGORY IS A DECISION, NOT A COLUMN. *** A proposal to add
      one must argue against this section rather than inherit it, and the argument it has to
      beat is the one below. This sentence exists so that the default is a stop rather than a
      copy-paste.
  whyTWOCOLUMNSISRIGHTATTWO:
    theCOSTASYMMETRY: >-
      GETTING IT WRONG IN THE TWO DIRECTIONS COSTS DIFFERENT AMOUNTS. Two columns, and a third
      registration arrives: one additive migration adding a third column, cheap and reversible.
      A generic table now, and it is wrong: the type vocabulary, the per-type validation
      dispatch and the per-type verification model were all designed against TWO KNOWN INSTANCES
      AND A GUESS, and a wrong generic model is paid again at every subsequent type. `0030`'s
      rule points the same way — a limit worked around by configuration is reversible; one
      worked around by changing the shape of the data is paid for once and then forever.
    theWRITECOSTPRECEDENTISEXACT: >-
      `docs/decisions/0019` DECIDED THIS EXACT TRADE FOR PERMISSION GRANTS AND CHOSE THE COLUMN:
      *"a `role` on the membership row — not a grant table, because one row per permission per
      principal is decisive against `0008`'s write ceiling while a column costs ZERO ADDITIONAL
      ROWS."* A registration table costs a row-write and an index entry per registration, on a
      platform whose binding constraint is 100,000 D1 row-writes per day account-wide. Two
      columns on a row that is already being written cost nothing.
    andITWOULDBEAJOINONACONTROLPLANEREADPATH: >-
      `0002_organization.sql` has ONE query in the whole repository and it is a point lookup
      inside `findMembershipWithOrganization`. A registrations table would add a second read to
      every detail page, and `organization-detail-v1`'s theOnePageOneRequestRule exists because
      in this class a read costs writes.
  whatTHESHAREDDEFINITIONBUYS: >-
    *** IT IS WHY THIS IS NOT MERELY DEFERRING THE DECISION. *** Because CR and VAT are the same
    shape rather than two hand-rolled field sets, a future generic table is a TRANSPOSITION of a
    shape that already exists rather than a redesign of two that disagree. The failure mode this
    avoids is the ordinary one: two similar fields authored a week apart, one with a verification
    object and one with a boolean, and a third arriving with neither — at which point the generic
    model has to reconcile three vocabularies before it can start.
  theHONESTLIMIT: >-
    THE SHARED SHAPE IS PERMISSIVE BECAUSE DUDO HOLDS AN AUTHORITATIVE FORMAT SPECIFICATION FOR
    NEITHER MEMBER. The day it holds one for either, that definition splits — see
    theFormatRuling, which has the SAME trigger. A reader should notice that the category
    argument and the format argument are the same argument about the same ignorance.

# ---------------------------------------------------------------------------
# theSensitivityRuling — is a VAT change audited, and is it critical
# ---------------------------------------------------------------------------
theSensitivityRuling:
  ruling: >-
    *** AUDITED: YES, UNCONDITIONALLY AND IN BOTH HOMES. `critical`: NO. THE ROUTE IS
    `sensitive` AND REQUIRES NO CONFIRMATION. *** And that answer is the same for the VAT
    number, the commercial registration and the display name, deliberately — see below for why
    splitting them would be worse than either answer.
  theARGUMENTFORcritical_STATEDATITSSTRONGEST: >-
    IT IS A GOOD ARGUMENT AND IT IS WORTH LOSING TO A BETTER ONE. If Dudo ever issues an
    invoice, this number appears on a tax document; a wrong one is the customer's LEGAL problem
    rather than a cosmetic defect; a document once issued cannot be un-issued; and the
    confirmation mechanism exists, is deployed, and costs one round trip on a field that changes
    approximately never. Cheap insurance against an expensive, irreversible, third-party-visible
    error.
  whyITLOSES:
    theCLASSIFICATIONWOULDSTOPDISCRIMINATING: >-
      *** THIS IS THE DECIDING REASON. *** If VAT is `critical` BECAUSE THE VALUE MAY LATER
      APPEAR ON A DOCUMENT, then so is the commercial registration, and so is the display name —
      an invoice headed with the wrong company name is also the customer's problem. The
      justification generalises to every field on the record and has no boundary, so adopting it
      makes every field `critical` and the ladder stops sorting anything. `0026` protected the
      top rung from being VACATED; the same argument protects it from being FLOODED, and a rung
      that admits everything serious is exactly as useless as one that admits nothing.
    theLADDERGRADESTHEOPERATION_NOTTHEDOWNSTREAMUSE: >-
      AUTHORIZATION_STANDARD.md §6's `critical` examples are *"move money, delete data
      irreversibly, rotate credentials, uninstall an App with delete disposition, grant platform
      scope"* — every one of them a property OF THE OPERATION. This operation replaces a
      correctable field on a mutable record. Nothing is destroyed, no money moves, no authority
      changes, and a wrong value is fixed by the same route that set it. `0026` reclassified
      `core.organization.create` DOWN to `sensitive` on exactly this reasoning, and creating a
      whole tenant is a larger act than editing one of its fields.
    theIRREVERSIBILITYISCONTINGENTONASYSTEMTHATDOESNOTEXIST: >-
      THERE IS NO INVOICING APP, NO TAX DOCUMENT AND NOTHING THAT READS THIS FIELD. `0027`
      refused to specify MFA for precisely this reason — *"specifying it would ship a control
      that is a comment"* — and gating a field today against a consumer that does not exist is
      the same purchase.
  whatREPLACESIT_ANDITISABETTERCONTROLTHANACONFIRMATION: >-
    *** THE VERIFICATION RECORD ACTS AT THE POINT OF HARM RATHER THAN AT THE POINT OF ENTRY. ***
    A confirmation prompt asks an operator to press a second button while looking at the same
    number they just mistyped; it proves intent and presence and says nothing about CORRECTNESS.
    The verification object says who checked this specific value against the issuing registry
    and when — so a future surface that renders a VAT number onto a document can REFUSE TO
    RENDER AN UNVERIFIED ONE, or mark it, which is a control the confirmation mechanism cannot
    provide at any sensitivity.
  theRECLASSIFICATIONTRIGGER_STATEDASAREASONANDASSIGNEDTOANOWNER:
    theReason: >-
      THE CLASSIFICATION IS `sensitive` BECAUSE THIS RECORD HAS NO CONSUMER. What would make it
      `critical` is a consumer that renders one of these values onto A DOCUMENT DUDO ISSUES ON
      THE CUSTOMER'S BEHALF, because such a document cannot be un-issued and the operation would
      then have an irreversible downstream effect rather than a correctable local one.
    theOwner: >-
      *** THE CONTRACT THAT FIRST PUBLISHES SUCH A CONSUMER OWNS THE RECLASSIFICATION, AND IT IS
      A PRECONDITION OF CONSUMING THE FIELD RATHER THAN A FOLLOW-UP. *** Written this way on
      purpose: `workflow.md` §12 warns against clauses of the form "if X is decided the other
      way this file is wrong", which create an obligation nobody is assigned to collect. THE
      REASON ABOVE SURVIVES ANY DECISION; the obligation has a named holder.
  theAUDITRULING:
    ruling: >-
      EVERY CALL WRITES A PLATFORM-OPERATOR RECORD (P4, as every route in this class does) AND A
      TENANT-SIDE `audit_event` INTO THE ORGANIZATION IT NAMES. `sensitive` requires an audit
      event under §6 AND NO EXCEPTION IS TAKEN HERE — this is a write, it is rare, and none of
      the arguments that earned `audit-read-v1` its exception apply to a mutation.
    whyTHETENANTSIDERECORDISNOTOPTIONAL: >-
      `0028` IS THE WHOLE ARGUMENT AND IT LANDS HARDER HERE THAN ANYWHERE IT HAS LANDED SO FAR.
      A platform operator EDITING A CUSTOMER'S LEGAL IDENTIFIERS is as clear a case of "something
      the platform did to you" as the surface contains, and a customer who cannot see it cannot
      discover that their VAT number was changed by someone outside their company. With
      `audit-read-v1`'s platform feed it becomes readable by the party it concerns; without it
      the record is written and unreadable, which is the state `0028`'s amendment named.
    theLIMITOFTHATTRAIL_STATEDPLAINLY: >-
      *** THE AUDIT TRAIL PROVES THAT A REGISTRATION CHANGED AND BY WHOM. IT CANNOT PROVE WHAT
      THE VALUE WAS BEFORE. *** `audit.ts` has nowhere to put a value — `changedFieldNames`
      carries FIELD NAMES ONLY and the pattern is "deliberately too narrow to admit a value" —
      so the record says `vat_number` changed and never says from what. FOR A FIELD WHOSE POINT
      IS LEGAL PROVENANCE THAT IS A REAL LIMIT, it is not repaired by widening the audit record
      (which would make the trail a second copy of the data), and the answer if it is ever needed
      is value history on the record itself. Recorded as `OI-2`.

# ---------------------------------------------------------------------------
# theUniquenessRuling — is display_name unique, and across what
# ---------------------------------------------------------------------------
theUniquenessRuling:
  ruling: >-
    *** NO UNIQUENESS CONSTRAINT ON `display_name`, AT ANY SCOPE. *** No unique index, no
    application-level check, no "name already taken" refusal. Two Organizations may hold the
    same name and nothing in Dudo notices.
  why:
    theMARKETREASON: >-
      TWO ORGANIZATIONS NAMED "Al Salam Trading" IS ORDINARY IN ONE MARKET, not a collision to
      resolve. A constraint would refuse the second LEGITIMATE customer at onboarding, and the
      refusal lands on an operator mid-onboarding whose only remedy is to invent a name the
      customer does not use — corrupting the record to satisfy a constraint that had no reason
      to exist.
    theSTRUCTURALREASON_ANDITISTHEDECIDINGONE: >-
      *** UNIQUE ACROSS WHAT? PLATFORM-WIDE IS THE ONLY SCOPE THAT EXISTS, AND A PLATFORM-WIDE
      UNIQUE NAME IS A CROSS-TENANT COUPLING. *** Customer A's choice would constrain customer
      B's, which is the shape multi-tenancy exists to prevent. AND THE REFUSAL IS AN EXISTENCE
      ORACLE: "that name is taken" tells an operator — and any surface that ever exposes the
      check — that some other Organization holds it. A constraint whose error message discloses
      the existence of another tenant's record is the class of thing this repository has spent
      several contracts closing.
    whatISUNIQUEANDSUFFICES: >-
      `organization_id`, which is, which every reference uses, and which is the only identity
      the system needs. A display name is a LABEL. Treating a label as a key is how a label
      acquires constraints nobody wanted.
  theCOSTSTATEDRATHERTHANSOFTENED: >-
    THE CONSOLE WILL SHOW TWO IDENTICAL ROWS AND AN OPERATOR CANNOT TELL THEM APART FROM THE NAME
    ALONE. That is real. THE REMEDY IS DISAMBIGUATION IN THE UI — show the commercial
    registration, the creation date, or the identifier alongside the name — AND NOT A CONSTRAINT
    ON THE DATA. Fixing a rendering problem in the schema is how a record acquires rules that
    outlive the screen that wanted them.
  andTHECRNUMBERISNOTUNIQUEEITHER:
    theTemptation: >-
      A COMMERCIAL REGISTRATION NUMBER IS ISSUED BY AN AUTHORITY PRECISELY TO BE UNIQUE, so it
      looks like the natural key this record lacks, and the argument for constraining it is much
      stronger than for the name.
    ruling: "NOT UNIQUE. NO CONSTRAINT."
    why: >-
      *** BECAUSE IT IS OPERATOR-ENTERED AND UNVERIFIED, SO A UNIQUENESS CONSTRAINT ENFORCES THE
      UNIQUENESS OF TYPOS. *** One mistyped CR against the wrong Organization would permanently
      block the real holder from ever being recorded, and the operator resolving it would be told
      only that the value is taken — by an Organization they may not be able to identify. The
      constraint's failure mode is worse than the duplicate it prevents.
    whatWOULDMAKEITPOSSIBLE: >-
      IF CR UNIQUENESS IS EVER WANTED IT MUST BE SCOPED TO **VERIFIED** REGISTRATIONS ONLY —
      where an authority has been consulted, a duplicate is a genuine finding rather than a
      typo — AND ITS REFUSAL MUST NOT NAME OR IMPLY THE HOLDER. Recorded as `OI-4`.
    whyTHENORMALISATIONQUESTIONISEASYHERE: >-
      WORTH NOTICING BECAUSE IT IS THE SAME RULING SEEN TWICE. Whether "220 0123 4567" equals
      "2200123 4567" only matters if something COMPARES them. Nothing does, so both are stored as
      entered after trimming and collapsing internal whitespace runs, and NO separator-stripping
      canonical form is defined. THE DAY EITHER FIELD BECOMES UNIQUE, A COMPARISON FORM BECOMES
      MANDATORY AND IS A NEW DECISION — the two questions are one question.

# ---------------------------------------------------------------------------
# theExistingOrganizationsRuling — the three that already exist
# ---------------------------------------------------------------------------
theExistingOrganizationsRuling:
  ruling: >-
    *** A NULLABLE COLUMN. NO BACKFILL, NO DEFAULT, NO SENTINEL, AND NO SEPARATE "unnamed"
    STATE. *** `display_name TEXT` with no `NOT NULL`. The three existing Organizations have
    `NULL`, which means NO NAME HAS BEEN RECORDED, and the two registrations are `not_recorded`.
  whyNOTnotNullWITHADEFAULT: >-
    *** A DEFAULT WOULD INVENT A NAME, AND AN INVENTED NAME IS INDISTINGUISHABLE FROM ONE AN
    OPERATOR TYPED, FOREVER. *** `'Organization ' || organization_id` looks harmless in a
    migration and is a value nobody can later tell from a real one — the migration would be the
    last place the difference existed. The brief's own constraint settles it too: THE MIGRATION
    MUST NOT REQUIRE A VALUE IT CANNOT SUPPLY, and it cannot supply three names without asking
    someone what those businesses are called.
  whyNOTABACKFILL: >-
    A backfill is a migration writing business-ish data it had to obtain from a human. The three
    names exist only in somebody's head, and putting them in a migration file makes them
    unreviewable and unrepeatable. THE UPDATE ROUTE IS THE BACKFILL, performed by an operator who
    knows the answer, audited, and visible to the customer.
  whyNOTADISTINCTunnamedSTATE: >-
    NULL ALREADY IS THAT STATE. A second field asserting namelessness beside a null name is a new
    way for the two to disagree — the same objection this author raised to an `origin` column in
    `audit-read-v1` when `scope` already carried the answer. One fact, one field.
  theASYMMETRYTHATMATTERS:
    theARGUMENT: >-
      *** THE COLUMN IS NULLABLE BECAUSE OF HISTORY; ONBOARDING IS WHAT KEEPS THE NULLS
      HISTORICAL. *** If onboarding refuses to create a nameless Organization, the nameless set is
      CLOSED AT THREE and shrinks as an operator names them. Saying only "the column is nullable"
      would leave a future route free to create more, which is how a legacy state becomes a
      permanent one.
    itISNOTTRUEYET_ANDTHATISNOTAQUALIFICATION: >-
      *** ON THE TEAM LEAD'S SEQUENCING RULING OF 2026-09-07, `display_name` IS **OPTIONAL** ON
      ONBOARDING SO THAT THE CONSOLE CAN SHIP FIRST — A SERVER REQUIRING A FIELD THE DEPLOYED
      CLIENT DOES NOT SEND IS AN ONBOARDING OUTAGE. SO THE SET IS OPEN, EVERY ONBOARDING IN THIS
      WINDOW CAN CREATE A FOURTH NAMELESS ORGANIZATION, AND THE ARGUMENT ABOVE IS SUSPENDED
      RATHER THAN ESTABLISHED. ***
      THIS PARAGRAPH EXISTS SO THAT THE ARGUMENT IS NOT READ AS ALREADY TRUE. The nullable column
      is still the right answer for the three that exist, on the migration-cannot-invent-a-name
      reasoning above, which does not depend on this. What depends on this is the claim that the
      set shrinks — and that claim becomes true when `ON-7` is discharged and not before.
    theFOLLOWUP: "`ON-7` in organization-onboarding-v1, owned by the change that follows the console's release."
  theCLIENTOBLIGATIONISUNCHANGEDANDALREADYSHIPPED: >-
    RENDER `organization_id` VERBATIM WHEN `display_name` IS NULL. Not a blank, not a dash, not
    "Unnamed Organization". It is stated identically in `organization-detail-v1`,
    `platform-operator-v1` and `session-route-handlers.ts`, it is already deployed, and this
    contract does not soften it. SO NOTHING CHANGES FOR EITHER CLIENT ON THE DAY THIS LANDS, and
    everything improves the first time an operator sets a name.

# ---------------------------------------------------------------------------
# theFormatRuling — the fifteen digits that are NOT in this contract
# ---------------------------------------------------------------------------
theFormatRuling:
  ruling: >-
    *** NO DIGIT COUNT AND NO PER-JURISDICTION FORMAT IN ANY PATTERN IN THIS CONTRACT. ***
    `registrationNumber` constrains only hygiene: 1–32 characters, alphanumerics with interior
    spaces and hyphens, no leading or trailing separator, no control characters.
  whyNOT_15_DIGITS: >-
    BAHRAIN VAT ACCOUNT NUMBERS ARE WIDELY REPORTED AS FIFTEEN NUMERIC DIGITS AND THAT FIGURE IS
    NOT IN THIS FILE. It comes from secondary sources, one of which recorded that it was awaiting
    clarification from the authority, and NO AUTHORITATIVE SPECIFICATION WAS AVAILABLE TO THIS
    AUTHOR. *** A PATTERN IS A REFUSAL. *** An at-count pattern that is wrong refuses a LEGAL
    registration, and the failure lands on a customer who cannot be onboarded and an operator
    whose only remedy is to enter something false. This repository shipped an at-count pattern
    that was wrong in three contracts on 2026-09-05 and spent a day correcting it; the lesson is
    not "check harder" but "do not encode a remembered figure as a constraint".
  theASYMMETRYTHATDECIDESIT: >-
    A PATTERN THAT IS TOO NARROW FAILS CLOSED AGAINST A REAL CUSTOMER. A pattern that is too wide
    accepts a typo THAT THE VERIFICATION RECORD IS THERE TO CATCH. One failure mode is a customer
    who cannot use the product; the other is a field marked unverified. They are not comparable.
  howANARROWERPATTERNMAYBEADDED: >-
    IT IS **BREAKING** UNDER API_STANDARD.md §6, because it narrows an accepted set, SO IT
    REQUIRES A DECISION RECORD — and that record must cite the issuing authority's published
    specification BY DOCUMENT AND DATE, not a summary of it. THE ORDERING IS DELIBERATE: it makes
    a well-sourced constraint straightforward and a remembered one expensive, which is the
    inverse of the pressure that produces this defect.
  andTHECRHASNOPATTERNEITHER_FORAWEAKERREASON: >-
    STATED SEPARATELY SO IT IS NOT READ AS THE SAME FINDING. For VAT there is a specific reported
    figure that is deliberately not encoded. FOR THE COMMERCIAL REGISTRATION THIS AUTHOR HAS NO
    FIGURE AT ALL, reported or otherwise. Both end with no pattern; only one of them ends there
    after refusing something.

# ---------------------------------------------------------------------------
# theThreeStates — why a registration is not a nullable string
# ---------------------------------------------------------------------------
theThreeStates:
  ruling: >-
    EVERY REGISTRATION IS A DISCRIMINATED UNION OVER THREE STATES: `not_recorded`,
    `not_registered`, `registered`. A nullable number is REFUSED as a shape.
  theDISTINCTIONTHATISDESTROYEDBYCOLLAPSING: >-
    *** "THEY TOLD US THEY ARE NOT REGISTERED" AND "WE NEVER ASKED" ARE DIFFERENT FACTS. ***
    Merged into one null, you cannot decide whether to prompt, you cannot report coverage, and
    you cannot defend the record later — "why is there no VAT number here" has two answers and
    the record kept neither. Bahrain VAT registration is mandatory above an annual-supplies
    threshold and voluntary below it, so `not_registered` IS A LEGITIMATE PERMANENT STATE rather
    than an unfilled field, and a design that treats it as missing data will keep prompting a
    customer who has already answered.
  itISTHESAMEDISTINCTIONONELEVELUP: >-
    `session-route-handlers.ts` already rules on absent-versus-null for `display_name`:
    *"absent-versus-null is a distinction two clients resolve differently — 'the web app shows a
    blank and the iPhone app shows nothing' is exactly the divergence the one-contract rule
    exists to prevent."* HERE THE DIFFERENCE IS NOT ABOUT RENDERING BUT ABOUT A FACT CONCERNING
    THE CUSTOMER, which is why it is a state rather than a nullability question.
  whyAUNIONANDNOTASTATEFIELDBESIDEANULLABLENUMBER: >-
    SO THAT `{state: 'not_registered', number: '123'}` CANNOT BE WRITTEN. It is
    `PlatformActionTarget`'s device and its reasoning transfers unchanged: *"a target kind that
    disagreed with its identifier would be a log line nobody could interpret afterwards ... it is
    read once, years later, by someone who cannot ask."* A tax identifier is read exactly that
    way.
  theCRGETSTHESAMETHREESTATES: >-
    AND THIS AUTHOR DOES NOT NEED TO KNOW BAHRAINI LAW TO JUSTIFY IT, WHICH IS THE POINT.
    Whether every entity Dudo serves must hold a commercial registration is a question about a
    jurisdiction; whether "we never asked" differs from "they have none" is a question about
    records, and it has the same answer everywhere. THE SHAPE IS CHOSEN SO THAT THE LEGAL
    QUESTION DOES NOT HAVE TO BE ANSWERED TO USE IT — and if the answer turns out to be "every
    such entity has one", the `not_registered` state simply goes unused, which costs nothing.

# ---------------------------------------------------------------------------
# theTenantCannotEnterTheirOwn — a finding, not a design choice
# ---------------------------------------------------------------------------
theTenantCannotEnterTheirOwn:
  finding: >-
    *** THE PARTY BEST PLACED TO KNOW THESE VALUES CANNOT ENTER THEM, AND THAT IS STRUCTURAL
    RATHER THAN CHOSEN. *** `organization` is a CONTROL-PLANE table. An Action receives
    `ActionContext`, which carries a tenant-data store and no control-plane port;
    `identity/control-plane-store.ts` states in terms that nothing puts either half of that port
    on `ActionContext` and that "if this ever becomes reachable from `ActionContext`, `CO1` is
    violated in one line". SO NO TENANT ROUTE CAN WRITE THIS RECORD, and `core.organization.update`
    — declared `[organization]`, held by `business-owner` — has no route and cannot be given one
    over this table today.
  theCONSEQUENCE: >-
    A CUSTOMER'S OWN VAT NUMBER IS ENTERED BY A DUDO OPERATOR, ON THE CUSTOMER'S WORD, FOREVER —
    until either the Organization profile moves out of the control plane or a control-plane-write
    Action class is designed. That is a support burden, a transcription-error surface, and a
    privacy asymmetry: the customer cannot correct their own record.
  whatITSTRENGTHENS: >-
    IT IS THE STRONGEST ARGUMENT IN THIS CONTRACT FOR THE VERIFICATION OBJECT AND FOR THE
    TENANT-SIDE AUDIT RECORD. The operator is transcribing something they were told, so the
    record must say who transcribed it and whether anyone checked it; and the customer must be
    able to SEE that it happened, because they cannot see the field itself. Recorded as `OI-1`.

# ---------------------------------------------------------------------------
# operations
# ---------------------------------------------------------------------------
basePath: "/api/v1/platform"

operations:

  # =======================================================================================
  - id: platform.organizations.identity.update
    title: "Set an Organization's name and registrations"
    method: PATCH
    path: "/organizations/{organization_id}/identity"
    surface: platform
    provenance: "NEW WORK."
    description: >-
      Set or change an Organization's display name, its commercial registration and its VAT
      registration. Partial: an omitted field is unchanged, a present field is replaced whole.
      THIS IS ALSO THE BACKFILL for the Organizations that predate the name column.
    permission: core.platform-organization.update
    scope: platform
    request: { schemaRef: "urn:dudo:schema:organization-identity:1#/$defs/updateOrganizationIdentityInput" }
    response: { schemaRef: "urn:dudo:schema:organization-identity:1#/$defs/updateOrganizationIdentityOutput" }
    successStatus: 200
    errors: [invalid_argument, unauthenticated, forbidden, not_found, rate_limited, quota_exceeded, unavailable]
    maxRowWrites: 7
    audit: required
    confirmation: not-required
    theFIGURESUMSTWOLEDGERSANDTHESCALARCANNOTSAYSO: >-
      *** THIS FIGURE SPANS TWO SEPARATE BUDGETS THAT REFUSE INDEPENDENTLY, AND THE FIELD HAS NO WAY
      TO EXPRESS THAT. *** Added 2026-09-11. A class of two — the other is
      `platform.organizations.set-template` in template-lifecycle-v1, which carries the same note.
        PART lands against the OPERATOR's control-plane budget — `PER_PRINCIPAL_DAILY_ROW_WRITES`.
          The P4 audit record plus the `organization` row update.
        PART lands against the NAMED ORGANIZATION's own allocation — the docs/decisions/0028
          `audit_event` write, additionally sub-capped by `PLATFORM_ORIGINATED_DAILY_ROW_WRITES`,
          the ceiling keyed to the VICTIM rather than to the caller.
      *** SO THE SCALAR IS UNUSABLE FOR EITHER QUESTION IT LOOKS LIKE IT ANSWERS: *** checked against
      the control-plane allowance it overstates, checked against a customer's allocation it
      overstates, and nothing in the number says which half is which. A security review derived a
      free-tier threshold from a declared figure on 2026-09-11 and was wrong by a factor of two.
      *** THE NUMBER 7 IS ALSO STALE, AND IT IS DELIBERATELY NOT CORRECTED HERE. *** It was right
      when written, with the P4 audit record at 2; `0016_platform_operator_action_indexes.sql` took
      that constant to 4 and nothing moved the contract figures.
      IT IS NOT SWEPT BECAUSE NOTHING CAN VERIFY THE RESULT. `scripts/check-row-writes.mjs` is keyed
      on the declared `requestClass:`, THIS OPERATION DECLARES NONE (docs/decisions/0039 phase 1), and
      a hand-corrected figure no check can hold is the transcribed fact this whole sweep is about,
      one iteration later. THE TRIGGER IS THIS CONTRACT DECLARING ITS CLASS — at which point the
      check holds the route and the figure is corrected against a measurement, as
      set-template's was.
      READ `PLATFORM_OPERATOR_ACTION_ROW_WRITES` IN platform/core/identity/control-plane-admission.ts
      RATHER THAN THIS FIGURE. workflow.md §11a: name the authority, never the value.

    theNEWPERMISSION:
      ruling: >-
        IT DECLARES A NEW PLATFORM-SCOPED PERMISSION, `core.platform-organization.update`, WHICH
        THIS CONTRACT REQUESTS AND DOES NOT GRANT. Adding it to `platform-admin` is the Team
        Lead's, and no agent may grant a permission (.claude/rules/security.md §8).
      whyNOTcore_organization_update: >-
        THAT PERMISSION IS DECLARED `[organization]` AND MUST STAY THERE. It is a TENANT
        principal editing its own Organization record, and adding `platform` to its `scopes` is
        the AZ8 escalation the catalog names — *"widening a tenant-scoped permission above the
        tenant boundary is an escalation, not a convenience"* — and the one it already removed
        from `marketplace-moderator`.
      whyANEWONEISJUSTIFIEDHEREWHENITWASNOTFORTHEDETAILREAD: >-
        *** THE DISTINCTION IS READ VERSUS WRITE AND IT IS WORTH STATING, BECAUSE
        `organization-detail-v1` RULED THE OTHER WAY ON A NEIGHBOURING ROUTE. *** It declined to
        invent `core.organization.read-platform` because such a permission *"would be deniable to
        nobody"* — an operator who cannot enumerate cannot reach a detail page, so the split was
        ceremony. A WRITE PERMISSION IS GENUINELY SEPARATELY DENIABLE: a role that may enumerate
        and read Organizations but not edit their legal identifiers is a real, wantable role, and
        it is the read-only reviewer that `PA-1` and `OP-2` both anticipate. The ceremony argument
        does not reach a mutation.
      theNAMINGANDITSIMPERFECTION: >-
        `core.platform-audit.read` IS THE ONLY EXISTING PLATFORM TWIN OF A TENANT PERMISSION AND
        ITS CONVENTION IS FOLLOWED: the resource carries `platform-`, so this is
        `core.platform-organization.update`. THE ANALOGY IS IMPERFECT AND SAYING SO IS BETTER
        THAN INVENTING A SECOND CONVENTION — there the two permissions cover DIFFERENT OBJECTS
        (the operator log and the tenant trail), whereas here they cover the same Organization
        and differ in the CALLER CLASS. Consistency with the one precedent was preferred to a new
        naming scheme for one permission.
      whatITDOESNOTCOVER: >-
        NOT SUSPENSION, NOT DELETION, NOT STATUS OF ANY KIND. `status` is not in any shape in this
        contract and this permission must never come to imply authority over it. A suspend route,
        when it exists, is a separate permission and a separate argument — `0028`'s splitting
        discipline (list from read, export from read, grant from revoke), applied before rather
        than after.

    theWRITECOST:
      # =====================================================================================
      # *** WRITTEN AS A SHAPE OVER NAMED CONSTANTS FIRST AND A FIGURE SECOND. CORRECTED
      # 2026-09-07, AND THE CORRECTION IS THE ARGUMENT FOR THE FORM. ***
      #
      # This said 5, composed as "the organization row (1), the platform-operator audit record
      # (2), and the reservation for the tenant-side write (2)". Migration `0016` added two
      # indexes to `platform_operator_action` and `PLATFORM_OPERATOR_ACTION_ROW_WRITES` moved
      # from 2 to 4 in the same change, so the figure was wrong the moment a migration in
      # another directory landed. NOTHING COMPARED THE TWO AND NOTHING COULD: the contract
      # cannot see the constant, and the failure is silent in the dangerous direction —
      # under-reserving is an outage (`0014` §A.12).
      # =====================================================================================
      shape: >-
        ORGANIZATION_UPDATE_ROW_WRITES + PLATFORM_OPERATOR_ACTION_ROW_WRITES + the tenant-write
        reservation. ALL THREE ARE CORE'S, IN `identity/control-plane-admission.ts`, AND THE
        SHAPE IS WHAT THIS CONTRACT BINDS. The figure below is a transcription of it on one day.
      theComponents:
        - "ORGANIZATION_UPDATE_ROW_WRITES — the `organization` row. ONE, not two: it is an UPDATE of thirteen non-key columns on an existing row, and `0002_organization.sql` gives that table no secondary index, so nothing else is maintained."
        - "PLATFORM_OPERATOR_ACTION_ROW_WRITES — the platform-operator audit record. P4 makes every route in this class write one, including the reads."
        - "The tenant-write reservation, counted as 2, which is the convention `organization-detail-v1` and `platform-audit-read-v1` both use for a route that also writes tenant-side."
      figureOn_2026_09_07: >-
        1 + 4 + 2 = **7** CONTROL-PLANE ROW-WRITES. Read from
        `identity/control-plane-admission.ts` on the day of writing rather than remembered.
      theTenantSide: >-
        A FURTHER 5 ROW-WRITES INTO THE ORGANIZATION'S OWN `business` ALLOCATION for the
        `audit_event` row. TWO LEDGERS, BOTH RESERVED, and `0016` did not touch the second one.
      ifTheyDISAGREE: >-
        *** THE CONSTANTS ARE RIGHT AND THIS FIGURE IS WRONG. *** Core is the source; this is the
        transcription. An implementer finding a mismatch reserves from the constants and reports
        the contract, which is what `core-agent` did on 2026-09-07 rather than implementing to a
        number it knew was stale.

    theTENANTSIDERECORD:
      ruling: >-
        THIS ROUTE WRITES A TENANT-SIDE AUDIT RECORD INTO THE NAMED ORGANIZATION, ON EVERY
        SUCCESSFUL CALL. `action_id` is `platform.organizations.identity.update`, `permission_id`
        is `core.platform-organization.update`, and `target_resource_id` is NULL — the operation
        names no principal.
      why: >-
        `0028`'s PRINCIPLE, AND THIS IS THE CLEAREST INSTANCE OF IT THE SURFACE HAS. A platform
        operator changing a customer's legal identifiers is unambiguously "something the platform
        did to you", and the customer cannot see the field any other way (theTenantCannotEnterTheirOwn).
        With `audit-read-v1`'s platform feed the customer reads it; without that contract this
        record is written and unreadable, which is exactly the state `0028`'s amendment recorded.
      itIsTHEFOURTHOPERATIONTONEEDTHISWRITE_ANDTHATWASNAMEDINADVANCE: >-
        `directory/member-resolution.ts` says: *"If a fourth operation ever needs this, the right
        move is a named `TenantAuditAppender` port rather than a third method here — and that is
        the point at which to ask whether P1 still means anything."* THE OPERATIONS NEEDING IT ARE
        NOW THE RESOLVE, THE SCOPED AUDIT FEED, THE CREDENTIAL RESET AND THIS. **THE FOURTH HAS
        ARRIVED AND THE QUESTION IT NAMED IS DUE.** This contract does not add a fourth COMPONENT
        that can reach a tenant store — it reuses `directory/` — but it is the fourth OPERATION,
        which is what that sentence counted.

    theHAZARDINTHEEXISTINGWRITER:
      finding: >-
        *** REPORTED TO CORE-AGENT: `recordOrganizationAccess` DERIVES `permissionId` FROM A
        TWO-VALUE TERNARY AND A THIRD CALLER IS SILENTLY MISLABELLED. ***
        `member-resolution.ts` sets it as
        `actionId === 'platform.organizations.members.resolve' ? 'core.credential.reset' :
        'core.platform-audit.read'`, so ANY new caller lands in the else branch and its tenant
        record claims the permission exercised was `core.platform-audit.read`.
      whyITMATTERS: >-
        THE TENANT'S OWN TRAIL WOULD SAY THE PLATFORM READ THEIR AUDIT LOG WHEN IT ACTUALLY
        EDITED THEIR VAT NUMBER. A wrong value in an audit record is worse than a missing one,
        because it defends itself — and `audit-read-v1`'s platform feed renders `permission_id`
        to the customer as "under what authority", so the customer would be shown a false answer
        to the question the field exists to answer.
      whatISOWED: >-
        THE PERMISSION MUST BE A PARAMETER, NOT A BRANCH. That is `architecture.md` §3a's shape —
        a value the write REQUIRES rather than a mapping the writer remembers. IT IS CORE'S FIX
        AND IS REPORTED RATHER THAN PERFORMED. This route MUST NOT be implemented against the
        current signature.

    notFound: >-
      An unknown `organization_id` returns the argument-free 404, on the reasoning
      `organization-detail-v1` records and explicitly scopes to this class: every caller who can
      reach this route can already enumerate every Organization, so the distinction discloses
      nothing. DO NOT COPY IT TO A ROUTE A TENANT PRINCIPAL CAN REACH.
    emptyBodyIsRefused: >-
      A REQUEST CHANGING NOTHING IS `invalid_argument` (`minProperties: 1`), NOT AN ACCEPTED
      NO-OP. A no-op here still writes a platform record and FIVE ROW-WRITES INTO THE CUSTOMER'S
      OWN DAILY ALLOCATION — spending a customer's budget to change nothing is not a request that
      should be accepted, and `0028`'s amendment measured what happens when platform-originated
      tenant writes are cheap to produce.
    confirmationIsNOTREQUIRED_ANDONENOTEFORLATER: >-
      `sensitive`, so `0007` D15 does not engage. IF IT IS EVER RECLASSIFIED `critical`, `0029`
      ALREADY COVERS THE BINDING CORRECTLY — the confirmed object is the body union the route's
      declared PATH parameters, so `organization_id` is bound and a confirmation minted for one
      Organization cannot be spent on another. That was not true before `0029` and is worth
      knowing before anyone reclassifies.
    notes: >-
      THE RESPONSE IS THE WHOLE IDENTITY BLOCK, not the fields that were sent, so a console
      re-renders without a second read — `organization-detail-v1`'s theOnePageOneRequestRule, and
      it matters here for the same reason: in this class a read costs writes. IT ALSO SHOWS THE
      OPERATOR THE CONSEQUENCE THEY ARE LEAST LIKELY TO EXPECT, which is that editing a number
      cleared its verification.

# ---------------------------------------------------------------------------
# consequentialChanges — WHAT THIS CONTRACT REQUIRES ELSEWHERE AND DOES NOT DO
#
# THREE ACCEPTED CONTRACTS, ONE MIGRATION AND ONE CORE MODULE MUST CHANGE. NONE OF THEM IS
# CHANGED HERE. One is BREAKING, and applying the additive two alone would leave the set in a
# state where a console can READ a field that onboarding cannot SET — so they are reported as
# one unit for the Team Lead to sequence, per .claude/rules/architecture.md §1.
# ---------------------------------------------------------------------------
consequentialChanges:

  - target: "organization-onboarding-v1 (accepted)"
    status: "APPLIED 2026-09-07, AS OPTIONAL RATHER THAN REQUIRED. Team Lead ruling."
    change: >-
      `display_name` IS ADDED TO `onboardOrganizationInput.properties` AND **NOT** TO ITS
      `required` LIST. The two registrations are NOT added to onboarding: an operator creating a
      tenant rarely has the CR or VAT number in hand, and requiring them would push an invented
      value into a legal field at the one moment the operator cannot pause. They are set
      afterwards by the update route.
    changeClass: additive
    theRULINGTHATCHANGEDTHIS: >-
      *** THIS SECTION ORIGINALLY SPECIFIED THE FIELD AS **REQUIRED** AND CLASSED THE CHANGE AS
      BREAKING. THE TEAM LEAD RULED OPTIONAL ON 2026-09-07 AND THE RULING IS ABOUT SEQUENCE
      RATHER THAN ABOUT THE FIELD. *** Onboarding is how a customer arrives; a server requiring a
      field the deployed console does not yet send is an onboarding outage. The console ships
      first and Core tightens afterwards. IT IS RECORDED HERE RATHER THAN OVERWRITTEN, because a
      reader who finds only the current text cannot tell a deliberate looseness from an
      oversight — and the whole argument below depends on knowing which it is.
    whatTHATCOSTS_ANDITISNOTNOTHING: >-
      *** WHILE THE FIELD IS OPTIONAL, theExistingOrganizationsRuling's CENTRAL CLAIM IS FALSE.
      *** That ruling justifies a nullable column on the ground that "the nameless set is CLOSED
      AT THREE AND SHRINKS", and it is closed only if onboarding refuses to create a fourth. Every
      onboarding in this window can create one. THE ASYMMETRY THAT MAKES THE NULLABLE COLUMN
      CORRECT IS SUSPENDED, NOT ESTABLISHED, and the window's length is the size of the cost.
    theOWNEDFOLLOWUP: >-
      RECORDED AS `ON-7` IN `organization-onboarding-v1`, ASSIGNED TO THE CHANGE THAT FOLLOWS THE
      CONSOLE'S RELEASE rather than to a backlog. Making it `required` is BREAKING under
      API_STANDARD.md §6 and should cost a Team Lead review rather than happen by drift. Written
      as an owned follow-up rather than as a conditional, per `workflow.md` §12: a clause of the
      form "if the console ships, this file is wrong" creates an obligation nobody collects.
    andCOREMUSTNOTSYNTHESISEANAME: >-
      AN OMITTED `display_name` RECORDS NULL. Not the identifier, not the Template's name, not
      the Workspace placeholder. An invented name is indistinguishable from one an operator typed,
      forever — the same reason theExistingOrganizationsRuling refuses a migration default. THIS
      IS THE SHORTCUT THE OPTIONAL WINDOW INVITES, so it is written down before anyone reaches
      for it.

  - target: "organization-detail-v1 (accepted)"
    status: "APPLIED 2026-09-07."
    change: >-
      `organizationDetailOutput` GAINS `commercial_registration` AND `vat_registration`, both
      `$ref` to `registrationRecord`, both added to `required`. `display_name` NEEDS NO SHAPE
      CHANGE — it is already `required` and nullable, and its own description anticipated this
      exactly: *"The day names exist, this stops being null and no shape changes."*
    changeClass: additive
    why: "New response fields on a shape whose description already reserved the ground."

  - target: "platform-operator-v1 (accepted)"
    status: "APPLIED 2026-09-07, including the `required` correction."
    change: >-
      `organizationSummary` GAINS NOTHING AND CARRIES `display_name` VALUES. THE REGISTRATIONS
      ARE DELIBERATELY NOT ADDED TO THE LIST — two registration objects per row inflate every
      page for a listing that needs a label, and the detail route is one click away.
      *** BUT `display_name` MUST MOVE INTO `required`, AND THAT IS A DEFECT RATHER THAN A
      PREFERENCE. *** See `OI-9`: the field is in `properties` and NOT in `required`, so under
      `additionalProperties: false` it is a PERMITTED OPTIONAL FIELD, while its own description
      and the identical field in `organization-detail-v1` both say required-and-nullable. The
      prose says one thing and the machine-readable half says another.
    changeClass: "additive in effect (a client that already handles null handles a present null), but it corrects an existing inconsistency"

  - target: "control-plane/0002_organization.sql (core-agent)"
    change: >-
      THREE NULLABLE COLUMNS: `display_name TEXT`, and the two registrations. NO `NOT NULL`, NO
      DEFAULT, NO BACKFILL, NO NEW INDEX — nothing queries or sorts on these, and an index would
      add a row-write to every Organization write for a table holding at most ten rows in the
      closed beta.
    changeClass: additive
    theSTORAGESHAPEISCORESTOCHOOSE: >-
      WHETHER A REGISTRATION IS ONE JSON COLUMN OR THREE FLAT COLUMNS PER REGISTRATION IS AN
      IMPLEMENTATION DECISION AND THIS CONTRACT DOES NOT MAKE IT. What the contract binds is the
      WIRE SHAPE and the invariant: the three states must be distinguishable in storage, and a
      verification must be impossible to retain across a changed number. A storage form that
      cannot express `not_recorded` distinctly from `not_registered` does not satisfy this
      contract however it renders.
    andITISFROZENUNTILITRUNS: >-
      `0002_organization.sql` says it is NOT APPLIED and that editing it in place is correct
      "ONLY because this migration has never run anywhere". THE BRIEF SAYS THREE ORGANIZATIONS
      EXIST IN PRODUCTION, WHICH MEANS IT HAS RUN. *** IF SO, THIS IS A NEW MIGRATION FILE, NOT AN
      EDIT — and `0001_audit_event.sql`'s rule applies: "From the first time it is applied, the
      additive-only rule takes over and this file is frozen." Core must check which is true
      before touching it. *** Recorded as `OI-7`.

  - target: "platform/core/directory/member-resolution.ts (core-agent)"
    change: >-
      `recordOrganizationAccess` MUST TAKE `permissionId` AS A PARAMETER instead of deriving it
      from a two-value ternary on `actionId`. See theHAZARDINTHEEXISTINGWRITER. THIS ROUTE MUST
      NOT BE IMPLEMENTED AGAINST THE CURRENT SIGNATURE.
    changeClass: "internal — no contract shape changes"

  - target: "permission-catalog.yaml"
    status: "DECLARED 2026-09-07. NOT GRANTED — the grant is the user's and is outstanding."
    change: >-
      `core.platform-organization.update` IS REGISTERED: group `platform`, sensitivity
      `sensitive`, scopes `[platform]`, status proposed, phase 1. IT IS HELD BY NO ROLE.
      GRANTING IT IS A SEPARATE ACT AND NO AGENT MAY PERFORM IT (.claude/rules/security.md §8).
    changeClass: additive
    theORDERINGTHISIMPOSESONCORE: >-
      *** THE MIDDLE STEP FAILS THE BUILD RATHER THAN WARNING, SO IT IS WORTH KNOWING BEFORE
      STARTING. *** `assertEveryRoutePermissionIsReachable` in `platform-routes.ts` fails the
      build when a route declares a permission no role can reach. So: declared (done) → GRANTED
      BY THE USER and transcribed into `platform-permissions.ts` AND added to its
      `HELD_BUT_UNREACHABLE` list → the route lands and leaves that list in the same change.
      BUILDING THE ROUTE BEFORE THE GRANT DOES NOT PRODUCE A `forbidden` SOMEBODY DIAGNOSES; IT
      DOES NOT BUILD. That check exists because the revoke route shipped while its permission was
      unreachable and was `forbidden` to every operator alive.
    andITISTHEELEVENTHPLATFORMSCOPEDPERMISSION: >-
      The invariant recorded above `defaultRoles` covers it without amendment — *"every permission
      held by a role whose own scope is `platform` declares `platform` among that permission's own
      scopes"* — which is the property that block was rewritten to state instead of a count, and
      this addition is the first test of whether that was worth doing.

# ---------------------------------------------------------------------------
# tenancy
# ---------------------------------------------------------------------------
tenancy:
  tenant: none-for-the-write-one-for-the-audit
  ruling: >-
    THE OPERATION READS AND WRITES ONLY THE CONTROL-PLANE `organization` TABLE. It reads no row
    behind `whereWithTenant` and returns no tenant data: a name, a CR and a VAT number are
    facts ABOUT the Organization held in the control plane, not records INSIDE it.
  theBOUNDARYQUESTIONANSWEREDEXPLICITLY: >-
    `organization-detail-v1`'s test is mechanical and this contract is measured against it: *"A
    FIELD IS AVAILABLE TO AN OPERATOR IF AND ONLY IF READING IT REQUIRES NO TENANT STORE."* All
    three fields are control-plane columns, so they pass — AND THE REASON THEY PASS IS WORTH
    STATING BECAUSE IT IS NOT THE REASON A READER MIGHT ASSUME. It is not that a company name is
    "less sensitive" than a Workspace name; `theWorkspaceFinding` is explicit that the intuition
    about structure-versus-content is what the tenancy model ignores. IT IS THAT THESE COLUMNS
    ARE IN THE CONTROL PLANE, and a Workspace name is not.
  theTENANTSIDEWRITE: >-
    Resolves a tenant handle SOLELY to append one audit record, reads no business data through
    it, and the handle's lifetime is the operation — the same review point three other platform
    contracts carry, and the fourth instance of it.
  theISOLATIONTESTFORTHISCONTRACT: >-
    NOT "tenant A must not read tenant B" — there is no tenant on the acting side. WHAT REPLACES
    IT: assert that no response from this route contains a customer, a Workspace, a member, a
    count of any of them, or any field sourced from the tenant database; and assert that a
    request naming Organization A cannot write a `display_name`, a registration OR AN AUDIT
    RECORD into Organization B. ASSERT BY ATTEMPTING IT.

# ---------------------------------------------------------------------------
# events — NONE
# ---------------------------------------------------------------------------
events:
  published: []
  consumed: []
  rationale: >-
    Nothing is published. NO EXISTING EVENT IS DUPLICATED, checked against
    `packages/contracts/registries/event-catalog.yaml`.
  reservedNames: >-
    NONE, AND THE TEMPTING ONE IS NAMED SO IT IS REFUSED DELIBERATELY:
    `OrganizationRegistrationChanged`. It would be a push copy of a control-plane fact travelling
    to somewhere with different access rules, which is `0025` Decision 5's own objection, and the
    subscriber it is imagined for — an invoicing surface — does not exist. THE AUDIT TRAIL
    ALREADY RECORDS THE CHANGE IN BOTH HOMES; an event would be a third copy.

# ---------------------------------------------------------------------------
# mcp — NONE
# ---------------------------------------------------------------------------
mcp:
  tools: []
  rationale: >-
    The operation declares no `mcp` exposure. Exposure is opt-in and nothing becomes an AI tool
    by default. AND IT SHOULD NOT BE ONE LATER: this is a WRITE, by a platform principal, to a
    legal identifier on a customer's record, at a moment when nobody has verified the value. `0007`
    D15's generalisation in `0027` is the relevant rule — *the party being constrained does not
    author the statement of the constraint* — and an AI principal that could set a VAT number
    would be authoring a fact about a company from whatever it was told.

# ---------------------------------------------------------------------------
# freeTierImpact — .claude/rules/architecture.md §6a, docs/decisions/0008
# ---------------------------------------------------------------------------
freeTierImpact:
  allowancesConsumed: [d1-rows-read, d1-rows-written, d1-storage]
  writes: >-
    7 control-plane row-writes plus 5 tenant row-writes per call — the shape and the constants
    are in the operation's theWRITECOST, and this paragraph is the second place the same figure
    is written, which is exactly the duplication that made it wrong. Against the 600/day
    per-principal control-plane ceiling that is ~85 identity updates per operator per UTC day,
    shared with every other platform action.
    CORRECTED 2026-09-07 FROM "5 ... ~120". `0016` added two indexes to
    `platform_operator_action`, taking `PLATFORM_OPERATOR_ACTION_ROW_WRITES` from 2 to 4, and
    every stated cost that includes an audit record moved by exactly 2 across the whole contract
    set. THE DIVISION MOVED FURTHER THAN THE ADDITION: 600/5 is 120 and 600/7 is 85, so a derived
    figure drifts faster than the number it derives from — which is why a per-operator-per-day
    rate is the worst thing to write down and the easiest to believe.
  reads: "One point read of `organization` before the update. Not a measurable term against 5,000,000 rows/day."
  storage: >-
    THREE COLUMNS ON A TABLE HOLDING AT MOST TEN ROWS IN THE CLOSED BETA. `0002_organization.sql`
    measures the whole table at "under a kilobyte in total"; this adds a few hundred bytes per
    row at most. NO NEW INDEX, so no per-write index maintenance is added to any existing
    operation — which is the term that would actually have mattered.
  theEXPANDABILITYCHECK_0030: >-
    `0030` REQUIRES THE FREE TIER TO COST CONFIGURATION AND NEVER SCHEMA, and this contract is
    measured against it explicitly because the temptation ran the other way. THE CHEAPEST SHAPE
    WOULD HAVE BEEN TWO PLAIN TEXT COLUMNS holding a number or null — no states, no verification,
    no provenance. THAT IS THE VIOLATION `0030` NAMES BY NAME: denormalising to save row-writes,
    and omitting a record because it costs writes. The three-state union and the verification
    object cost storage measured in bytes on a table of ten rows, and they are the difference
    between a record that can be defended and one that cannot.
  cost: "USD 0 / BD 0 per month. No new table, no new index, no new service, no new binding."

# ---------------------------------------------------------------------------
# testRequirements — assertions, and they instruct
# ---------------------------------------------------------------------------
testRequirements:
  theThreeStates:
    - >-
      `not_recorded` AND `not_registered` ARE DISTINGUISHABLE IN EVERY RESPONSE AND IN STORAGE.
      Set a registration to `not_registered`, read it back, and assert the state AND
      `declared_at`. THE NEGATIVE CONTROL: a storage form that renders both as null must make
      this test RED. If it stays green, the states are being distinguished by the test fixture
      rather than by the system.
    - "A response never carries `{state: 'not_registered'}` alongside a number, or `{state: 'registered'}` without one. Assert the union is enforced, not merely documented."
    - "A registration can move between all three states in both directions, and each transition is reflected on the next read."
  theVerification:
    - >-
      *** CHANGING `number` CLEARS `verification`. *** Record a verified number, then submit a
      different number with `verified: false`, and assert the verification is GONE — not stale,
      not retained. THIS IS THE ASSERTION THE WHOLE VERIFICATION DESIGN TURNS ON: a retained
      verification would name a real operator and a real date against a number nobody checked.
    - "Re-submitting the SAME number with `verified: true` records a verification. Submitting it with `verified: false` clears an existing one."
    - >-
      `verified_by_principal_id` AND `verified_at` ARE SERVER-STAMPED AND CANNOT BE SUPPLIED. A
      request carrying either is `invalid_argument` from `additionalProperties: false`. Assert
      that the stamped principal is the AUTHENTICATED OPERATOR and not any value in the request —
      a receipt minted for A and spent on B is the hole `architecture.md` §3a names.
  theAudit:
    - "Every successful call writes a platform-operator record AND a tenant-side `audit_event` into the named Organization."
    - >-
      THE TENANT RECORD'S `permission_id` IS `core.platform-organization.update` AND NOT
      `core.platform-audit.read`. THIS IS THE CONSTRUCTED FAILING INPUT FOR
      theHAZARDINTHEEXISTINGWRITER: written against today's ternary this test goes RED, which is
      the point of writing it first.
    - "A refused call — unknown Organization, missing permission, empty body — writes NO tenant-side record. The tenant's allocation is not spent on a request that changed nothing."
    - "The audit record names the FIELDS that changed and carries no value. Seed a distinctive VAT number and assert that string appears in no audit record anywhere."
  theExistingOrganizations:
    - >-
      AN ORGANIZATION WITH `display_name` NULL IS RETURNED, RENDERED AND PAGED WITHOUT ERROR by
      every route that carries the field. The three that exist are the fixture; a suite that only
      tests named Organizations will pass on the day the migration lands and fail in the console.
    - >-
      ONBOARDING ACCEPTS A REQUEST WITH NO `display_name` AND RECORDS NULL — *** NOT a synthesised
      name, not the identifier, not the Template's name, not the Workspace placeholder. *** Assert
      the stored value is null, because the shortcut this test guards against produces a
      plausible-looking string that nobody can later tell from a real one.
      THIS CASE INVERTS WHEN `ON-7` IS DISCHARGED: the same request must then be
      `invalid_argument`. WRITE BOTH NOW AND SKIP THE SECOND WITH THE REASON, rather than
      rewriting this one later — `workflow.md` §12 records that a test asserting withdrawn
      behaviour is how a suite drives Core toward the wrong answer with a green run as
      justification, and this case is scheduled to become exactly that.
    - "No route can set `display_name` to null. Renaming is permitted; un-naming is not. THIS IS ABOUT THE UPDATE ROUTE and is unaffected by onboarding's optionality."
  theFormat:
    - >-
      A FIFTEEN-DIGIT VALUE, A FOURTEEN-DIGIT VALUE AND A SIXTEEN-DIGIT VALUE ARE ALL ACCEPTED.
      *** THIS IS A NEGATIVE CONTROL AGAINST A CONSTRAINT NOBODY IS SUPPOSED TO ADD, and it is
      the whole enforcement of theFormatRuling. *** If a future author encodes a remembered digit
      count, two of these three go red and the diff says why.
    - "A value with a leading space, a trailing space, an interior tab, a control character, or 33 characters is `invalid_argument`."
  theUniqueness:
    - >-
      TWO ORGANIZATIONS CAN HOLD THE SAME `display_name`, AND THE SAME COMMERCIAL REGISTRATION
      NUMBER. Assert both succeed. A uniqueness constraint added later makes these RED, which is
      the intended alarm.
  theBoundary:
    - "The response contains no customer, no Workspace, no member, no count of any of them, and no field sourced from the tenant database."
    - "A request naming Organization A writes nothing — no column, no audit record — into Organization B."

# ---------------------------------------------------------------------------
# versioning
# ---------------------------------------------------------------------------
versioning:
  contractVersion: 1
  apiVersion: 1
  changeClass: "additive within this contract; see consequentialChanges for one BREAKING change elsewhere"
  breakingOnceShipped:
    - "Adding a digit count or a per-jurisdiction pattern to `registrationNumber`. It narrows an accepted set and requires a decision record citing the authority's published specification."
    - "Removing a state from either registration union, or collapsing `not_recorded` and `not_registered`."
    - "Adding a uniqueness constraint to `display_name` or to a registration number."
    - "Making `display_name` non-nullable in a response, or permitting it to be set to null in a request."
    - "Changing the route's permission or its evaluated scope."
    - "Splitting `registrationRecord` into two definitions — which is what a per-jurisdiction format would force, and is the reason the split has a decision record attached."
  additive:
    - "A third registration type — BUT SEE theCategoryRuling: it is additive as a SHAPE and is a decision as a DESIGN, and the two must not be confused."
    - "A verification object on the `not_registered` branch."
    - "Adding the registrations to `organizationSummary`, if a listing ever needs them."
    - "Reclassifying the route to `critical` — which adds a confirmation requirement and is breaking for a client that does not obtain one, so it is additive only in the shape sense."
  driftSurfaces: >-
    NAMED, BECAUSE A DUPLICATION NOBODY NAMED IS A DEFECT NOBODY CATCHES.
      1. `displayName`'s pattern and `maxLength` are transcribed from `templateName` and from the
         `display_name` already published in `organization-detail-v1` and `platform-operator-v1`.
         Three files, one bound. A change in one is a contract defect.
      2. THE CLIENT OBLIGATION — render `organization_id` verbatim when `display_name` is null —
         is stated in four places including deployed code. It must hold in BOTH clients.
      3. `registrationRecord` IS ONE DEFINITION USED TWICE ON PURPOSE. If a future edit copies it
         to give CR and VAT different shapes, theCategoryRuling has been reversed without anyone
         deciding to reverse it. That is the specific way this contract degrades.

# ---------------------------------------------------------------------------
# openQuestions
# ---------------------------------------------------------------------------
openQuestions:
  - id: OI-1
    question: >-
      THE CUSTOMER CANNOT ENTER OR CORRECT THEIR OWN NAME, CR OR VAT NUMBER. `organization` is a
      control-plane table and no Action can reach it, so a Dudo operator transcribes these values
      on the customer's word, forever.
    recommendation: >-
      ACCEPT FOR NOW; IT IS NOT REPAIRABLE INSIDE THIS CONTRACT. The two real answers are moving
      the Organization profile out of the control plane, or designing a control-plane-write Action
      class — both are decisions of their own, and the second must argue against
      `control-plane-store.ts`'s warning that reachability from `ActionContext` violates `CO1` in
      one line. UNTIL THEN THE VERIFICATION RECORD AND THE TENANT-SIDE AUDIT RECORD ARE WHAT MAKE
      THE ASYMMETRY SURVIVABLE, and both are in this contract for that reason.
    blocks: "Customer self-service on their own legal identifiers. Not this contract."

  - id: OI-2
    question: >-
      THERE IS NO VALUE HISTORY. The audit trail proves that a registration changed and by whom,
      and cannot say what it was before — `audit.ts` has nowhere to put a value, by design.
    recommendation: >-
      DO NOT REPAIR IT BY WIDENING THE AUDIT RECORD; that makes the trail a second copy of the
      data and it is the thing `0025` Decision 5 forbids. If history is needed for a legal
      identifier, it is versioning ON THE RECORD, which is a data-model decision. Today the
      verification object carries provenance for the CURRENT value, which is what a dispute about
      the present needs; a dispute about the past is not served.
    blocks: "Nothing today."

  - id: OI-3
    question: "THE THIRD MEMBER OF THE REGISTRATION CATEGORY — LMRA, GOSI, a municipality licence — is the trigger theCategoryRuling names."
    recommendation: >-
      WHEN IT ARRIVES, DECIDE THE TABLE RATHER THAN ADDING A THIRD COLUMN BY ANALOGY. The shared
      `registrationRecord` definition is what makes that decision cheap: a generic table is a
      transposition of a shape that already exists rather than a reconciliation of three that
      disagree. A proposal must argue against theCategoryRuling, not inherit it.
    blocks: "Nothing until a third is asked for."

  - id: OI-4
    question: "SHOULD A VERIFIED COMMERCIAL REGISTRATION BE UNIQUE? Today nothing is unique but `organization_id`."
    recommendation: >-
      IF EVER, SCOPE IT TO VERIFIED REGISTRATIONS ONLY — an unverified duplicate is a typo and a
      constraint over typos permanently blocks the real holder — AND THE REFUSAL MUST NOT NAME OR
      IMPLY THE HOLDER, or the constraint becomes a cross-tenant existence oracle. Both conditions
      are load-bearing and neither is obvious.
    blocks: "Nothing."

  - id: OI-5
    question: >-
      CLEARING A REGISTRATION TO `not_recorded` DESTROYS THE PREVIOUS VALUE AND ITS PROVENANCE,
      and the audit trail records that a change happened without recording what was lost (`OI-2`).
    recommendation: >-
      PERMITTED, BECAUSE AN OPERATOR MUST BE ABLE TO UNDO A MISTAKE and a record that cannot be
      corrected accumulates wrong values. The loss is named rather than prevented; preventing it
      needs `OI-2`.
    blocks: "Nothing."

  - id: OI-6
    question: >-
      `verified: true` IS AN OPERATOR'S CLAIM AND CORE CANNOT CHECK IT. There is no Sijilat API
      and no NBR API, so nothing on the server confirms that a check happened.
    recommendation: >-
      ACCEPT, AND DO NOT DRESS IT UP. It is the same class of limit `confirmation-v1` records for
      whether a client displayed the statement it was given, and `credential-store.ts` for NFC
      normalisation — a client obligation, stated rather than implied. WHAT MAKES IT WORTH HAVING
      is that the claim is attributed and dated: an operator who ticks it without looking has put
      their principal id against a specific number on a specific day, in a record the customer's
      own trail shows was edited. AN AUTOMATED CHECK, IF ONE EVER EXISTS, IS AN INTEGRATION AND A
      CONNECTOR — not a field on this record, and not proposed here.
    blocks: "Nothing."

  - id: OI-7
    question: >-
      *** IS `control-plane/0002_organization.sql` STILL EDITABLE IN PLACE? *** It states that
      editing it is correct "ONLY because this migration has never run anywhere". THE BRIEF SAYS
      THREE ORGANIZATIONS EXIST IN PRODUCTION, WHICH MEANS IT HAS RUN — and if so, these columns
      are a NEW migration file and the additive-only rule has already taken over.
    recommendation: >-
      CORE MUST ESTABLISH WHICH IS TRUE BEFORE TOUCHING THE FILE, and the answer is a fact about a
      deployed database rather than about the repository. IT IS NOT A DETAIL: an in-place edit to
      an applied migration produces schema drift that nothing detects, on the table that decides
      whether an Organization is active.
    blocks: "The migration, until answered. It does not block the contract."

  - id: OI-8
    question: >-
      `platform-operator-v1`'s `created_at` STILL SAYS "RFC 3339, UTC, second precision". That is
      the stale claim `platform-audit-read-v1` struck on 2026-09-05 after establishing that
      `toRfc3339Utc` always emits `.sssZ` and nothing truncates.
    recommendation: >-
      CORRECT IT WHEREVER IT SURVIVES. It is a description rather than a constraint, so nothing
      breaks — which is exactly why it has survived a correction that was made twice already, and
      it is `workflow.md` §12's shape: two sources that are supposed to agree, one corrected.
      EVERY TIMESTAMP THIS CONTRACT INTRODUCES USES THE CORRECTED GRAMMAR.
    blocks: "Nothing. Reported because a third agent will otherwise re-derive it from the wrong half."

  - id: OI-9
    question: >-
      `platform-operator-v1`'s `organizationSummary` DECLARES `display_name` IN `properties` AND
      NOT IN `required`, so under `additionalProperties: false` it is a PERMITTED OPTIONAL FIELD —
      while its own description and the identical field in `organization-detail-v1` both say
      required-and-nullable. THE PROSE AND THE MACHINE-READABLE HALF DISAGREE ABOUT THE SAME
      FIELD IN TWO CONTRACTS.
    recommendation: >-
      MOVE IT INTO `required`. It is latent today because the value is always null; IT STOPS BEING
      LATENT THE DAY THIS CONTRACT LANDS, because that is when a client starts depending on the
      field being there. `workflow.md` §12 in its purest form — prose describes, `required`
      instructs — and it is the second instance found in this file set this week.
    blocks: "Nothing today. It should land with this slice rather than after it."
