openQuestions:
  - id: TS-1
    question: "Per-session revocation needs a non-secret handle, and `session_id` is the credential."
    recommendation: "A separate opaque reference column on `session`, carrying no authentication power. A migration, therefore the user's. NOT a truncation and NOT a hash of session_id — both are values derived from a credential published on an administrative surface."
    status: "OPEN — blocks a real capability, and the workaround (revoke all) is correct rather than equivalent."

  - id: TS-2
    question: "A member's own session list and self-revocation, at `own` scope."
    recommendation: "A separate operation taking no principal_id, because the subject is the caller. Merging it into these routes would produce a target that is sometimes a parameter and sometimes the caller. **Today this means the owner cannot see their own sessions**, since the owner is refused as a target here."
    status: "OPEN — and it is the gap an ordinary user notices first."

  - id: TS-3
    question: "Reading the owner's session list is refused, which goes beyond 0043 §3d's list of ACTS."
    recommendation: "Keep the refusal. A session listing is a presence signal about the one principal the tier system protects from the tier below it. Recorded so a widening argues against this paragraph rather than around it."
    status: open

  - id: TS-4
    question: "The listing was unaudited on success while the revocation, over the same object at the same sensitivity, was audited."
    recommendation: >-
      *** CLOSED 2026-09-13: `audit: required`. See the operation's theAUDITRULING. ***
      THE ORIGINAL RECOMMENDATION SAID *"revisit if rate limiting lands, because that removes the
      frequency argument"*, AND THAT UNDERSTATED IT IN THE DIRECTION THAT LET IT SIT OPEN.
      **The frequency argument does not merely EXPIRE when rate limiting arrives. AUDITING THE READ
      IS THE RATE LIMIT** — the audit charge meters the read against
      `PER_PRINCIPAL_DAILY_ROW_WRITES`, which is `0042`'s load-bearing-by-accident bound reinstated
      on purpose for one route. **So the thing I was waiting for was the thing I was declining to
      build**, and a question phrased as *"revisit when X arrives"* is one nobody revisits, because
      nothing announces X.
      AND THE ARGUMENT WAS SELF-DEFEATING ON ITS OWN TERMS: polling is vigilance and is
      surveillance, in identical words, **and the audit record is the only thing that tells them
      apart** — so declining it to save the cost of polling declined precisely the signal that
      would have resolved what the polling meant.
    status: "CLOSED — and the two remaining exemptions in this directory were re-argued in the same pass. See tenant-invitations-v1."

  - id: TS-5
    question: >-
      `maxRowWrites` is a scalar and this operation's cost is 2N + 5 where N is how many devices a
      person uses. The declared 11 is a typical case; the capped worst case is 105.
    recommendation: >-
      Team Lead ruling owed. Candidates: a per-request session cap in Core, or a `maxRowWrites` that
      admits a range — the second changes a field every contract declares. **Picking a number here
      would make the field precise and wrong**, which is worse than the range being undeclared.
    status: "OPEN — and this contract declines to resolve it by choosing."
