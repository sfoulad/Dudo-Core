openQuestions:
  - id: TL-1
    question: >-
      Who owns the tenant-admin confirmation challenge route? confirmation-v1 is ACCEPTED and names
      two; the class needs a third; nobody has been assigned it.
    recommendation: >-
      An amendment to confirmation-v1 by architecture-agent on the Team Lead's instruction, then
      Core. NOT invented here: extending an accepted contract is the Team Lead's, and a shape
      guessed in this file would be a second spelling of a mechanism that already exists.
    status: "OPEN — blocks both `critical` operations, and the build fails naming it."

  - id: TL-2
    question: >-
      `scheduled_purge_at` is a date nothing acts on, and this contract publishes it to a customer.
    recommendation: >-
      Publish it and have the client say what it means — the date deletion becomes permissible —
      rather than withholding it. Withholding means the customer cannot see the window at all, which
      is worse; rendering it as a countdown states a capability Dudo does not have. **The wording is
      the control and there is no mechanism behind it**, which is stated rather than glossed.
    status: open

  - id: TL-3
    question: >-
      Should requesting deletion SUSPEND the Organization, or leave it fully operational during the
      window?
    recommendation: >-
      Leave it operational, and this contract assumes that. Suspending on request makes a
      cancellable act immediately destructive of availability, which collapses the distinction
      between request and execution that the two permissions exist to preserve. Recorded because the
      opposite is a reasonable product instinct and would arrive as a small change.
    status: open

  - id: TL-4
    question: >-
      A transfer names no `from_principal_id`, so two administrators transferring concurrently both
      succeed and the last writer wins.
    recommendation: >-
      Acceptable, and the reason is that both callers held a `critical` permission and a single-use
      confirmation each. If it is ever not acceptable, the answer is an optimistic-concurrency token
      derived from the current owner — NOT a caller-supplied `from_principal_id`, which is a
      precondition the caller can lie about.
    status: open
