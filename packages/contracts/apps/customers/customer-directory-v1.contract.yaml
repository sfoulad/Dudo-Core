# Customer Directory — Action contract, version 1
#
# The machine-readable half of the contract. Shapes live in
# customer-directory-v1.schema.json; the reasoning, the state machine and the search
# semantics live in README.md. All three are normative together, and a change to one that
# is not reflected in the others is a contract defect.
#
# Governed by: docs/architecture/standards/API_STANDARD.md (the Action definition, §1)
#              docs/architecture/standards/AUTHORIZATION_STANDARD.md
#              docs/architecture/standards/MULTITENANCY_STANDARD.md
#              docs/decisions/0006-tenancy-model.md (Accepted)
#              docs/decisions/0007-logical-permission-model.md (Accepted)
#              docs/decisions/0011-manifest-lifecycle-indefinite-retention.md (Accepted)
#              docs/decisions/0012-manifest-api-path-underscore.md (Accepted)
# Owner:       architecture-agent authors; Team Lead accepts.
#
# STATUS
# status: proposed. NOT YET APPROVED and NOT YET BUILT. No code exists. Per
# .claude/rules/workflow.md §3 the Team Lead reviews and agrees this contract before any
# consumer implements against it; architecture-agent does not accept its own contracts.
#
# THREE THINGS THIS CONTRACT DEPENDS ON THAT ARE NOT DECIDED. They are listed here rather
# than only in README.md because an implementing agent reads this file first:
#   1. AS1 — the executable form and transport of a Dudo contract. This file follows the
#      precedent already set in packages/contracts/ (JSON Schema draft 2020-12 plus YAML
#      registries) rather than selecting a new one. Nothing here selects a framework,
#      library, ORM or npm package, and nothing may be installed to consume it.
#   2. AP2 / SE2 — the App runtime and isolation mechanism. See README.md §11.
#   3. The platform elevation/confirmation mechanism for 'critical' Actions
#      (AUTHORIZATION_STANDARD.md §7) does not exist. customers.DeleteCustomer is critical
#      and is therefore unreachable until it does. This is now the ONLY blocker on that
#      Action, and it is why DeleteCustomer and RestoreDeletedCustomer are ruled OUT OF
#      SCOPE FOR THE MVP IMPLEMENTATION — see 'mvpImplementationScope' below, and CD-13.
#
# NO LONGER OUTSTANDING — the previous revision listed this as item 2 and it is now closed:
# ALL NINE PERMISSIONS ARE REGISTERED in packages/contracts/registries/permission-catalog.yaml
# as of 2026-09-02, group 'customer', phase 1, status proposed, at exactly the scopes
# declared below. business-owner seeds with all nine; business-admin with the six declared
# [organization, business]; member, developer and platform-admin with none. Registration
# does NOT accept this contract and does NOT make any Action reachable on its own — the
# contract is still 'proposed', and the item 3 confirmation gate still stands.
#
# WHAT CHANGED IN THIS REVISION — two user decisions relayed by the Team Lead on
# 2026-09-01, applied here in full:
#   CD-8 RETENTION, decided. Archived customers are retained INDEFINITELY. Archive is not
#     a countdown. Permanent deletion is explicit, authorized, and has a 30-day recovery
#     window, after which personal data is purged; audit keeps identifiers and action
#     metadata only. See the 'retention' block below. The consequence is three new
#     Actions and three new permissions, including customers.customer.delete, which the
#     previous revision deliberately withheld so that nobody could hold it.
#   CD-2 SCOPE, decided. Customer gains a REQUIRED business_id. organization_id remains
#     the tenant-isolation boundary; business_id controls access INSIDE the Organization
#     and is NOT a second tenant boundary. Six permissions widen to
#     scopes [organization, business]; the three new ones stay [organization] only.
#   CD-1 READ AUDITING. NARROWED BY A USER RULING ON 2026-09-02 — read the current
#     statement in audit.readAuditException, not this summary line. SUCCESSFUL reads stay
#     UNAUDITED, as a DOCUMENTED, TIME-BOUNDED EXCEPTION to AUTHORIZATION_STANDARD.md §6 —
#     the standard is NOT edited to agree with this contract. DENIED GetCustomer reads,
#     CROSS-TENANT ONES INCLUDED, ARE NOW AUDITED. The deletion path is audited without
#     exception, and the purge audit record is written BEFORE the personal data is
#     destroyed. See audit.readAuditException and audit.deletionPathAudit.
# CD-8 IS NOW CLOSED IN BOTH HALVES. The policy is the user's decision above; its manifest
# expression is docs/decisions/0011-manifest-lifecycle-indefinite-retention.md (Accepted,
# 2026-09-01), which redefined onUninstall 'retain' to mean INDEFINITE and FORBADE
# retentionDays under it. apps/customers/manifest.json is therefore authorable truthfully:
# retain, and no retentionDays field. See 'retention.manifestExpressibility'.

contractVersion: 1
apiVersion: v1
appId: customers
status: proposed
updated: "2026-09-02"

# ---------------------------------------------------------------------------
# tenancy — applies to every Action below, without exception
# ---------------------------------------------------------------------------
tenancy:
  tenant: Organization
  basis: >-
    MULTITENANCY_STANDARD.md §2. The Organization is the isolation boundary. A Customer
    belongs to an Organization; within it, the Customer also names a Business, which is an
    AUTHORIZATION SCOPE and not a second isolation boundary. §2 states that Businesses
    inside an Organization routinely need to share customers, and that sharing is what a
    Business-scoped GRANT regulates — it is not something an isolation boundary would have
    to be crossed to do.
  businessScope: >-
    DECIDED BY THE USER, 2026-09-01, relayed by the Team Lead. The rules, in force over
    every Action below:
      1. organization_id REMAINS the tenant-isolation boundary. business_id does not
         become a second one, is never described as one, and never substitutes for one.
      2. business_id controls access INSIDE the Organization.
      3. Core derives and validates BOTH from the authenticated context. The Organization
         is derived and is never accepted from any input. The principal's AUTHORIZED
         BUSINESS SET is likewise derived from the authenticated context; where an input
         carries a business_id it can only SELECT within that set, never widen it, and a
         value outside it is refused rather than trimmed to fit.
      4. A client-provided organization_id is NEVER trusted, accepted, defaulted or
         merged. No input schema in this contract has such a property, and
         additionalProperties false makes supplying one a rejected request.
      5. business-owner may reach customers across the Businesses it is authorized over
         within its Organization. business-admin may reach customers ONLY in its assigned
         Business. member reaches nothing except through explicitly registered
         permissions — the seed 'member' role is proposed to hold none of these nine.
      6. Moving a customer between Businesses is a SEPARATE AUTHORIZED ACTION with its own
         audit entry (customers.MoveCustomerToBusiness). It is never a field update on
         UpdateCustomer, and business_id is not a property of updateCustomerInput.
  twoLevelCheck: >-
    THE ORDER IS ORGANIZATION, THEN BUSINESS, ALWAYS, AND THE SECOND NEVER STANDS IN FOR
    THE FIRST. The tenant predicate is applied centrally by the storage boundary before any
    row is visible to the Action; the business predicate is applied afterwards, to rows
    already proven to be inside the tenant. A query that carries business_id and has lost
    organization_id CROSSES TENANTS: Business identifiers are unique platform-wide, so such
    a query does not fail and does not return empty — it returns another Organization's
    customer, exactly as a query missing the tenant predicate always would. Uniqueness
    prevents collision; it has never prevented reachability. A business predicate is
    therefore an ADDITIONAL narrowing and never a SUBSTITUTE, and any code path, index,
    cursor or cache key that treats business_id as sufficient identification is a critical
    defect.
  model: >-
    docs/decisions/0006, Accepted — Option A, ONE SHARED PRODUCTION D1 DATABASE holding
    every Organization's rows, with mandatory TenantStoreResolver indirection. There is no
    infrastructure boundary underneath this contract: a query missing its tenant predicate
    does not fail and does not return empty, it returns another Organization's customer.
  rules:
    - >-
      Tenant identity is derived from the authenticated server-side context on EVERY call.
      Never from a request body field, path segment, query string, header, cookie, cursor,
      SDK argument, hostname, unverified token claim, or ambient default.
    - >-
      No Action in this contract has a tenant parameter, and none may be added. A request
      carrying one is rejected by the input schema (additionalProperties false) as a
      malformed request — and that rejection proves input validation, NOT isolation. See
      packages/testing/fixtures/app-manifest/az7/az7-r3-cross-tenant-invocation.json, whose
      isolation-proving vector is a perfectly schema-valid request whose only cross-tenant
      element is the record identifier itself.
    - >-
      Every read and write reaches storage through the Core-owned storage port, whose
      handle is obtained through TenantStoreResolver. The tenant predicate is applied
      CENTRALLY by that boundary and is never hand-written per query. A query path that
      bypasses the boundary is a critical defect.
    - >-
      An unknown, unmapped, suspended or malformed Organization mapping FAILS CLOSED. No
      fallback binding, no default database, no 'probably the shared one'.
    - >-
      A Customer record's tenant is assigned at creation from context and is immutable.
      There is no operation in this contract, and none may be added, that moves a Customer
      between Organizations. MoveCustomerToBusiness is NOT such an operation: it moves a
      record between authorization scopes inside one tenant, its destination is validated
      to be a Business of the authenticated Organization, and a destination outside that
      Organization is not_found — indistinguishable from a Business that does not exist.
    - >-
      Cache keys are prefixed t:<tenant_id>:. This slice defines no cache; if one is added
      it inherits this rule and a new tenant-isolation obligation.

# ---------------------------------------------------------------------------
# authorizationModel — applies to every Action below
# ---------------------------------------------------------------------------
authorizationModel:
  authority: >-
    Core, and only Core, at every entry point, on every call (0007 rule 1, D8). No client,
    App, SDK or Connector decides authorization. UI hiding is presentation, never security.
  default: deny
  scopeRationale: >-
    REVISED under the user's CD-2 decision. The six original permissions are declared at
    scopes [organization, business]; the three added by the CD-8 decision are declared at
    [organization] ONLY. Business scope is now coherent for the six because the Customer
    entity carries a required business_id — there is a real predicate to evaluate against,
    so a business-scoped grant genuinely narrows rather than granting the whole
    Organization while presenting as narrower. That was the objection in the previous
    revision and the decision removed it, rather than the objection being waived.
    Consequence under 0007 D6's intersection rule: 'business-admin' and 'member' are now
    ELIGIBLE to hold the six at business scope, which closes the open half of CD-2 —
    eligibility, not a grant. Nothing is granted until the Team Lead registers these
    permissions and decides role membership.
  organizationOnlyRationale: >-
    WHY MOVE, DELETE AND RESTORE-DELETED ARE [organization] AND NOT [organization,
    business]. A move spans TWO Businesses, and a business-scope grant is authority over
    ONE by definition. Declared at business scope it would let the holder of a grant over
    Business A pull a customer out of Business B, or push one into Business B — reaching
    across a boundary while holding one side of it. Permanent deletion and its reversal are
    irreversible-by-design data governance over the Organization's own records, and the
    Organization is the party that owns the data and answers for it. Even at organization
    scope, Core still validates that BOTH the source and the destination Business belong to
    the authenticated Organization and to the principal's authorized set — the scope
    declaration is the floor, not the whole check.
  evaluationOrder:
    - "1. Authenticate the principal. Failure -> unauthenticated."
    - >-
      2. Derive the tenant from the authenticated context, and derive the principal's
      AUTHORIZED BUSINESS SET within that tenant from the same context. Neither comes from
      the request. The authorized set is part of the authorization decision, not a
      per-Action lookup the Action may skip.
    - >-
      3. Authorize the Action's declared permission at its declared scope, WITHOUT
      reference to any record. Failure -> forbidden. This step remains record-independent,
      so this forbidden can never be correlated with a record's existence.
    - "4. Validate the input schema. Unknown fields rejected. Failure -> invalid_argument."
    - >-
      5. Resolve the record WITHIN THE TENANT through the storage boundary, with the tenant
      predicate already applied. Not present in this tenant -> not_found, identically
      whether it exists in another Organization or nowhere at all. THIS STEP IS TERMINAL
      FOR CROSS-TENANT: nothing below it ever runs on a foreign row, so no later step can
      turn a cross-tenant miss into a distinguishable answer.
    - >-
      5b. NEW. Authorize the resolved row's business_id against the authorized business
      set. In this Organization but outside the set -> forbidden. This is the one
      record-dependent authorization decision in the contract, it exists only INSIDE the
      tenant, and it is reachable only after step 5 has already proved the row is the
      caller's Organization's own data. See notFoundVersusForbidden.wrongBusiness for why
      that difference is the whole justification.
    - >-
      5c. For inputs naming a Business (create, move, and the list/search filter), validate
      that Business the same way and in the same order: not a Business of this Organization
      -> not_found; a Business of this Organization outside the authorized set -> forbidden.
    - "6. Evaluate the state precondition. Failure -> failed_precondition."
    - >-
      7. Perform the operation, commit, then write the audit record. ONE EXCEPTION, and it
      is not an Action: the platform PURGE writes its audit record BEFORE destroying the
      personal data, because nothing survives afterwards to reconstruct the record from. See
      audit.deletionPathAudit.ordering. No Action inverts this step.
      A DENIAL AT STEPS 3, 5, 5b OR 5c NEVER REACHES THIS STEP AND IS NOT AN EXCEPTION TO IT.
      No operation was performed, so there is no commit to order an audit write against; the
      record is written as the request is refused. This is where the denied-GetCustomer audit
      record comes from (audit.deniedReadAudit), and it is why that control needs no
      inversion of this step and must not be described as one.
  notFoundVersusForbidden:
    rule: >-
      Outside the tenant boundary a caller must NOT be able to distinguish 'exists but is
      not yours' from 'does not exist'. Cross-tenant access returns not_found, never
      forbidden, and that is not negotiable and not weakened by anything below.
    basis: "API_STANDARD.md §8; MULTITENANCY_STANDARD.md §5; az7-r3 requiredOutcome."
    wrongBusiness:
      ruling: >-
        FORBIDDEN. A customer that exists in the authenticated Organization, in a Business
        the principal is not authorized over, returns forbidden — not not_found.
      reasoning: >-
        The rule that cross-tenant must be not_found exists to stop one company learning a
        fact about ANOTHER company's data. Inside one Organization there is no second
        party: the Organization owns every one of these records, signed up for them, and is
        the party in a data-protection complaint about them (MULTITENANCY_STANDARD.md §2).
        The existence of a customer row in a sibling Business is the Organization's own
        information, and 'this record exists and you may not see it' discloses nothing to
        anyone outside it. Neither API_STANDARD.md §8 nor MULTITENANCY_STANDARD.md §5
        requires not_found here; both scope the requirement to the tenant boundary, and
        copying the tenant rule downward by reflex would be applying a control where its
        justification does not reach.
        THE OPERATIONAL ARGUMENT IS THE DECIDING ONE, AND IT RUNS THE OTHER WAY FROM
        HABIT. Told not_found, a business-admin concludes the customer is not in the system
        and has staff re-enter it — producing a duplicate customer inside the same
        Organization, in a different Business, with a divergent address, a divergent phone
        number and its own future invoices. That is silent data corruption of the tenant's
        own directory, caused by the platform lying to it about its own data, and this
        contract has no duplicate detection to catch it. Told forbidden, the same person
        asks an owner for access or for a move — which is exactly what
        MoveCustomerToBusiness exists for. The failure mode of not_found here is
        corruption; the failure mode of forbidden here is an in-tenant existence
        disclosure that the tenant is already entitled to.
        THE RESIDUAL RISK, STATED. A principal inside Organization A holding a
        customer_id it should not have can learn that the record exists somewhere in
        Organization A. It learns nothing else — no field, no Business identifier, no
        name — because the forbidden response carries no record data. And it cannot
        enumerate: customer_id is opaque, non-sequential and unguessable (README.md §5),
        so an identifier can only have come from inside the tenant in the first place.
      crossTenantUnaffected: >-
        CHECK THIS PROPERTY, BECAUSE IT IS THE ONE THIS RULING COULD HAVE BROKEN. forbidden
        at step 5b is returned ONLY for rows already resolved inside the caller's own
        Organization. Every identifier that is not in the caller's Organization — a foreign
        Organization's customer, a purged customer, a fabricated string — terminates at
        step 5 with the same not_found. The caller therefore cannot use the
        forbidden/not_found difference to distinguish 'exists in another Organization' from
        'exists nowhere': both are not_found, byte-identical. The new answer partitions
        in-tenant from everything else, never one tenant from another.
    indistinguishability: >-
      The not_found response for a foreign-Organization identifier and the not_found
      response for an identifier that exists nowhere must be identical in status code,
      error code, message string, details array, response-size class and headers. The only
      permitted difference is request_id. Error messages are fixed strings that do not vary
      with the data involved. The same applies to a foreign-Organization business_id
      supplied to create, move, list or search: not_found, identical to a business_id that
      exists nowhere.
    collections: >-
      LIST AND SEARCH NEVER RETURN forbidden FOR A ROW. A collection is filtered, not
      refused: customers in Businesses outside the authorized set are simply absent, with
      no count, no placeholder and no gap in the cursor. forbidden on a collection is
      returned only when the caller EXPLICITLY names a business_id it is not authorized
      over — because there the caller asserted a scope and deserves a straight answer,
      whereas an unfiltered listing asserted nothing.
  budgetExhaustion:
    ruling: >-
      EXHAUSTING A DAILY WRITE BUDGET REFUSES MUTATIONS WITH quota_exceeded. It never
      refuses a read. Required by docs/decisions/0014 section A.10, which states the
      obligation for mutations in the plural; this contract previously declared
      quota_exceeded on CreateCustomer alone, so the other four mutations would have had a
      declared-error set that could not express the answer the decision requires.
    appliesTo: >-
      THE FIVE REACHABLE MUTATIONS: CreateCustomer, UpdateCustomer, ArchiveCustomer,
      RestoreCustomer and MoveCustomerToBusiness. All five declare quota_exceeded.
      NOT GetCustomer, NOT ListCustomers, NOT SearchCustomers, and this exclusion is
      normative rather than an omission — see readsAreNeverRefused.
      DeleteCustomer and RestoreDeletedCustomer are mutations and are DELIBERATELY NOT
      LISTED, because both are unreachable behind the section 7 confirmation gate
      (mvpImplementationScope) and their routes answer not_implemented. Declaring an error
      an Action cannot yet return would assert behaviour for an implementation this
      contract deliberately leaves unspecified. WHOEVER LANDS THE CONFIRMATION GATE OWES
      quota_exceeded ON BOTH, and this sentence exists so that obligation is not discovered
      by its absence.
    readsAreNeverRefused: >-
      A read consumes no write budget, so refusing one buys back nothing it spent. Refusing
      reads at a write ceiling would convert a write-capacity control into a total outage,
      which is exactly the mistake docs/decisions/0013 control 9 was written to avoid — its
      ceiling stops summary WRITES and explicitly does NOT refuse requests, because a
      ceiling that refuses requests is a second denial-of-service lever.
      AND A READ THAT COULD RETURN quota_exceeded WOULD CARRY A NEW SIGNAL ABOUT THE
      ORGANIZATION'S BUDGET ON A PATH THAT CURRENTLY CARRIES NONE. GetCustomer is the
      probing surface this whole contract is arranged around; adding a response code to it
      that varies with the Organization's remaining budget would add a second dimension an
      attacker can observe, on the one Action where the answer set is most carefully
      constrained.
    evaluationPosition: >-
      NORMATIVE, AND IT IS THE WHOLE OF THE CONTROL. The budget refusal is evaluated at the
      same position as the rate limit: after step 3 (authorize) and step 4 (validate), and
      BEFORE step 5 resolves any record. It is RECORD-INDEPENDENT, exactly as the step 3
      forbidden is, and for the same reason.
      IF IT EVER MOVES BELOW STEP 5 THE CONTRACT IS BROKEN, and the failure is not subtle.
      A budget check placed after record resolution — for instance to 'only count writes we
      are actually going to make' — makes quota_exceeded reachable only when the target row
      resolved inside the tenant. A caller could then exhaust its OWN budget deliberately,
      which it controls completely, and thereafter distinguish quota_exceeded ('this
      customer exists in my Organization') from not_found ('it does not, or it is another
      Organization's'). That is a cross-tenant existence oracle that the attacker can switch
      on at will, built out of a capacity control. Position is what prevents it; no wording
      elsewhere in this contract does.
    whatAquotaExceededDiscloses: >-
      A statement about the caller's OWN Organization's budget, produced by the caller's own
      Organization's traffic. It names no record, no customer identifier, no Business, and no
      other Organization, and it is returned before any row has been read. The cross-tenant
      indistinguishability property in notFoundVersusForbidden.crossTenantUnaffected is
      untouched: every identifier outside the caller's Organization still terminates at step
      5 with the same not_found, and a caller whose budget is intact cannot obtain
      quota_exceeded at all.
    auditTaxonomy: >-
      quota_exceeded IS ALREADY A MEMBER OF THE CLOSED AuditDenialReason SET and is already
      counted as a denial, so declaring it on four further Actions introduces no new
      vocabulary and no new column value. The denial grouping stays bounded: its key is
      built from the authenticated principal and the Action definition only, and has no
      parameter the requested customer identifier could arrive through
      (docs/decisions/0013 control 5). The change adds at most four group-windows per
      credential per 15-minute window, and what bounds the writes is the daily summary
      ceiling rather than the group count.
    retryTime: >-
      THE CARRIER NOW EXISTS. error-envelope.schema.json declares error.retry_after_seconds,
      an optional non-negative integer, approved by the Team Lead against docs/decisions/0014
      section A.10 and added to the PLATFORM-WIDE envelope rather than to this App's
      contract, because an error shape that varies per module is not a shape. It also pays
      the debt API_STANDARD.md section 10 records for rate_limited, which
      platform/core/http/api.ts names as owed and unpaid.
      WHAT THIS ACTION MAY PUT IN IT: seconds until the next 00:00 UTC reset, and nothing
      else. That value is a function of the calendar, identical for every caller on the
      platform at that instant, and it therefore says nothing about this Organization or any
      other. IT MUST NEVER BE DERIVED FROM REMAINING BUDGET, OBSERVED USAGE, LOAD OR ATTEMPT
      COUNT. A retry time computed from how much budget is left is a side channel on other
      tenants' activity, reachable exactly the way evaluationPosition describes — by a caller
      deliberately driving the one input it fully controls. The prohibition is stated in the
      envelope schema as a prohibition; it is repeated here because this is the Action that
      would be the first to break it.
      IT IS OPTIONAL, INCLUDING ON THIS ACTION. A refusal with no retry time is valid and a
      client falls back to the next UTC midnight from its own clock. Optional is deliberate:
      required would mean a value gets invented on the path where none is known.
    interimBehaviour: >-
      Core currently answers unavailable for this condition on the four Actions, which all
      declare it, and which the neighbouring degraded-mode branch already returns for the
      same underlying fact. Nothing is broken today. Listing quota_exceeded here is what
      lets that answer become the correct one without a code change, because
      constrainToDeclaredErrors converts any code outside an Action's declared set to
      internal — so an undeclared quota_exceeded would have surfaced as a 500.

# ---------------------------------------------------------------------------
# permissions — REGISTERED as of 2026-09-02.
#
# All NINE now exist in packages/contracts/registries/permission-catalog.yaml, group
# 'customer', phase 1, status proposed, at exactly the scopes stated below. The catalog is
# the single registry; this block is the contract's statement of what the App requires, and
# THE TWO MUST NOT DRIFT — a scope changed in one and not the other is a contract defect,
# and the one that would matter is a permission silently widened to 'business' here after
# being registered [organization] there.
#
# REGISTRATION IS NOT APPROVAL AND NOT A GRANT. This contract is still 'proposed'. Under
# 0007 rule 4 registration is NECESSARY for an Action to be reachable; it has never been
# SUFFICIENT — customers.DeleteCustomer stays unreachable behind the §7 confirmation gate
# regardless of who holds customers.customer.delete.
#
# The first six are declared [organization, business] under the user's CD-2 decision. The
# last three are declared [organization] ONLY — see authorizationModel.
# ---------------------------------------------------------------------------
permissionsRequested:
  - id: customers.customer.create
    group: customer
    description: "Create a customer in a named Business of the Organization's directory."
    sensitivity: sensitive
    scopes: [organization, business]
    phase: 1
  - id: customers.customer.read
    group: customer
    description: >-
      View one customer's full record, including its address and notes. Separate from
      list: the list projection deliberately omits both sensitive-personal free-text
      fields, so reading a whole record is a distinct disclosure.
    sensitivity: read
    scopes: [organization, business]
    phase: 1
  - id: customers.customer.list
    group: customer
    description: >-
      Enumerate and search customers. Separate from read because enumeration is its own
      disclosure: the identifiers and the shape of the customer base are information even
      when the full records are not readable. Search shares this permission rather than
      having its own — search IS enumeration, and a separate customers.customer.search
      would let a role reach the same information through a second door.
    sensitivity: read
    scopes: [organization, business]
    phase: 1
  - id: customers.customer.update
    group: customer
    description: >-
      Modify a customer's details. Cannot change status — archiving is its own permission —
      and cannot change business_id, which is customers.customer.move.
    sensitivity: sensitive
    scopes: [organization, business]
    phase: 1
  - id: customers.customer.archive
    group: customer
    description: >-
      Withdraw a customer from active use. Data is retained INDEFINITELY; this is not a
      delete and it starts no countdown to one.
    sensitivity: sensitive
    scopes: [organization, business]
    phase: 1
  - id: customers.customer.restore
    group: customer
    description: >-
      Return an archived customer to active use. Separate from archive: reinstating a
      record puts it back into every list and search the Organization can see, and a role
      that may tidy the directory is not automatically a role that may reinstate from it.
    sensitivity: sensitive
    scopes: [organization, business]
    phase: 1

  # --- added by the CD-2 decision -------------------------------------------
  - id: customers.customer.move
    group: customer
    description: >-
      Move a customer from one Business to another within the same Organization. Never at
      business scope: a move spans two Businesses and a business-scope grant is authority
      over one, so granting it there would let the holder of one side reach across the
      boundary it is standing on.
    sensitivity: sensitive
    scopes: [organization]
    phase: 1

  # --- added by the CD-8 decision -------------------------------------------
  # customers.customer.delete was DELIBERATELY WITHHELD in the previous revision so that
  # nobody could hold it. The user has now authorised permanent deletion by an authorized
  # user, so the capability must exist and is declared here rather than left implicit.
  - id: customers.customer.delete
    group: customer
    description: >-
      Permanently delete a customer. Starts an explicit 30-day recovery window, after which
      the customer's personal data is purged and cannot be recovered. Reachable only from
      'archived'. Sensitivity is CRITICAL, not sensitive: AUTHORIZATION_STANDARD.md §6
      classes irreversible data destruction as critical, which adds a mandatory explicit
      confirmation collected by the platform from the human — never a request field.
    sensitivity: critical
    scopes: [organization]
    phase: 1
  - id: customers.customer.restore-deleted
    group: customer
    description: >-
      Cancel a pending deletion within the 30-day window, returning the customer to
      'archived'. Separate from customers.customer.restore, which returns an ARCHIVED
      customer to active use: reversing a destruction order and reinstating a withdrawn
      record are different acts, and the authority to tidy a directory is not the authority
      to countermand a deletion an organization-level principal ordered.
    sensitivity: sensitive
    scopes: [organization]
    phase: 1

# Deliberately NOT declared, so that nobody can hold it:
#   customers.customer.export  — this slice has no export. AUTHORIZATION_STANDARD.md §3.2
#                                requires export to be separate from read, and the way to
#                                keep it separate is to not declare it until an export
#                                Action exists.
permissionsDeliberatelyNotDeclared: [customers.customer.export]

# Seed-role membership was the Team Lead's decision, not this contract's. The
# recommendation below was ACCEPTED IN FULL and APPLIED to permission-catalog.yaml on
# 2026-09-02; it is retained as the reasoning behind the seed data rather than as an open
# proposal. Under 0007 D6's intersection rule a role may hold a permission only where the
# permission's own declared scopes include the role's scope, which does most of this
# automatically.
seedRoleRecommendationAcceptedAndApplied:
  business-owner:   "organization scope — all NINE. It is the Organization's owner."
  business-admin:   "business scope — the SIX at [organization, business], and no more. The intersection rule already makes move, delete and restore-deleted impossible for it to hold, which is the intended outcome and not a gap to repair."
  member:           "NONE. The user's decision states member reaches customers only through explicitly registered permissions. Granting nothing by default is the fail-closed reading, and a member that needs access gets a custom role."
  developer:        "NONE."
  platform-admin:   "NONE. Every one of these nine is tenant-scoped; a platform-scope role holding one is the escalation AUTHORIZATION_STANDARD.md §4 removed from marketplace-moderator."

# ---------------------------------------------------------------------------
# retention — DECIDED BY THE USER, 2026-09-01, relayed by the Team Lead. This closes the
# policy half of CD-8. Recorded here, in the contract, because this is the file an
# implementing agent reads first and because the number below has legal weight.
# ---------------------------------------------------------------------------
retention:
  customerDeletionRetentionDays: 30

  model:
    - >-
      ARCHIVED CUSTOMERS ARE RETAINED INDEFINITELY, until an authorized user requests
      permanent deletion. ARCHIVE IS NOT A COUNTDOWN TO DELETION. No elapsed time, no
      quota, no inactivity and no background job moves a record out of 'archived'.
    - >-
      PERMANENT DELETION IS EXPLICIT AND AUTHORIZED. It happens only when a principal
      holding customers.customer.delete invokes customers.DeleteCustomer on an archived
      customer, and it is confirmed and audited.
    - >-
      DELETION HAS A 30-DAY RECOVERY PERIOD. The record moves to 'pending_deletion',
      deletion_scheduled_at is set to the moment of the request plus 30 days, and until
      that moment customers.RestoreDeletedCustomer reverses it in full.
    - >-
      AFTER 30 DAYS THE CUSTOMER'S PERSONAL DATA IS PURGED. Purge is implemented as
      deletion of the Customer row in its entirety — display_name, email, phone, country,
      address and notes all go. Erasing only the fields classified sensitive-personal and
      keeping a husk would leave business-confidential data behind under the name of a
      purge; deleting the row satisfies the decision strictly rather than approximately.
    - >-
      AUDIT SURVIVES THE PURGE; THE PERSONAL DATA DOES NOT. Audit records MAY retain the
      customer_id and action metadata and MUST NOT retain deleted personal details. This
      costs nothing to honour here because the audit rules below already forbid audit
      records from carrying field VALUES at all — the purge does not have to reach into the
      audit trail to scrub anything, because nothing scrubbable was ever written there.
    - >-
      NO AUTOMATIC PURGE MAY EVER REMOVE AN ACTIVE OR MERELY ARCHIVED CUSTOMER. The purge
      job's predicate is exactly: tenant scope, AND status = 'pending_deletion', AND
      deletion_scheduled_at <= now. It has no other form, it never falls back to a date
      comparison alone, and 'active' and 'archived' rows are not candidates under any
      condition. This is a mandatory test obligation, not a code comment — see README.md
      §12.

  purgeJob:
    tenancy: >-
      MULTITENANCY_STANDARD.md §4 carrier 6: a scheduled job runs per tenant, or iterates
      tenants explicitly one at a time. A purge that queries every Organization's rows in
      one statement is a cross-tenant read, and one whose predicate is wrong is a
      cross-tenant DELETE — the most destructive form the failure can take. Under 0006
      Option A there is no infrastructure boundary to catch it.
    audit: >-
      Each purge writes an audit record in the purged customer's own Organization, naming
      the platform as principal, the customer_id, and the deletion request it completes.
      A destruction nobody recorded is indistinguishable afterwards from data that was
      never there. THE RECORD IS WRITTEN BEFORE THE DATA IS DESTROYED — the ordering is
      binding and its reasoning is in audit.deletionPathAudit.ordering.
    ownership: >-
      The mechanism is Core's to design and is deliberately NOT specified here — this
      contract states the obligation and the predicate, not the scheduler.

  manifestExpressibility:
    status: >-
      RESOLVED BY docs/decisions/0011-manifest-lifecycle-indefinite-retention.md (Accepted,
      2026-09-01). CD-8 is CLOSED in both halves — the policy and its expression. The
      finding below is retained as the RECORD OF WHY 0011 EXISTS, in the past tense. It is
      not an outstanding problem and must not be read as one.
    manifestValue: >-
      lifecycle.onUninstall = retain, AND NO retentionDays FIELD AT ALL. Under 0011,
      'retain' means the data is retained INDEFINITELY by definition, and retentionDays is
      FORBIDDEN under it — not optional, not zero, not thirty. That is exactly the decided
      policy: archived customers retained indefinitely, removed only by an explicit
      authorized deletion.
      An App wanting a BOUNDED hold declares 'archive' and says how long. This App must
      never lose tenant data on a timer, so it declares 'retain' and says nothing further,
      because under 0011 there is nothing further to say.
    findingThatProducedIt: >-
      HISTORY, RESOLVED — kept so that 0011 does not read as an arbitrary schema preference.
      Before 0011, app-manifest.schema.json's lifecycle block required retentionDays
      alongside BOTH 'retain' and 'archive'. retentionDays means how long tenant data is
      held WHEN THE APP IS UNINSTALLED. The decided 30 is a different quantity in every
      respect — a different trigger (an authorized user deleting ONE customer, versus the
      Organization removing the App), a different subject (one record, versus the whole
      directory), and a different meaning (a window during which the act can be UNDONE,
      versus a period after which data is DISPOSED OF).
      lifecycle.retentionDays = 30 would therefore have asserted that thirty days after
      uninstall the Organization's entire customer directory is disposed of — the exact
      opposite of the decision, and a false statement shown to the tenant on the uninstall
      screen, which is the one place APP_STANDARD.md §9 requires the manifest to be true.
      retentionDays = 0 was worse, not a workaround: the natural reading is 'retain for zero
      days', which is deletion on uninstall wearing the word retain.
      So the manifest could not be authored truthfully at all, and the slice was blocked on a
      SCHEMA DEFECT rather than on a missing number. architecture-agent refused to write the
      number and reported it rather than making the manifest validate and lie.
    howItWasResolved: >-
      0011 rejected a sentinel value (a magic number in an integer field is a comment
      pretending to be data) and a second agreeing field (two fields that must agree is a
      new way to be inconsistent), and instead REDEFINED 'retain' to mean indefinite, with
      retentionDays forbidden under it and required only under 'archive'. The word already
      carried that meaning in English; the schema was contradicting it.
      The schema change itself is in packages/contracts/registries/app-manifest.schema.json,
      whose lifecycle allOf now carries the two 0011 clauses as separate conditionals:
      retentionDays REQUIRED when onUninstall is 'archive', and PROHIBITED when it is
      'retain'. Applied on 2026-09-02.
    whereTheNumberLives: >-
      retention.customerDeletionRetentionDays = 30, in this contract, where it is true. It
      is a PER-CUSTOMER DELETION RECOVERY WINDOW and it is not a lifecycle property of the
      App. 0011 says so explicitly. The two quantities were never the same number in two
      places; they were two different quantities that one field would have conflated.

# ---------------------------------------------------------------------------
# actions — API_STANDARD.md §1. One definition per operation; the internal API, public
# API, OpenAPI schema, SDK method, MCP tool and documentation all derive from it.
#
# schemaRef values resolve into customer-directory-v1.schema.json.
#
# EACH ACTION'S 'scope' IS THE LEVEL ITS PERMISSION IS EVALUATED AT, AND IT IS A SINGLE
# VALUE — not the list of scopes the permission may be declared at. The two are different
# things and confusing them is the escalation AUTHORIZATION_STANDARD.md §4 warns about:
# "evaluating at the wrong level is a silent privilege escalation".
#
# The six record-level Actions declare scope 'business', NOT 'organization', and that is
# the whole mechanism by which the CD-2 decision reaches business-admin. A grant at a level
# implies the levels beneath it and never above it (§4), so:
#   - business-owner, holding the permission at 'organization', satisfies a 'business'
#     evaluation for every Business in its Organization. It loses nothing.
#   - business-admin, holding it at 'business', satisfies it for its assigned Business and
#     for no other.
# Had these Actions declared scope 'organization', a business-scope grant could never
# satisfy them, business-admin would still be locked out, and the decision would have been
# recorded in the permission catalog while changing nothing at the entry point.
# Move, delete and restore-deleted declare 'organization' deliberately — see
# authorizationModel.organizationOnlyRationale.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# mvpImplementationScope — TEAM LEAD RULING ON CD-13, 2026-09-02. BINDING.
#
# READ THIS BEFORE IMPLEMENTING ANYTHING BELOW.
# ---------------------------------------------------------------------------
mvpImplementationScope:
  inScope:
    - customers.CreateCustomer
    - customers.GetCustomer
    - customers.ListCustomers
    - customers.SearchCustomers
    - customers.UpdateCustomer
    - customers.ArchiveCustomer
    - customers.RestoreCustomer
    - customers.MoveCustomerToBusiness
  outOfScopeForTheMvp:
    - customers.DeleteCustomer
    - customers.RestoreDeletedCustomer
  ruling: >-
    customers.DeleteCustomer AND customers.RestoreDeletedCustomer ARE OUT OF SCOPE FOR THE
    MVP IMPLEMENTATION. They are fully contracted here — shapes, errors, permissions,
    scopes, transitions, audit obligations, HTTP binding — and they are NOT to be built in
    this slice. No implementing agent writes a handler, a route, a client screen, an SDK
    method or a test assertion that exercises either one, and no reviewer reads their
    absence from the implementation as an oversight.
  whyTheyAreContractedAnyway: >-
    CONTRACTING THEM IS NOT THE SAME AS SCHEDULING THEM, AND THE DISTINCTION IS THE WHOLE
    POINT. The user's MVP scope is create, list, search, view, edit, archive, restore.
    Deletion arrived only as a CONSEQUENCE of the CD-8 retention decision: once 'archived'
    means 'kept indefinitely', something must eventually be able to end that, or the
    directory becomes unerasable and the retention policy is a promise the product cannot
    keep. So the capability has to EXIST in the contract, with its permission declared and
    registered, or the model is incomplete. What it does not have to do is ship now.
    Contracting them now is also the cheap moment: adding an Action later is additive, but
    adding two lifecycle states, a nullable deadline field and a new statusFilter member
    AFTER either client ships is breaking under API_STANDARD.md §6. The shapes are settled
    while settling them still costs nothing.
  whatBlocksThem: >-
    THE PLATFORM CONFIRMATION MECHANISM (CD-13). customers.DeleteCustomer is sensitivity
    'critical', and AUTHORIZATION_STANDARD.md §7 requires permission + audit + an EXPLICIT
    CONFIRMATION collected by the platform from the human. That mechanism does not exist,
    has no decision record, and is not built by this slice. Until it does, DeleteCustomer is
    unreachable — which is fail-closed and correct for the one Action in this App that
    destroys a tenant's data.
    RestoreDeletedCustomer is not blocked by the confirmation mechanism itself; it is
    blocked by having nothing to act on. Its only legal entry state is 'pending_deletion',
    and nothing can reach that state while DeleteCustomer is unreachable. Building it alone
    would produce an Action that can only ever return failed_precondition.
  whatMustNotBeDoneToUNBLOCKThem: >-
    NO IMPLEMENTING AGENT MAY INVENT THE CONFIRMATION. Not a 'confirm' boolean on the
    request, not a typed-name field, not a client-minted token, not a second call that sets
    a flag, and not an SDK argument. Every one of those replaces a platform control with a
    request parameter that an SDK caller or an AI principal can set for itself, which is
    precisely the control §7 exists to be. DELETE /customers/{customer_id} carries no
    request body and no confirmation parameter — see httpBinding.notes.
    Nor may the block be worked around by downgrading sensitivity from 'critical' to
    'sensitive'. The classification follows from the Action destroying data irreversibly
    (§6); changing the label does not change what the Action does, it only removes the
    control.
  whatIsStillOwedInThisSlice: >-
    THE PERMISSIONS ARE REGISTERED AND THE SEED GRANT IS REAL. customers.customer.delete
    and customers.customer.restore-deleted are in permission-catalog.yaml and business-owner
    holds both. That is deliberate: registration is what makes the model complete and
    reviewable. Holding the permission is NOT sufficient to invoke the Action, because the
    confirmation gate is a separate requirement, so nothing becomes reachable by being
    granted.
    THE PURGE JOB IS ALSO OUT OF SCOPE, for the same reason: nothing can enter
    'pending_deletion', so there is nothing to purge. Its predicate and its
    audit-before-destroy ordering stay specified in retention.purgeJob so that whoever
    builds it later builds the right thing.
    WHAT IS NOT DEFERRED: the 'pending_deletion' status value, the nullable
    deletion_scheduled_at field, and the 'pending_deletion' and 'all' members of
    statusFilter are IN SCOPE and must be implemented in the data model and the wire
    shapes now. They are the parts that are breaking to add later. A client must tolerate a
    status it will never see in this slice rather than crash on it.

actions:

  - id: customers.CreateCustomer
    title: "Create customer"
    description: >-
      Add a new customer to a named Business in this Organization's directory. Use when a
      person or company the Organization does business with is to be recorded for the first
      time. The Business must be stated; the new customer starts active. Does not check for
      duplicates.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/createCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/createCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, conflict, quota_exceeded, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.create
    scope: business
    sensitivity: sensitive
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 201
    notes: >-
      idempotent false means an Idempotency-Key header is ACCEPTED and honoured but not
      REQUIRED (API_STANDARD.md §9). Requiring one on every directory create puts the
      burden on both clients for a failure whose worst outcome is a duplicate row rather
      than duplicated money or a duplicated message. The cost is stated: without a key, a
      retried create after a network failure produces a second customer, and this contract
      does NOT deduplicate on display_name or email — two customers may legitimately share
      either. 'conflict' is returned only for an Idempotency-Key replayed with different
      input. Open question CD-4.
      not_found is NEW on this Action and it is about the BUSINESS, not the customer: a
      business_id that is not a Business of the authenticated Organization returns
      not_found, identically to one that exists nowhere, because distinguishing them would
      make CreateCustomer a probe for the existence of other Organizations' Businesses. A
      business_id inside this Organization that the principal is not authorized over
      returns forbidden.

  - id: customers.GetCustomer
    title: "View customer"
    description: >-
      Retrieve one customer's full record, including address and notes. Use when showing a
      customer's detail view. Returns archived and pending-deletion customers as well as
      active ones — a withdrawn record is still readable by identifier; it is only withheld
      from the default listing.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/getCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/getCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.read
    scope: business
    sensitivity: read
    idempotent: false
    audit: false
    auditOnDenial: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      TWO FLAGS, AND THE PAIR IS THE POINT. 'audit: false' HERE MEANS ON THE SUCCESS PATH
      ONLY — a successful GetCustomer writes no audit record. 'auditOnDenial: true' means
      EVERY DENIED GetCustomer WRITES ONE, cross-tenant probes included. Before the user's
      2026-09-02 ruling a single 'audit: false' covered both, and it was read — correctly,
      given what it said — as 'this Action never writes an audit record'. It no longer does.
      DO NOT COLLAPSE THE TWO BACK INTO ONE FLAG in either direction: 'audit: true' would
      assert that successful reads are audited, which the ruling explicitly does not
      introduce, and dropping 'auditOnDenial' would silently remove the probe-detection
      control. The full statement, including what the manifest can and cannot express, is
      audit.readAuditException and README.md §10.1.
      WHAT REMAINS EXCEPTED from AUTHORIZATION_STANDARD.md §6 is now only the SUCCESS path,
      and the standard still stands as written and is still not edited to match.
      A customer in this Organization but in an unauthorized Business returns forbidden; a
      customer in another Organization, or nowhere, returns not_found. Both cases are
      reachable from this Action and they are deliberately different answers — see
      authorizationModel.notFoundVersusForbidden.wrongBusiness. BOTH ARE NOW AUDITED, and so
      are the malformed-identifier and no-permission denials — FOUR denial paths in all. The
      recorded denial reason is the Action's ErrorCode and nothing App-local; see
      audit.deniedReadAudit.appliesTo and audit.deniedReadAudit.denialReason for which
      distinctions may be recorded and which one must never be.
      THE EXTERNAL RESPONSE IS UNCHANGED BY THIS RULING. Same status codes, same error
      codes, same fixed message strings, same byte-identical not_found for a
      foreign-Organization identifier and one that exists nowhere. Nothing in the request or
      response schema changes, and customer-directory-v1.schema.json was not edited: the
      control is entirely server-side and is invisible to both clients.

  - id: customers.ListCustomers
    title: "List customers"
    description: >-
      Return a page of customers in a stable order, active ones by default, from every
      Business the caller is authorized over — or from one named Business. Use for the
      directory view and for paging through it. Does not accept a search term — use
      SearchCustomers for that.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/listCustomersInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/listCustomersOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.list
    scope: business
    sensitivity: read
    idempotent: false
    audit: false
    auditOnDenial: false
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      A collection endpoint never 404s FOR ITS CONTENTS: no customers, and a filter that
      matches none, both return an empty data array with next_cursor null. not_found and
      forbidden appear here only for an EXPLICIT business_id parameter — not a Business of
      this Organization, and a Business of this Organization the caller is not authorized
      over, respectively. Rows in unauthorized Businesses are filtered out silently, with
      no count and no placeholder; the caller asserted no scope, so it gets no error.
      Ordering is fixed — README.md §8.
      auditOnDenial IS false HERE AND true ON GetCustomer, AND THAT ASYMMETRY IS NOT
      SETTLED. The user's 2026-09-02 ruling named GetCustomer specifically; it has not been
      widened to the collections by this contract, because widening a ruling nobody made is
      how a ruling stops meaning what it said. architecture-agent RECOMMENDS that the
      EXPLICIT-DENIAL paths on this Action be audited too, and does NOT recommend auditing
      the silent-filter path. The reasoning, the exact split, and why the recommendation is
      not applied are in audit.deniedReadAudit.collectionsRecommendation and README.md
      §10 CD-15. Awaiting the user.

  - id: customers.SearchCustomers
    title: "Search customers"
    description: >-
      Find customers whose name, email address or telephone number matches a term. Use
      when a person is looking for a specific customer rather than browsing. Matches on
      display name, email and phone only — never on notes or address.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/searchCustomersInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/searchCustomersOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.list
    scope: business
    sensitivity: read
    idempotent: false
    audit: false
    auditOnDenial: false
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      auditOnDenial false, identically to ListCustomers and for the identical reason — the
      ruling named GetCustomer, and the same recommendation and the same open question CD-15
      cover this Action. Whatever is decided for ListCustomers applies here unchanged: these
      two share a permission because search IS enumeration, and giving them different
      denial-audit behaviour would be a second door with a different camera on it.
      Shares customers.customer.list with ListCustomers deliberately. Matching semantics
      are fixed by README.md §7 and are NOT selectable by the caller. No relevance score is
      returned: no ranking function is defined, an undefined order makes cursor pagination
      unstable, and two clients would order the same result set differently.
      Business bounding is identical to ListCustomers, and it must be applied to the
      CANDIDATE SET before matching rather than to the results after it. A search that
      matched across Businesses the caller cannot list and then filtered the output would
      still leak through page counts and cursor behaviour.

  - id: customers.UpdateCustomer
    title: "Edit customer"
    description: >-
      Change a customer's recorded details. Use to correct or complete a record. Only the
      fields supplied are changed. Cannot change the customer's status — archive and
      restore are separate operations — cannot change which Business the customer belongs
      to, which is MoveCustomerToBusiness, and cannot be applied to an archived or
      pending-deletion customer.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/updateCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/updateCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, failed_precondition, conflict, quota_exceeded, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.update
    scope: business
    sensitivity: sensitive
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      failed_precondition when the customer's status is 'archived' or 'pending_deletion'.
      A record whose destruction has been ordered must not be quietly edited during the
      recovery window: what an authorized principal would then restore is not what it
      chose to keep. LAST WRITE WINS: this
      contract carries no optimistic-concurrency token, so two staff editing one customer
      at once silently lose one set of changes. That is a real data-loss path and it is
      recorded as open question CD-3 rather than closed by inventing a field the feature
      scope excluded. Adding an optional 'version' request field plus a 'version' response
      field later is ADDITIVE under API_STANDARD.md §6; making it required is breaking.
      quota_exceeded is declared because this Action writes. It is refused before any record
      is resolved — authorizationModel.budgetExhaustion, and read evaluationPosition there
      before moving the check.

  - id: customers.ArchiveCustomer
    title: "Archive customer"
    description: >-
      Withdraw a customer from active use while keeping the record. Use when an
      Organization stops doing business with a customer. The record remains readable by
      identifier and restorable; it is removed from the default listing and the default
      search. THIS NEVER DELETES DATA AND STARTS NO CLOCK: an archived customer is retained
      indefinitely, and only an explicit DeleteCustomer ever ends that.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/archiveCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/archiveCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, failed_precondition, quota_exceeded, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.archive
    scope: business
    sensitivity: sensitive
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      Archiving a pending-deletion customer returns failed_precondition: cancel the
      deletion first, which returns the record to 'archived' anyway.
      Archiving an already-archived customer returns failed_precondition rather than
      succeeding as a no-op. The trade is stated: a strict transition means a retried
      archive after a network failure returns an error the client must treat as success,
      but a permissive one writes an audit record saying a customer was archived when
      nothing changed, and an audit trail that records operations that did not happen is
      worse than one that is occasionally awkward to retry against. See README.md §6.
      quota_exceeded is declared because this Action writes. It is refused before any record
      is resolved — authorizationModel.budgetExhaustion, and read evaluationPosition there
      before moving the check.

  - id: customers.RestoreCustomer
    title: "Restore customer"
    description: >-
      Return an archived customer to active use. Use when an Organization resumes business
      with a customer that was archived. The record reappears in the default listing and
      the default search.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/restoreCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/restoreCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, failed_precondition, quota_exceeded, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.restore
    scope: business
    sensitivity: sensitive
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      Restoring an already-active customer returns failed_precondition, symmetrically with
      archive. Restoring a PENDING-DELETION customer also returns failed_precondition, and
      that is not symmetry — it is deliberate separation. Cancelling a deletion is
      RestoreDeletedCustomer under customers.customer.restore-deleted at organization
      scope; if this Action accepted 'pending_deletion' it would let a business-scope
      principal countermand an organization-level destruction order through the tidy-up
      permission.
      quota_exceeded is declared because this Action writes. It is refused before any record
      is resolved — authorizationModel.budgetExhaustion, and read evaluationPosition there
      before moving the check.

  # --- added by the CD-2 decision -------------------------------------------

  - id: customers.MoveCustomerToBusiness
    title: "Move customer to another business"
    description: >-
      Move one customer from the Business it is in to another Business in the same
      Organization. Use when a customer is served by a different part of the Organization
      than the one that recorded it. The customer's details and lifecycle state are
      unchanged; only which Business it belongs to changes.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/moveCustomerToBusinessInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/moveCustomerToBusinessOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, failed_precondition, quota_exceeded, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.move
    scope: organization
    sensitivity: sensitive
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      THIS ACTION EXISTS BECAUSE THE DECISION REQUIRES THE MOVE TO BE SEPARATE AND AUDITED.
      A business_id on updateCustomerInput would have been the same capability without a
      permission of its own, without an audit entry naming both Businesses, and reachable
      by a business-scope principal.
      Scope is 'organization' and not 'business': a move spans two Businesses and a
      business-scope grant is authority over one. Core still validates BOTH ends —
      destination not a Business of the authenticated Organization -> not_found (identical
      to a Business that exists nowhere, so this is not a probe for other Organizations'
      structure); destination inside this Organization but outside the principal's
      authorized set -> forbidden; source customer outside the tenant -> not_found.
      failed_precondition when the destination Business is the one the customer is already
      in. A move that moves nothing still writes an audit record saying a customer changed
      Business, and an audit trail that records operations which did not happen is the
      thing §6 of README.md refuses elsewhere; the reasoning is the same here.
      Moving a pending-deletion customer is failed_precondition. Moving an archived
      customer is ALLOWED — reorganising the Organization's own structure should not be
      blocked by a record being withdrawn from use, and an archived customer in a Business
      that no longer serves it is exactly a record someone will need to move.
      quota_exceeded is declared because this Action writes. It is refused before any record
      is resolved — authorizationModel.budgetExhaustion, and read evaluationPosition there
      before moving the check.

  # --- added by the CD-8 decision -------------------------------------------

  - id: customers.DeleteCustomer
    title: "Delete customer permanently"
    description: >-
      Request the permanent deletion of an archived customer. Use when the Organization
      must genuinely erase a customer's records rather than withdraw them. THIS IS NOT
      ARCHIVE. The record moves to 'pending_deletion' and, after 30 days, the customer's
      data is permanently purged and cannot be recovered by anyone. Within those 30 days
      the deletion can be cancelled.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/deleteCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/deleteCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, failed_precondition, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.delete
    scope: organization
    sensitivity: critical
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      sensitivity 'critical', not 'sensitive'. AUTHORIZATION_STANDARD.md §6 classes
      irreversible data destruction as critical, which requires permission + audit +
      EXPLICIT CONFIRMATION collected by the platform from the human (§7). That mechanism
      does not exist and has no decision record, so THIS ACTION IS UNREACHABLE until it
      does — on top of the permission-registration blocker that holds every Action here.
      That is fail-closed and correct: the one Action in this App that can destroy a
      tenant's data is the one that must not become reachable by accident. README.md CD-13.
      REACHABLE ONLY FROM 'archived'. Deleting an active customer returns
      failed_precondition, not a silent archive-then-delete. Deletion is then a deliberate
      two-step act by a principal who has already withdrawn the record from use, and a
      mis-click on a live customer cannot start a destruction clock. This is an
      INTERPRETATION of the decision, which fixed the policy and not the entry state; the
      alternative — allowing deletion straight from 'active' — is stated as CD-12 rather
      than assumed to be wrong.
      Deleting an already-pending-deletion customer returns failed_precondition; a second
      request does not extend, restart or shorten the window.
      httpStatusOnSuccess is 200 and the full record is returned, because nothing has been
      destroyed yet. A 204 would tell the caller the data is gone when the whole point of
      the design is that for 30 days it is not.

  - id: customers.RestoreDeletedCustomer
    title: "Cancel deletion"
    description: >-
      Cancel a pending permanent deletion and keep the customer. Use within the 30-day
      recovery window when a deletion was requested in error or is no longer wanted. The
      customer returns to 'archived' — the state it was in when the deletion was ordered.
    input: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/restoreDeletedCustomerInput" }
    output: { schemaRef: "urn:dudo:schema:customer-directory:1#/$defs/restoreDeletedCustomerOutput" }
    errors: [invalid_argument, unauthenticated, forbidden, not_found, failed_precondition, rate_limited, internal, unavailable, timeout]
    permission: customers.customer.restore-deleted
    scope: organization
    sensitivity: sensitive
    idempotent: false
    audit: true
    exposure: [internal, public]
    httpStatusOnSuccess: 200
    notes: >-
      failed_precondition on any status other than 'pending_deletion'.
      AFTER THE PURGE THERE IS NOTHING TO NAME. Once the row is gone the identifier
      resolves to nothing and this Action returns not_found — the same not_found as a
      foreign-Organization identifier and as an identifier that never existed, byte for
      byte. A distinct 'already purged' answer would turn every purged customer into a
      permanent, queryable record of the fact that the Organization once held one, which is
      the opposite of what a purge is for.
      Returns to 'archived' rather than 'active' by design: see the output schema. Making
      the customer active again requires customers.customer.restore, separately.

# ---------------------------------------------------------------------------
# manifest — the App declaration derived from this contract. Authored 2026-09-02.
# ---------------------------------------------------------------------------
manifest:
  path: packages/contracts/apps/customers/manifest.json
  lifecycle: >-
    onUninstall 'retain', with NO retentionDays, valid and TRUE under ADR 0011. The
    uninstall screen tells the tenant its customer directory is kept, and nothing in the
    platform disposes of it on a timer. See retention.manifestExpressibility.
  derivation: >-
    THE MANIFEST COPIES NO SHAPE. Its Actions carry $ref pointers into
    urn:dudo:schema:customer-directory:1 rather than duplicates of the request and response
    schemas, so the two cannot drift apart by one being edited and the other not.
    It does RESTATE the flat declarations, because the schema has no reference form for
    them: its NINE permissions, TEN Actions, evaluation scopes, sensitivities, error sets,
    audit flags, exposures and TEN routes are the ones declared in this contract, unchanged.
    Ten Actions against nine permissions is correct and not a miscount — ListCustomers and
    SearchCustomers deliberately share customers.customer.list, because search IS
    enumeration and a second permission would be a second door to the same information.
    Everything restated is a drift surface. See apis.driftIsTheRisk.
    ONE RESTATED FLAG IS NOW KNOWINGLY LOSSY, AND IT IS RECORDED RATHER THAN RECONCILED.
    manifest.json declares "audit": false for customers.GetCustomer. This contract declares
    audit false AND auditOnDenial true on that Action, and the manifest schema — a single
    boolean, additionalProperties false — has no way to say the second half. The manifest was
    NOT edited to agree, in either direction, because neither available value is true. This is
    a known divergence with a named cause, not drift discovered later: see
    audit.deniedReadAudit.manifestExpressibility and README.md §10 CD-16.
  apis:
    status: >-
      DECLARED, 2026-09-02, after ADR 0012 removed the block. The manifest's 'apis' array
      carries all TEN routes, mirroring httpBinding below one for one: same Action, same
      method, same path, same 'public' surface.
    whyDeclareRatherThanLeaveThemInHttpBindingAlone: >-
      Because 'public' without an address is half a declaration. An Action's 'exposure' says
      it MAY be surfaced publicly; only 'apis' says at which method and path, and the
      manifest is the machine-readable document that an admission path, a namespace-collision
      check and a generated OpenAPI surface actually read. Leaving the routes in this YAML
      alone would keep them true and keep them unreadable by anything.
    driftIsTheRisk: >-
      apis and httpBinding now state the same ten facts in two files, so they CAN disagree,
      and they must not. HTTPBINDING BELOW IS THE AUTHORED SOURCE; manifest.apis mirrors it.
      A route added, removed, renamed or re-methoded in one and not the other is a contract
      defect of the same class as cross-client contract drift, and catching it is a qa-agent
      check rather than a reviewer's good intentions. This duplication is already accepted
      for permissions, scopes, sensitivities and error sets; the request and response shapes
      escape it by $ref, and routes have no equivalent.
    theTwoDeferredActionsAreDeclaredToo: >-
      DeleteCustomer and RestoreDeletedCustomer have routes here even though
      mvpImplementationScope rules both OUT OF SCOPE FOR THE MVP IMPLEMENTATION, and that is
      deliberate. The manifest describes the CONTRACT's surface, not the build plan. Eight
      routes here against ten in httpBinding would create precisely the two-document
      discrepancy the paragraph above forbids, and would smear the deferral across two files
      instead of stating it once. The deferral lives in ONE authoritative place —
      mvpImplementationScope — with its reason and its blocker. A declared route is not a
      live route: nothing installs this App, and the §7 confirmation gate keeps
      DeleteCustomer unreachable whatever address it carries.
    historyThatProduced0012: >-
      RESOLVED BY docs/decisions/0012-manifest-api-path-underscore.md (Accepted,
      2026-09-02). THE BLOCK ON DECLARING 'apis' TRUTHFULLY IS GONE. The account below is
      kept in the PAST TENSE as the record of why 0012 exists; it is not an outstanding
      problem.
      WHAT WAS WRONG: app-manifest.schema.json constrained apis[].path to ^/[a-z0-9\-/{}]*$,
      which EXCLUDED THE UNDERSCORE, so /customers/{customer_id} could not be expressed.
      API_STANDARD.md §5 mandates snake_case on the wire and its own worked example is
      /api/v1/orders/{order_id} — which the pattern REJECTED. The registry contradicted the
      standard it exists to encode, and the only paths it accepted were ones the standard
      forbids.
      WHAT WAS REFUSED: {customer-id} validates. Writing it would have made the manifest pass
      at the cost of putting a kebab-case parameter on the wire in a platform that mandates
      snake_case — the same move as writing retentionDays = 30 to satisfy 0011, a field bent
      to accept a value the author knows to be wrong. It was declined, and the optional
      'apis' array was omitted instead, leaving the routes in httpBinding where they are
      expressed truthfully. Each Action still declares its 'public' exposure, so nothing was
      surfaced undeclared.
      WHAT 0012 DECIDED: add '_' to the character class — ^/[a-z0-9_\-/{}]*$. Nothing else
      changes; paths stay lowercase, stay rooted at '/', and still admit only segment
      characters, braces and hyphens. No existing manifest is invalidated, because the change
      only widens what is accepted.
      WHERE IT STANDS NOW: applied. app-manifest.schema.json carries the widened pattern as
      of 2026-09-02, and the manifest declares all ten routes with snake_case parameters.
      httpBinding below remains the authored source; manifest.apis mirrors it.
      FIXTURE COVERAGE IS OWED (0012): no fixture exercises apis[].path in either form, so
      the grammar is asserted and inspected, never executed — and there is no JSON Schema
      implementation in this repository to execute it with (ADR 0009). qa-agent adds a
      snake_case accepting case and a rejecting case (uppercase, or a space).
  deliberateOmissions:
    quotas: >-
      THE 'quotas' BLOCK IS ABSENT because freeTierImpact.atTheLimit states that the
      per-Organization customer count quota is REQUIRED before external Organizations are
      admitted but that its VALUE is a product decision NOT made — 10,000 is a
      recommendation, not a decision. Writing a number into the manifest would set that
      decision by side effect, in the file the platform reads to enforce it.
  assumptionsStated:
    platformMinimumVersion: >-
      Declared '0.1.0'. platform.minimumVersion is REQUIRED by the schema and no platform
      versioning scheme has been recorded, so any value is a guess. 0.1.0 was chosen because
      it is the honest description of a platform with no released version — '1.0.0' would
      assert a release that does not exist and would make the App uninstallable against
      every build there will ever be before it. Revisit when platform versioning is decided.
    rollbackSupported: >-
      Declared true. This is v1.0.0 with no predecessor and no migration has run, so there
      is nothing to roll back and the claim is satisfiable today. It is also an OBLIGATION
      going forward, not a formality: APP_STANDARD.md §6 requires every migration to be
      forward-only with a stated rollback path, and this flag is the manifest asserting that
      obligation is met. 'false' would additionally bar the App from the marketplace.
    permissionRequestScope: >-
      ALL NINE ARE REQUESTED AT 'organization' SCOPE IN THE MANIFEST, INCLUDING THE SIX
      WHOSE ACTIONS EVALUATE AT 'business'. That is not a contradiction, and the reason is
      the ruling recorded immediately below.

  # -------------------------------------------------------------------------
  # manifestScopeVersusActionScope — TEAM LEAD RULING, 2026-09-02.
  #
  # An INTERPRETATION of docs/decisions/0007 rule 5, NOT a separate accepted record. It is
  # written here, in full, rather than folded into a sentence, because a reader who gets
  # this wrong gets a privilege-escalation wrong. If it later needs its own ADR, it should
  # be findable, not buried.
  # -------------------------------------------------------------------------
  manifestScopeVersusActionScope:
    ruling: >-
      THE MANIFEST SCOPE IS THE CEILING. THE ACTION SCOPE IS THE EVALUATION LEVEL. They
      answer different questions, they are set at different times, and THEY NEVER ADD.
    governingText: >-
      docs/decisions/0007 rule 5, Accepted: "Requested scope cannot exceed the user, role,
      tenant or App scope. The effective scope is the INTERSECTION, NEVER THE UNION." Rule 5
      is also the rule 0007 identifies as the one whose absence allowed CRIT-1, so reading
      it as a union is not a small error.
    atInstallTime: >-
      An App is installed INTO AN ORGANIZATION. core.app.install is declared scopes
      [organization], so the installation names no Business and there is nothing for a
      business-scope App grant to be scoped to. The manifest therefore requests at
      'organization' scope, and all nine here do.
    atCallTime: >-
      The Action is evaluated at ITS OWN declared scope against THE CALLING PRINCIPAL's
      grant. business-admin, holding customers.customer.read at 'business', satisfies a
      business-scoped Action for its assigned Business and for no other. The App's
      organization-level installation does not enter that comparison as a grant.
    theErrorThisPrevents: >-
      READING THE APP'S SCOPE AS A FLOOR. It is a ceiling, never a floor. An App installed
      organization-wide does NOT give a business-admin organization-wide reach; it gives
      that principal their own business scope, through an App that is permitted to operate
      anywhere in the Organization. The union reading would silently promote every
      business-scope principal in the tenant to organization scope the moment an App was
      installed — a privilege escalation with no grant, no audit entry and no visible cause,
      triggered by an administrative act nobody would associate with permissions.
    consequenceForThisContract: >-
      NOTHING IN authorizationModel.evaluationOrder CHANGES. Steps 3, 5, 5b and 5c stand
      exactly as written: the tenant is derived from context, the permission is authorized
      at the Action's declared scope without reference to a record, the row is resolved
      inside the tenant, and only then is its business_id checked against the principal's
      authorized business set. The organization-scope manifest request widens none of that.
      The App is the envelope; Core is still the authority, on every call.
    statusOfThisReading: >-
      AN INTERPRETATION OF 0007 RULE 5, ruled by the Team Lead on 2026-09-02 and recorded
      here rather than presented as settled law. It is NOT its own accepted decision record.
      If the App-scope-versus-principal-scope relationship turns out to need one — most
      likely when the App runtime is designed under AP2/SE2 and something has to actually
      enforce the ceiling — this block is what that record supersedes.

# ---------------------------------------------------------------------------
# httpBinding — API_STANDARD.md §5.
#
# 'customers' is NOT an allocated segment in core-object-registry.yaml's
# reservedApiPathSegments, so this App is served under the App namespace, which is valid
# by construction and needs no allocation. See README.md §9: allocating the flat segment
# is a Team Lead decision that is CHEAP NOW and BREAKING LATER.
# ---------------------------------------------------------------------------
httpBinding:
  basePath: "/api/v1/apps/customers"

  # EVERY 'path' BELOW IS QUOTED, AND THE QUOTES ARE LOAD-BEARING RATHER THAN COSMETIC.
  # Each route is a YAML FLOW MAPPING — the outer { ... }. Inside a flow mapping an
  # unquoted '{' opens a NESTED flow mapping, so an unquoted /customers/{customer_id}
  # terminates the plain scalar at '/customers/' and the parser then fails with
  # "expected ',' or '}', but got '{'". The file does not parse at all: not the route, the
  # WHOLE FILE, including every tenancy, authorization and audit rule above it.
  # This is why the paths are quoted and why they stay quoted. The unbraced ones —
  # /customers and /customers/search — are legal either way and are quoted for uniformity,
  # so that adding a braced path by copying the line above cannot reintroduce the defect.
  # DO NOT 'tidy' these quotes away.
  routes:
    - { action: customers.CreateCustomer,          method: POST,   path: "/customers",                                surface: public }
    - { action: customers.ListCustomers,           method: GET,    path: "/customers",                                surface: public }
    - { action: customers.SearchCustomers,         method: GET,    path: "/customers/search",                         surface: public }
    - { action: customers.GetCustomer,             method: GET,    path: "/customers/{customer_id}",                  surface: public }
    - { action: customers.UpdateCustomer,          method: PATCH,  path: "/customers/{customer_id}",                  surface: public }
    - { action: customers.ArchiveCustomer,         method: POST,   path: "/customers/{customer_id}/archive",          surface: public }
    - { action: customers.RestoreCustomer,         method: POST,   path: "/customers/{customer_id}/restore",          surface: public }
    - { action: customers.MoveCustomerToBusiness,  method: POST,   path: "/customers/{customer_id}/move",             surface: public }
    - { action: customers.DeleteCustomer,          method: DELETE, path: "/customers/{customer_id}",                  surface: public }
    - { action: customers.RestoreDeletedCustomer,  method: POST,   path: "/customers/{customer_id}/cancel-deletion",  surface: public }
  notes:
    - >-
      /customers/search is a sub-resource read, not a verb in a path. Archive, restore,
      move and cancel-deletion are sub-resource actions on a record, which API_STANDARD.md
      §5 permits explicitly for operations that are not CRUD-shaped; each still maps to
      exactly one Action.
    - >-
      DELETE /customers/{customer_id} carries NO request body and no confirmation
      parameter. The confirmation that sensitivity 'critical' requires travels through the
      platform's elevation mechanism, which does not exist yet, and NOT through this route.
      Any implementation that invents a body field — a 'confirm' flag, a typed-name field,
      a token the client mints — has replaced a platform control with a request parameter
      an SDK caller or an AI principal can set for itself.
    - >-
      There is no route that changes business_id by any means other than
      POST /customers/{customer_id}/move. In particular PATCH /customers/{customer_id}
      rejects business_id as an unknown field, at the schema, before any handler sees it.
    - >-
      Every route is served by the same Action definition that the internal API and the SDK
      use. There is no route handler containing logic — an operation with a handler but no
      Action has no permission, no schema, no audit and no AI surface.

# ---------------------------------------------------------------------------
# events — NONE in this slice, stated explicitly rather than omitted
# ---------------------------------------------------------------------------
events:
  published: []
  consumed: []
  rationale: >-
    No event is published and none is consumed. EVENT_STANDARD.md §1: a publisher that
    would be broken by having no consumers needs an API call, not an event — and nothing
    else exists in Dudo to consume a customer event. Adding a new event type later is
    ADDITIVE (EVENT_STANDARD.md §7), so deferring costs nothing, while publishing now costs
    something real: a business-confidential payload sitting on a queue whose topology (EV1)
    and retention (EV2) are both undecided ADRs.
  reservedNames: >-
    So that a future App does not invent a second name for the same fact
    (EVENT_STANDARD.md §8), these names are RESERVED for this App and this entity and
    should be registered when a consumer first exists: customers.CustomerCreated,
    customers.CustomerUpdated, customers.CustomerArchived, customers.CustomerRestored,
    customers.CustomerMovedToBusiness, customers.CustomerDeletionRequested,
    customers.CustomerDeletionCancelled and customers.CustomerPurged, each at version 1.
    Reserving the last four now matters more than reserving the first four did: a second
    App that invents 'CustomerDeleted' for the deletion REQUEST while this App means the
    PURGE by it would put two irreconcilable meanings behind one name, on the one operation
    in this contract that destroys data. The envelope for any of them carries tenant_id and
    business_id (EVENT_STANDARD.md §3) and never the customer's personal data — a purge
    event that carried the record it purged would outlive the purge. They are NOT
    registered in event-catalog.yaml by this task, because
    registering an event nothing publishes makes the catalog aspirational, which is the one
    property that file is supposed not to have.

# ---------------------------------------------------------------------------
# mcp — NONE in this slice
# ---------------------------------------------------------------------------
mcp:
  tools: []
  rationale: >-
    No Action declares 'mcp' in its exposure. Exposure is opt-in and nothing becomes an AI
    tool by default or by accident (API_STANDARD.md §1). AI and MCP are Phase 8, and
    exposing a directory of named people and their contact details to an AI principal is a
    data-processing decision (core.ai.configure is classified critical for exactly this
    reason), not a contract detail. Every Action here is already shaped for it: one
    definition, one permission, one scope, human- and model-readable descriptions.
    ONE ACTION IS FLAGGED IN ADVANCE. customers.DeleteCustomer destroys tenant data and is
    sensitivity 'critical', so adding 'mcp' to its exposure is not the ordinary additive
    change adding 'mcp' to a read Action would be. It must not be done in the same breath
    as the others, and its confirmation must be collected by the platform from the human —
    a model asserting the user agreed is not a confirmation (MCP_STANDARD.md §5).

# ---------------------------------------------------------------------------
# audit — AUTHORIZATION_STANDARD.md §11, 0007 D14, SECURITY_STANDARD.md §6
# ---------------------------------------------------------------------------
audit:
  auditedActions:
    - customers.CreateCustomer
    - customers.UpdateCustomer
    - customers.ArchiveCustomer
    - customers.RestoreCustomer
    - customers.MoveCustomerToBusiness
    - customers.DeleteCustomer
    - customers.RestoreDeletedCustomer
  auditedSystemOperations:
    - >-
      THE PURGE. Performed by the platform, not by a principal, and audited in the purged
      customer's own Organization: platform principal, customer_id, the deletion request it
      completes, and the time. A destruction nobody recorded is indistinguishable
      afterwards from data that was never there, and this is the record the decision means
      when it says audit MAY retain the customer ID and action metadata.

  # -------------------------------------------------------------------------
  # deletionPathAudit — Team Lead ruling on CD-1, 2026-09-01. Binding.
  # -------------------------------------------------------------------------
  deletionPathAudit:
    rule: >-
      THE DELETION PATH IS AUDITED WITHOUT EXCEPTION: the deletion request
      (customers.DeleteCustomer), the recovery within the window
      (customers.RestoreDeletedCustomer), and the final purge. None of the three is subject
      to the read-audit exception below, to any tenant policy toggle, to sampling, to a rate
      limit, or to any later change made to reduce audit volume. There is no configuration
      under which one of them is not written.
    ordering: >-
      THE PURGE AUDIT RECORD IS WRITTEN BEFORE THE PERSONAL DATA IS DESTROYED, NOT AFTER.
      This INVERTS evaluationOrder step 7 — 'perform the operation, commit, then write the
      audit record' — and the inversion is deliberate and applies to the purge alone.
      WHY: after a purge there is nothing left to reconstruct the record from. The purge
      audit record is the only remaining evidence that the customer ever existed, so a purge
      that destroys the data and then fails to write its audit line leaves no trace of
      itself at all — unrecoverable by construction, silent, and indistinguishable
      afterwards from a customer that was never created.
      ORDER THE FAILURE MODES RATHER THAN HOPING NEITHER HAPPENS. Audit-then-delete fails as
      an audit record for a purge that did not complete: the row still exists, the predicate
      still matches, the job retries, and the discrepancy is VISIBLE and reconcilable.
      Delete-then-audit fails as data destroyed with no record: INVISIBLE and
      unreconcilable. The first is a discrepancy. The second is a hole.
    atomicity: >-
      WHERE THE STORAGE BOUNDARY CAN MAKE THE AUDIT WRITE AND THE ROW DELETION ATOMIC, IT
      MUST. Ordering only decides anything when the two can fail independently, and one
      transaction removes the question entirely.
      Where atomicity is not available the order above is mandatory, not a preference, and
      the cost of a retry is stated rather than hidden: if the audit write commits and the
      deletion does not, the retry writes a SECOND audit record for the same customer_id.
      Duplicate purge lines for one customer are acceptable and expected — append-only means
      they are never edited away — and a missing line is not. Duplicates can be reconciled;
      an unrecorded destruction cannot be reconstructed.
    scope: >-
      THIS APPLIES TO THE PURGE ONLY. Every other Action in this contract keeps
      evaluationOrder step 7: operate, commit, then audit. Generalising the inversion would
      make every failed mutation leave an audit record saying it happened, which is the
      failure README.md §6 refuses when it rejects permissive archive transitions.

  # auditedActions above are audited on BOTH paths — the operation and its denial. The three
  # read Actions are not on that list and are not simply 'unaudited' either, which is why the
  # flat list that used to sit here has been replaced by the two keys below. A reader who
  # takes only one of them away has the wrong picture.
  unauditedOnSuccess:
    actions: [customers.GetCustomer, customers.ListCustomers, customers.SearchCustomers]
    meaning: >-
      A SUCCESSFUL read writes no audit record. This is what survives of the CD-1 exception
      after the user's 2026-09-02 ruling, and it is deliberate — see
      audit.readAuditException.whatRemainsUnaudited.
  auditedOnDenialOnly:
    actions: [customers.GetCustomer]
    meaning: >-
      A DENIED read writes an audit record; a successful one does not. GetCustomer is the
      only Action in this contract with that shape, and it exists because of the user's
      2026-09-02 ruling. Requirements, fields, traps and the fail-closed rule are in
      audit.deniedReadAudit.
    notYetIncluded: >-
      customers.ListCustomers and customers.SearchCustomers. RECOMMENDED for the
      explicit-denial paths and NOT applied — open question CD-15. See
      audit.deniedReadAudit.collectionsRecommendation.

  # -------------------------------------------------------------------------
  # readAuditException — NARROWED BY A USER RULING, 2026-09-02. Binding.
  #
  # A DOCUMENTED, TIME-BOUNDED EXCEPTION taken by this contract. NOT a reinterpretation of
  # the standard, and the standard has NOT been edited to match.
  #
  # THE EXCEPTION IS NOW SMALLER THAN IT WAS, AND ITS REMAINING SHAPE IS DIFFERENT — not
  # just narrower. Read whatIsNowAudited, whatRemainsUnaudited and theRiskThatRemains
  # together; any one of them alone misstates the position.
  # -------------------------------------------------------------------------
  readAuditException:
    decision: >-
      SUCCESSFUL reads stay UNAUDITED in this slice. DENIED GetCustomer reads, CROSS-TENANT
      PROBING INCLUDED, ARE AUDITED, on the user's ruling of 2026-09-02. ListCustomers and
      SearchCustomers write no audit record on any path in this revision — see
      audit.deniedReadAudit.collectionsRecommendation and CD-15.
    whatIsNowAudited: >-
      EVERY DENIED customers.GetCustomer. ALL FOUR denial paths: no permission at all
      (evaluationOrder step 3, forbidden), a MALFORMED IDENTIFIER (step 4, invalid_argument),
      an identifier that does not resolve inside the tenant (step 5, not_found) — WHICH IS THE
      CROSS-TENANT CASE AND IS THE ONE THIS CONTROL EXISTS FOR — and an in-tenant customer in
      a Business outside the principal's authorized set (step 5b, forbidden). The full
      enumeration, and why step 4 belongs in it, is audit.deniedReadAudit.appliesTo.
    whatRemainsUnaudited: >-
      SUCCESSFUL READS, DELIBERATELY. A GetCustomer that returns a record, a ListCustomers
      that returns a page and a SearchCustomers that returns matches each write nothing. The
      user's ruling states this in terms — 'Keep successful customer reads unaudited' — so
      it is a decision that was made, not a part that was not reached. An implementation that
      adds success-path read auditing is not being cautious; it is departing from the ruling,
      and it puts an audit write on the busiest read path in the product on a single-threaded
      shared D1.
      ALSO STILL UNAUDITED: every path of ListCustomers and SearchCustomers, including their
      denials. That is the CD-15 gap, and it is stated here rather than left to be inferred
      from the absence of a list entry.
    conflictItIsAnExceptionTo: >-
      AUTHORIZATION_STANDARD.md §6 states that explicit access to customer information maps
      to 'sensitive' at minimum, and 'sensitive' requires an audit event. Read literally,
      that makes every customer read audited.
      THE STANDARD STANDS AS WRITTEN AND HAS NOT BEEN EDITED TO REMOVE THIS CONFLICT. A
      document quietly amended to agree with an implementation stops being a standard and
      becomes a description of what was built. The exception is recorded here, in the
      artifact taking it, which is where an exception belongs and where a reader of this
      contract will actually find it.
      WHAT THE EXCEPTION NOW COVERS IS SMALLER: the SUCCESS path of the three read Actions,
      and the denial paths of ListCustomers and SearchCustomers. The denial path of
      GetCustomer has LEFT the exception. That direction matters — SECURITY_STANDARD.md §6
      requires denial auditing for 'sensitive' and 'critical' Actions and GetCustomer is
      'read', so auditing its denials is Dudo applying a control ABOVE the standard's
      minimum on the one Action where probing is possible. The 2026-09-02 ruling therefore
      STRENGTHENS the position rather than trading one gap for another.
    boundedBy: >-
      The MVP slice. It expires when the slice is superseded and it extends to no other App,
      Action or entity by precedent. An agent citing this block to justify unaudited reads
      elsewhere is citing it wrongly.

    # -----------------------------------------------------------------------
    # theRiskThatRemains — REPLACES the block that used to be called 'acceptedRisk'.
    # The rename is not cosmetic: the risk that is accepted now is a DIFFERENT RISK from
    # the one that was accepted on 2026-09-01, and reusing the key would have let the two
    # be mistaken for one another.
    # -----------------------------------------------------------------------
    theRiskThatRemains: >-
      A PRINCIPAL LEGITIMATELY AUTHORIZED OVER A BUSINESS CAN STILL PAGE AND READ THAT
      BUSINESS'S CUSTOMERS LEAVING NO TRACE. Every one of those calls succeeds, and success
      is what is not recorded. The risk is therefore INSIDER VOLUME: a principal who is
      supposed to see these records reading far more of them than any legitimate task needs,
      and nothing in the audit trail able to show it afterwards.
      THAT IS THE VOLUME ARGUMENT THE USER ACCEPTED, AND IT IS GENUINELY A DIFFERENT RISK
      FROM UNDETECTABLE CROSS-TENANT PROBING — different actor, different reachable data,
      different detection story. The insider is already entitled to each record it reads and
      is bounded by its authorized business set; the prober is entitled to none of what it is
      reaching for and is bounded by nothing but the identifiers it can obtain. The first is
      a volume problem inside a boundary. The second was a boundary problem, and it is the
      one the ruling closed. Accepting the first was never the same act as accepting the
      second, which is precisely why the earlier statement of this exception was wrong to
      present them as one.
      STILL ACCEPTED, for the MVP slice, on the user's explicit instruction, and still not a
      finding to be rediscovered. Full statement in README.md §10.1.
    theRiskThatWasClosed: >-
      UNDETECTABLE CROSS-TENANT PROBING THROUGH GetCustomer. A principal in Organization A
      putting identifiers it should not hold to GetCustomer, learning from the answers, and
      leaving nothing behind. It is closed for GetCustomer by the ruling above; it is NOT
      closed for ListCustomers and SearchCustomers, where a caller can still name a foreign
      business_id and be refused without a record being written. See CD-15.
    historyOfThisException: >-
      PAST TENSE, KEPT DELIBERATELY, because it is why the ruling exists and because the
      correction it records is one a later reader would otherwise make again.
      WHAT THIS EXCEPTION ORIGINALLY WAS. Ruled on 2026-09-01: all three read Actions
      unaudited on all paths, as the user scoped it. Its accepted risk was stated in this
      contract as 'a principal holding only customers.customer.list can page the ENTIRE
      customer base of their Organization and leave no audit trail. With no export permission
      declared, THE WHOLE OF THAT RISK SITS ON LIST.'
      WHY IT WAS NARROWED, AND WHAT ESTABLISHED THE TRUE SIZE. That statement was not stale;
      IT WAS FALSE AS WRITTEN, and qa-agent's INDEPENDENT VERIFICATION is what established
      it. The risk did not sit on 'list'. It also covered GetCustomer, where DENIED and
      CROSS-TENANT reads were equally unaudited. qa-agent ran a cross-tenant probing campaign
      entirely through GetCustomer and it produced ZERO audit records, while the same campaign
      run through ArchiveCustomer produced one per attempt — the same identifiers, the same
      tenant boundary, the same refusals, and a complete difference in what survived. That
      asymmetry is what turned an accepted risk into a decision the user needed to take again
      with the true shape in front of them, and on 2026-09-02 they took it.
      WHY THE RECORD IS KEPT RATHER THAN OVERWRITTEN. An exception whose stated risk was
      wrong is a specific kind of defect: it was reviewed, accepted, and re-read as settled,
      and its wrongness was invisible precisely because it had been accepted. Deleting the
      sentence would leave the ruling looking like a change of mind. It was not. It was a
      correction, found by verification that did not take the contract's own word for it, and
      the practice that found it is worth more than the sentence it fixed.
    futureObligation: >-
      COARSE-GRAINED ENUMERATION AUDITING — who enumerated, when, and how many results — and
      deliberately NOT an audit record per individual record read.
      The distinction is the point, and it is stated so the cheap control is not lost behind
      the expensive one. Auditing individual GetCustomer calls is expensive and low-value: it
      puts an audit write on the busiest read path in the product, on a single-threaded
      shared D1, and produces a log nobody can read. Auditing that an enumeration OCCURRED is
      cheap — one record per list or search call, not one per row — and it is the control
      that would actually catch bulk exfiltration, because bulk exfiltration IS enumeration.
      WE ARE DEFERRING THE CHEAP, USEFUL ONE, NOT THE EXPENSIVE ONE. That is the honest
      description of what this exception costs, and it is why the obligation is named
      concretely here rather than left as 'audit reads one day'.
      THE 2026-09-02 RULING DOES NOT DISCHARGE THIS OBLIGATION AND MUST NOT BE READ AS
      HAVING DONE SO. Denial auditing and enumeration auditing catch different things:
      denial auditing catches a principal reaching for what it may not have, and enumeration
      auditing catches a principal taking everything it MAY have. The insider in
      theRiskThatRemains triggers no denials at all — every one of its reads succeeds — so
      the new control is silent on exactly the risk that is still accepted. Both are owed;
      one now exists.

  # -------------------------------------------------------------------------
  # deniedReadAudit — USER RULING, 2026-09-02, relayed by the Team Lead. BINDING.
  #
  # THIS IS THE PROBE-DETECTION CONTROL. It is what closed the half of the CD-1 exception
  # that qa-agent's independent verification showed had been stated falsely. Read it with
  # readAuditException.historyOfThisException, which is why it exists.
  # -------------------------------------------------------------------------
  deniedReadAudit:
    ruling: >-
      THE USER'S WORDS, VERBATIM: "Audit every denied GetCustomer read attempt, including
      cross-tenant probing. Keep successful customer reads unaudited."
      RECORDED BY THE TEAM LEAD AS 'D2' in docs/decisions/README.md, 'Open user decisions',
      Decided 2026-09-02, binding. This contract calls it the CD-1 NARROWING because that is
      the exception it modifies; D2 and the CD-1 narrowing are the same ruling under two
      names, and neither document is the other's summary.
    appliesTo: >-
      customers.GetCustomer, and EVERY denied invocation of it, whatever the denial path.
      FOUR PATHS, NOT THREE — the earlier revision of this block enumerated three and was
      incomplete:
        step 3  -> forbidden          — the principal does not hold customers.customer.read
                                        at a satisfying scope. Record-independent.
        step 4  -> invalid_argument   — THE IDENTIFIER IS MALFORMED and fails input
                                        validation before any lookup is attempted.
        step 5  -> not_found          — the identifier did not resolve inside the tenant.
                                        THE CROSS-TENANT CASE, and the centre of this ruling
                                        rather than an edge of it.
        step 5b -> forbidden          — the customer is in this Organization, in a Business
                                        outside the principal's authorized set.
      SO GetCustomer DENIALS EMIT FOUR ERROR CODES ACROSS FOUR PATHS, and 'forbidden' is
      emitted at two of them. Anything that counts three is counting the version of this
      block that predates 2026-09-02 and is wrong about what is built.
      It does NOT extend to ListCustomers or SearchCustomers in this revision — see
      collectionsRecommendation.
    whyStep4IsIncluded: >-
      ADDED AFTER core-agent REPORTED AUDITING IT AND FOUND THIS BLOCK SILENT ON IT. The
      contract was corrected to match what is built rather than the behaviour being removed
      to match the contract, and the Team Lead ruled that way deliberately.
      A CALLER SENDING MALFORMED IDENTIFIERS IN A LOOP IS A PROBING SIGNATURE. Dropping those
      records would leave a gap in exactly the pattern this control exists to detect — and it
      would be the most attractive gap available, because reaching it requires no valid
      identifier at all. A prober who learns that well-formed probes are recorded and
      malformed ones are not has been handed the shape of the blind spot.
      IT IS ALSO THE CHEAPEST DENIAL TO PRODUCE, which is why it matters twice: see
      README.md §10 CD-17 on write amplification, where step 4 is the path an attacker
      reaches for precisely because it costs them nothing to generate.
    doesNotIntroduceSuccessAuditing: >-
      REQUIREMENT 7, AND IT IS A LIMIT ON THE CONTROL, NOT A NOTE ABOUT IT. A successful
      GetCustomer writes NOTHING. An implementation that audits both paths 'for symmetry' has
      not been thorough; it has implemented a different decision from the one the user made,
      on the busiest read path in the product, on a single-threaded shared D1. The
      success-path silence is load-bearing and is asserted positively in the tests
      (README.md §12).
    externalResponseUnchanged: >-
      REQUIREMENT 1. THE EXISTENCE ORACLE STAYS CLOSED, AND THIS CONTROL DOES NOT OPEN IT.
      A missing customer and an inaccessible one produce the SAME EXTERNAL RESPONSE they
      produced before this ruling: not_found, byte-identical in status code, error code,
      message string, details array, response-size class and headers, with request_id the
      only permitted difference (notFoundVersusForbidden.indistinguishability, unchanged).
      The audit record is written on the server and is never reflected to the caller — not in
      a field, not in a header, not in a timing difference the implementation introduces by
      writing on one path and not another in a way the caller can measure. Nothing in
      customer-directory-v1.schema.json changes, and neither client sees this control at all.
      The in-tenant wrong-Business case still returns forbidden, as
      notFoundVersusForbidden.wrongBusiness rules; that difference is between IN-TENANT and
      EVERYTHING ELSE, and this ruling does not disturb it.
    recordFields: >-
      REQUIREMENT 2. The denied-read record carries: the ACTOR'S principal type and id; the
      ACTOR'S Organization and its business context — the authenticated context's own
      Organization and authorized business set, NEVER the target's; the action id
      (customers.GetCustomer); the timestamp; THE REQUESTED CUSTOMER IDENTIFIER AS THE CALLER
      SUPPLIED IT; the denial reason, which is the Action's ErrorCode — see denialReason
      below, and note that the three-token vocabulary once proposed here was RULED AGAINST;
      and the correlation id.
      Also the ordinary record fields — app id, and the permission and scope actually
      evaluated — so that this record is the same shape as every other audit record and can
      be read by the same query. See audit.record.fields.
      THE ACTOR'S CONTEXT, NEVER THE TARGET'S. On a cross-tenant probe the target has no
      context the caller is entitled to, and there is nothing resolved to take one from. A
      record naming the target's Organization or Business would be the disclosure the refusal
      withheld, written down.
    noForeignPersonalData: >-
      REQUIREMENT 3, AND THE TRAP IN IT IS THE MOST IMPORTANT SENTENCE IN THIS BLOCK.
      NO FOREIGN CUSTOMER'S PERSONAL DATA GOES INTO THE AUDIT RECORD. No display_name, no
      email, no phone, no address, no notes, no country — and no business_id or
      organization_id belonging to the record either.
      RECORDING THE REQUESTED IDENTIFIER IS NOT THE SAME AS RECORDING THE RECORD. The
      identifier is a string the CALLER authored and already holds; echoing it back into the
      caller's own tenant's audit trail teaches the caller nothing it did not bring with it.
      That is the whole of what may be written.
      THE TRAP, STATED SO NOBODY WALKS INTO IT WHILE TRYING TO BE HELPFUL: RESOLVING THE
      FOREIGN ROW TO ENRICH THE AUDIT ENTRY WOULD ITSELF BE THE CROSS-TENANT READ THIS
      CONTROL EXISTS TO DETECT. To put the probed customer's name or Business into the record,
      an implementation must first look the row up — and under evaluationOrder step 5 the
      storage boundary has ALREADY applied the tenant predicate and found nothing, so the only
      way to obtain those values is to run a second query WITHOUT the tenant predicate. Under
      0006 Option A that query succeeds and returns another Organization's customer. The
      security control would become the vulnerability, in the one code path guaranteed to be
      exercised by an attacker, and it would look like diligence in review. There is nothing
      to copy at step 5 because nothing was resolved; that is the correct state and it must
      be left alone.
    # -----------------------------------------------------------------------
    # denialReason — TEAM LEAD RULING, 2026-09-02. BINDING.
    #
    # architecture-agent PROPOSED a fixed three-token vocabulary here
    # (permission_denied / business_not_authorized / unresolved_identifier). THE TEAM LEAD
    # RULED AGAINST ADOPTING IT. The proposal and the refusal are both recorded, because a
    # reader who found only the proposal would implement it.
    # -----------------------------------------------------------------------
    denialReason:
      rule: >-
        THE DENIAL REASON IS THE ACTION'S ErrorCode, DRAWN FROM THE CLOSED PLATFORM TAXONOMY
        DECLARED IN THIS ACTION'S 'errors' LIST. It is never free text, and never a value
        derived from a lookup. On GetCustomer that is: forbidden (steps 3 and 5b),
        invalid_argument (step 4), not_found (step 5). No App-local synonym is minted for any
        of them.
      theSecurityREQUIREMENTIsMetByThis: >-
        AND IT WAS NEVER ABOUT THE TOKEN NAMES. Requirement 4 asks for exactly one property:
        that a CROSS-TENANT PROBE and a FABRICATED IDENTIFIER be INDISTINGUISHABLE in a
        tenant-readable record. The ErrorCode taxonomy satisfies it, because 'not_found' IS
        UNSPLIT — the same single value covers an identifier belonging to another Organization
        and one that exists nowhere, exactly as the external response does. That is the whole
        of what the requirement needs, and it needs it from the VALUE being unsplit, not from
        the value being called something particular.
        VERIFIED RATHER THAN ASSERTED: core-agent's column-by-column diff over the full record
        table found the only differences between the two cases are the per-request identifiers
        and the caller's own authored string. The property is measured, not argued.
        THE UNSPLITTABILITY IS THE BINDING PART AND IT SURVIVES THIS RULING UNCHANGED.
        'not_found' must never be subdivided into 'another Organization' and 'nowhere' in any
        tenant-readable record. SECURITY_STANDARD.md §6 states a tenant can read its OWN audit
        log, so such a split would hand the tenant, in writing, the exact fact the not_found
        response was shaped to withhold — the existence oracle closed at the API and reopened
        in the audit trail, at a slower speed and with a permanent record. A probing campaign
        would then not need to read the responses at all; it would read its own audit log
        afterwards. Cross-tenant details and internal denial reasons DO NOT APPEAR IN
        TENANT-VISIBLE RECORDS. If a finer internal classification is ever wanted for platform
        security telemetry it lives on a platform-internal surface no tenant can read, and
        THIS CONTRACT DOES NOT DEFINE THAT SURFACE.
      whyTheProposedRENAMEWasRefused: >-
        THE DECIDING POINT IS THAT denial_reason IS A CORE-WIDE COLUMN, NOT THIS APP'S FIELD.
        GetCustomer emitting 'unresolved_identifier' while ArchiveCustomer emits 'not_found'
        FOR THE IDENTICAL CONDITION would make that column POLYMORPHIC — its meaning depending
        on which Action wrote the row. That breaks this contract's own requirement, stated in
        deniedReadAudit.recordFields, that a denied-read record be THE SAME SHAPE as every
        other audit record and READABLE BY THE SAME QUERY. A vocabulary that works for one
        Action is not a vocabulary.
        THE PROPOSED TOKENS ALSO HAD NO HOME for conflict, failed_precondition or
        quota_exceeded — denial conditions that exist elsewhere in this very contract. A
        three-token set that cannot name the denials of the Actions beside it was never a
        taxonomy; it was three labels for one Action's three paths, and it did not even cover
        four once step 4 was counted.
      whyBusinessNotAuthorizedWasSPECIFICALLYNotAdopted: >-
        BECAUSE IT WOULD HAVE ADDED A DISTINCTION THE RECORD DOES NOT CURRENTLY MAKE. Steps 3
        and 5b both emit 'forbidden'; the proposed tokens would have SPLIT them, so that a
        durable tenant-readable record newly distinguished 'you hold no permission' from 'this
        record exists in a Business you may not reach'.
        THAT IS NOT A NEW LEAK — the HTTP forbidden already discloses it, and
        notFoundVersusForbidden.wrongBusiness rules deliberately that in-tenant existence
        disclosure is acceptable. BUT A WIDENING OF WHAT A DURABLE TENANT-READABLE RECORD
        DISTINGUISHES MUST BE A DECISION, NEVER A SIDE EFFECT OF A RENAME. Arriving at it
        through a naming change is how a security-relevant property gets extended without
        anyone deciding to extend it, which is the failure mode this whole revision exists
        because of.
        THE EXISTING PROTECTION IS UNCHANGED AND IS THE ONE THAT MATTERS AT 5b: the record
        does NOT name the customer's actual business_id. audit.record's wrong-Business rule
        applies exactly as written.
      coreWideTaxonomyIsScheduledNotSETTLED: >-
        Whether Dudo wants a denial-reason taxonomy finer than ErrorCode is a CORE-WIDE
        question, and it is recorded as SCHEDULED ITEM 9 in docs/decisions/README.md. It is
        not this App's to answer, and this contract does not answer it. What this contract
        binds is the property, not the naming: not_found stays unsplit, and no foreign row is
        resolved to enrich a record.
      consistencyWithCD5: >-
        Unchanged by the ruling. audit.record already requires, for a not_found on a MUTATING
        Action, 'the identifier AS SUPPLIED BY THE CALLER, marked unresolved, and NOTHING
        derived from any record'. GetCustomer follows that rule rather than a new one — which
        is now literally true in the data as well as in the prose, since both write the same
        'not_found'. CD-5 remains the open question behind both; this ruling does not close
        it.
    failClosedOnEvidence:
      rule: >-
        REQUIREMENT 6. THE AUDIT EVENT MUST NOT FAIL OPEN. An inability to create the required
        security evidence is SURFACED INTERNALLY — as an error and as an alertable condition —
        and is never swallowed, never best-effort, never fire-and-forget, and never dropped
        because the request was going to fail anyway.
      whatTheCallerSees: >-
        THE SAME not_found, UNCHANGED. Fail-closed here cannot mean 'refuse the request',
        because the request is ALREADY being refused — that is what makes this different from
        an ordinary fail-closed control, and it is why the rule needs stating rather than
        being left to the reflex.
        NOR MAY THE RESPONSE CHANGE TO 'internal' WHEN THE AUDIT WRITE FAILS. That would make
        the external answer depend on the state of the audit subsystem, which hands a prober a
        way to detect that the subsystem is down and a window in which to probe unrecorded —
        it converts an evidence failure into an attacker's signal. External behaviour is fixed;
        the failure is visible internally, to the operator, and nowhere else.
      relationshipToThePurgeOrdering: >-
        DELIBERATELY NOT THE SAME RULE, and the difference is worth reading. The purge inverts
        evaluationOrder step 7 and writes its audit record BEFORE destroying data, because
        after a purge nothing survives to reconstruct the record from
        (deletionPathAudit.ordering). A denied read destroys nothing and changes nothing, so
        there is no state to order the write against and no inversion to make. What is owed
        here is only that the failure to record is LOUD internally rather than silent.
    alertingAndAggregation: >-
      REQUIREMENT 5. Repeated attempts must support SECURITY ALERTING and COARSE AGGREGATION —
      a run of denials from one principal, or against one tenant, must be countable and
      alertable without an operator reading records one at a time. That is a property of the
      record shape, and it is why the fields above are fixed rather than free-form: actor,
      action, reason and time are the four the aggregation groups by, and correlation id is
      what ties a campaign together across Actions.
      AGGREGATION IS A READ-SIDE PROPERTY AND IS NEVER A LICENCE TO DROP RECORDS. Every denied
      attempt produces its own record. Sampling, coalescing 'N similar attempts' into one row,
      or suppressing after a threshold would each delete exactly the evidence a campaign
      consists of, and would do it fastest precisely when an attack is loudest.
      ONE INTERACTION TO BE DELIBERATE ABOUT RATHER THAN TO DISCOVER: rate_limited is a
      declared error on GetCustomer. A request rejected by the rate limiter BEFORE any
      authorization decision is made has produced no denial to audit, and writing one would be
      recording a decision that was never taken. A request that REACHES an authorization
      decision and is denied writes its record, and no volume control may be placed between
      the decision and the write. Where the rate limiter sits relative to authorization is
      Core's design and is not settled here; that it must not become a way to make denials
      unrecorded IS settled here.
    collectionsRecommendation:
      question: >-
        The user named GetCustomer. Are denied ListCustomers and SearchCustomers the same
        case? OPEN — README.md §10 CD-15. NOT APPLIED, and auditOnDenial is false on both.
      answer: >-
        PARTLY, AND THE PART THAT IS THE SAME IS THE PART WORTH AUDITING. These Actions have
        two different denial shapes and they should not be treated alike:
          THE SILENT-FILTER PATH IS GENUINELY DIFFERENT AND SHOULD NOT BE AUDITED. An
          unfiltered ListCustomers or SearchCustomers asserts no scope and names no identifier;
          rows the caller may not reach are simply absent
          (notFoundVersusForbidden.collections). There is no denial, no refused attempt and
          nothing an attacker learned — so there is no event to record, and auditing it would
          mean writing a record on every ordinary successful listing, which is success-path
          read auditing arriving through a side door and is exactly what requirement 7
          forbids.
          THE EXPLICIT-DENIAL PATHS ARE THE SAME CASE AS GetCustomer. Two of them: a caller
          that does not hold customers.customer.list at a satisfying scope (step 3), and — the
          one that matters — a caller that EXPLICITLY NAMES a business_id it is not authorized
          over (step 5c), which returns not_found for a Business of another Organization and
          forbidden for an unauthorized Business of its own. That second one is structurally
          identical to the GetCustomer probe: an identifier the caller supplied, an answer that
          partitions the identifier space, and no record left behind. The object probed is a
          BUSINESS rather than a CUSTOMER, which makes it worse and not better — a successful
          probe yields a page of customers rather than one record.
      recommendation: >-
        RECOMMENDED: set auditOnDenial true on customers.ListCustomers and
        customers.SearchCustomers for the EXPLICIT-DENIAL PATHS ONLY — step 3 and step 5c —
        and explicitly NOT for the silent-filter path. Same ErrorCode denial reason, same
        prohibition on resolving anything to enrich the record, same fail-closed rule.
      theCoherenceArgumentThatDECIDESIT: >-
        AFTER THE RULING, THE ONLY UNWATCHED business_id PROBE LEFT IN THIS APP IS THE
        COLLECTIONS ONE. CreateCustomer and MoveCustomerToBusiness both take a business_id and
        both are audit true, so their denials — including a foreign business_id — already
        produce records. GetCustomer is now watched. That leaves ListCustomers and
        SearchCustomers as the one door with no camera on it, reachable with a plain GET, and
        an attacker enumerating foreign Business identifiers would simply use it. A control
        that covers every entrance but one is not a partial control; it is a redirection.
      whyItIsNOTAPPLIEDHERE: >-
        BECAUSE THE USER RULED ON GetCustomer AND SILENTLY WIDENING A RULING IS HOW A RULING
        STOPS MEANING WHAT IT SAID. The Team Lead's instruction was explicit that this be
        recommended and flagged, not assumed. The collections case is also NOT identical — the
        silent-filter half genuinely differs, and half of a widening applied without being
        asked is still a widening. The assumption operating in the meantime is stated plainly:
        denied collection reads write NOTHING, and that gap is live until the user rules.
    manifestExpressibility: >-
      A REGISTRY GAP, FLAGGED AND NOT WORKED AROUND — README.md §10 CD-16.
      app-manifest.schema.json declares actions[].audit as a single BOOLEAN with
      additionalProperties FALSE on the Action object. It can express 'audited' and
      'not audited' and it has no way to express 'audited on denial, not on success'. So
      packages/contracts/apps/customers/manifest.json says "audit": false for
      customers.GetCustomer, and after this ruling that is no longer the whole truth.
      NEITHER AVAILABLE VALUE IS TRUE. 'false' understates the control and would let a reviewer
      conclude the probe-detection audit does not exist; 'true' would assert that successful
      reads are audited, which is the thing requirement 7 forbids, in the document
      APP_STANDARD.md §9 requires to be true to the tenant. Writing either to make the manifest
      agree with the contract would be the same move as writing retentionDays = 30 to satisfy
      the schema (0011) or {customer-id} to satisfy the path pattern (0012) — a field bent to
      carry a value the author knows to be wrong — and it is declined for the third time on the
      same grounds.
      NOT FIXED HERE, AND DELIBERATELY SO. app-manifest.schema.json is a registry and
      manifest.json is the Team Lead's file (README.md §13); architecture-agent authored
      neither in this revision and did not edit them now. The finding is reported. The
      precedent 0011 and 0012 set is that a registry that cannot express a decided policy is a
      SCHEMA DEFECT needing its own decision record, not something the taking artifact
      quietly works around.
      MEANWHILE THE CONTRACT IS THE AUTHORITY. This file carries 'audit' and 'auditOnDenial'
      as two flags on each read Action, which states the position exactly; manifest.json's
      single 'audit' flag is a lossy projection of it. That is a KNOWN, RECORDED divergence in
      a document that manifest.derivation already names as a drift surface — it is not a
      contract defect discovered later, and it must not be 'reconciled' by changing the
      contract to match what the manifest can say.
    freeTierImpact: >-
      NEGLIGIBLE IN NORMAL OPERATION. This adds at most one audit write per DENIED
      GetCustomer. Denials are rare on a healthy system, so the success path — the busy one,
      and the reason the read exception exists at all — takes no new write and the
      queryBudget figures above are unchanged for it. A denied Get costs 1 read attempt + 1
      audit write, still far inside the 50-queries-per-invocation limit. No new Cloudflare
      service, no new product, USD 0 / BD 0 at rest.
      NOT NEGLIGIBLE UNDER ATTACK. See writeAmplification below, which is an OPEN RISK and
      not a cost note; the earlier revision of this passage treated it as one and understated
      it.

    # -----------------------------------------------------------------------
    # writeAmplification — OPEN RISK. Reported by core-agent, 2026-09-02. Recorded as
    # SCHEDULED ITEM 10 in docs/decisions/README.md and marked BLOCKING ON AZ2 by the
    # Team Lead. README.md §10 CD-17.
    # -----------------------------------------------------------------------
    writeAmplification:
      risk: >-
        D2 MAKES EVERY DENIED READ A D1 WRITE, AND NOTHING RATE-LIMITS AN AUTHENTICATED
        CALLER. Sustained probing therefore forces UNBOUNDED WRITES into a SINGLE-THREADED
        SHARED DATABASE (0006 Option A). Two consequences, both landing on parties who did
        nothing: LATENCY FOR EVERY OTHER ORGANIZATION in the shared database, and METERED
        SPEND against the USD 0 ceiling that 0008 makes binding.
      whyThisIsTheSAMESHAPEASTheOracle: >-
        THE PROBE-DETECTION CONTROL IS ITSELF AN AMPLIFICATION PATH. An attacker who cannot
        read a single foreign customer can still make the platform write once per attempt, at
        a rate they choose, in a database everyone shares. The control converts cheap
        attacker effort into expensive platform work — which is the same shape as the
        audit-log oracle recorded in denialReason: THE CONTROL BECOMING THE VULNERABILITY.
        That both were found in one feature is the argument for looking for the third.
        THE STEP 4 PATH IS THE CHEAPEST ONE TO ABUSE. A malformed identifier needs no valid
        customer_id, no knowledge of any tenant and no reconnaissance — it is a string. So the
        denial path that costs the attacker least is the one that costs the platform a write,
        and the two facts sit together deliberately in this contract rather than in two
        documents that never meet.
      notExploitableTODAYAndWhyThatIsNotAFIX: >-
        IT IS NOT EXPLOITABLE TODAY ONLY BECAUSE PRODUCTION SHIPS A DENY-ALL PRINCIPAL
        RESOLVER: no principal authenticates, so no caller reaches an authorization decision
        to be denied at. THAT IS A DEPLOYMENT ACCIDENT STANDING IN FOR A CONTROL, and it
        expires the moment AZ2 lands. The risk is dormant, not absent, and the distinction is
        the whole reason it is written here rather than deferred.
      mustBeBoundedBeforeAZ2: >-
        BINDING SEQUENCING, NOT A RECOMMENDATION. THIS MUST BE BOUNDED BEFORE AZ2 MAKES THE
        SLICE REACHABLE. The Team Lead has marked scheduled item 10 BLOCKING ON AZ2. An
        authentication mechanism that lands while this is unbounded turns a dormant risk into
        a live one on the same day, with no further change and nothing to notice.
      candidateMitigations: >-
        A PER-ACTOR WRITE CEILING, COARSE AGGREGATION OF REPEATED IDENTICAL DENIALS, OR BOTH.
        Not chosen here — the mechanism is Core's and the decision is the Team Lead's.
        WHATEVER IS CHOSEN MUST NOT REINTRODUCE FAIL-OPEN. alertingAndAggregation stands:
        aggregation is a read-side property, and a ceiling that silently stops recording is
        an attacker's off switch — it would make the loudest attack the one that disappears
        from the log fastest. A ceiling that is REACHED must itself be an alertable,
        internally-surfaced event, so that the evidence of suppression exists even when the
        suppressed records do not.
        THE OTHER HALF OF THE ANSWER STAYS WHERE IT WAS: refusing attempts at the rate limiter,
        BEFORE they reach an authorization decision, produces no denial to audit and therefore
        no write. That is a mitigation at the door rather than at the log, and it is the one
        that does not trade evidence away.
  record:
    fields: >-
      timestamp, tenant, principal type and id, acting-on-behalf-of where applicable, app
      id, action id, the permission and scope actually evaluated, target resource
      identifier, the decision, and correlation id. For every audited Action here the
      target resource identifiers include the customer's business_id, and for
      MoveCustomerToBusiness both the source and the destination business_id — identifiers
      inside the caller's own tenant, never business data, and the move record is
      meaningless without both ends.
      ON A DENIED CALL 'the decision' CARRIES A DENIAL REASON WHICH IS THE ACTION'S ErrorCode
      — the closed platform taxonomy, not an App-local synonym — and 'target resource
      identifier' is the identifier AS THE CALLER SUPPLIED IT with nothing resolved from it.
      THAT IS WHY EVERY AUDITED ACTION HERE RECORDS DENIALS THE SAME WAY: GetCustomer's
      not_found and ArchiveCustomer's not_found are the SAME VALUE for the same condition, so
      denial_reason stays a single Core-wide column readable by one query. See
      deniedReadAudit.denialReason for the ruling that settled this and for what it refused.
    rules:
      - "Append-only. Never updated, never deleted by application code."
      - >-
        IDENTIFIERS AND DECISIONS, NEVER BUSINESS DATA. An UpdateCustomer audit record
        names WHICH FIELDS CHANGED — the field names — and never the old or new values. A
        CreateCustomer audit record carries the customer_id and never the display_name. An
        audit log that accumulates customer names and addresses is a second copy of the
        business data with different access rules.
      - >-
        FAILURES ARE AUDITED, NOT ONLY SUCCESSES. A denied create, update, archive,
        restore, move, delete or cancel-deletion produces an audit record. An attack looks
        like a long run of failures, and a log containing only successes cannot show one.
        THE WRONG-BUSINESS DENIAL IS AUDITED SPECIFICALLY. It is the one authorization
        failure in this contract that depends on a record, so it is the one that a run of
        attempts can use to map the Organization's own directory across Businesses. The
        record names the caller-supplied customer_id and the permission and scope
        evaluated. It does NOT name the record's actual business_id: telling the log which
        Business the caller was refused turns the audit trail into the disclosure the
        refusal withheld, for anyone who can read the log at a narrower scope than the
        record.
      - >-
        THE AUDIT TRAIL SURVIVES THE PURGE AND NEEDS NO SCRUBBING TO DO SO. Because audit
        records carry identifiers and decisions and never field values, a purged customer's
        audit history already contains no personal data — nothing has to reach into an
        append-only log to erase anything, which is fortunate, because an append-only log
        that application code edits is neither append-only nor a log. This is what makes
        the user's 'audit MAY retain the customer ID and action metadata, but NOT deleted
        personal details' satisfiable at the same time as 'never updated, never deleted'.
        IT IS ALSO A STANDING OBLIGATION, NOT A ONE-OFF CHECK: any future change that puts
        a field VALUE into an audit record — a display_name 'for readability', a diff, an
        error message quoting input — silently creates a copy of the personal data that the
        purge cannot reach, and turns a compliant purge into a partial one.
      - >-
        For a not_found on a mutating Action, the record carries the identifier AS SUPPLIED
        BY THE CALLER, marked unresolved, and NOTHING derived from any record — not whether
        one exists elsewhere, not a foreign tenant id, not a foreign principal id. This is
        an INTERPRETATION of az7-r3's requirement that the attempt be audited in the
        caller's tenant without disclosing the other tenant's data, and it is flagged as
        open question CD-5 rather than assumed correct.

# ---------------------------------------------------------------------------
# freeTierImpact — .claude/rules/architecture.md §6a requires this before the feature is
# built. Figures are the D1 FREE-tier limits recorded in MULTITENANCY_STANDARD.md §7.3.
# ---------------------------------------------------------------------------
freeTierImpact:
  allowancesConsumed: [d1-storage, d1-queries-per-invocation, worker-invocations, cron-triggers]
  recomputedFor: >-
    RE-RUN ON 2026-09-01 for the CD-2 and CD-8 changes: business_id adds a column and an
    index, and deletion_scheduled_at adds a column. The previous revision's headline
    figures mixed conventions — the typical projection carried an index/page overhead
    allowance and the worst case did not — so the arithmetic below states BASE ROWS and
    INDEX separately and adds them, rather than restating a number whose basis was
    inconsistent. The new totals are larger partly because of this change and partly
    because the previous ones were understated at the worst case.
  rowSize:
    typical: "~424 bytes — the previous ~400, plus ~24 for business_id. deletion_scheduled_at is null in every state except pending_deletion and costs nothing typical."
    worstCase: >-
      ~3.15 KB — display_name 200 + email 254 + phone 32 + country 2 + address 500 + notes
      2000, plus identifiers, business_id and timestamps, before index overhead. The
      2000-character notes field is still where the worst case lives; business_id moves it
      by well under 1%.
  newIndex: >-
    The two-level check needs (organization_id, business_id, display_name, customer_id) to
    be servable without a scan — the tenant predicate first, the business predicate second,
    then the fixed sort order of README.md §8. Key size ~90 bytes typical, ~270 bytes at a
    200-character display_name.
  projection: >-
    A closed beta of at most 10 Organizations (MULTITENANCY_STANDARD.md §7.5) at 5,000
    customers each = 50,000 rows.
      TYPICAL:    424 B x 50,000  = ~21.2 MB base, plus ~4.5 MB for the new index = ~26 MB.
      WORST CASE: 3,150 B x 50,000 = ~157.5 MB base, plus ~13.5 MB for the new index
                  = ~171 MB.
    That is ~5% and ~34% of the 500 MB shared production ceiling from this one feature,
    against ~4% and ~31% before this revision — so the CD-2 change costs roughly 5 MB
    typical and 15 MB at the worst case, most of it the index rather than the column. Both
    figures exclude the pre-existing indexes and the audit table. The worst case is the
    number that matters, because the ceiling is shared with every other Organization and
    every other feature.
  queryBudget: >-
    Well within the 50-queries-per-Worker-invocation limit: Get 1, List 1, Search 1, Create
    1 insert + 1 audit write, Update 1 read + 1 write + 1 audit write, Move 1 read + 1
    write + 1 audit write, Delete 1 read + 1 write + 1 audit write, RestoreDeleted the
    same. No total-count query exists, which is one of the reasons the collection envelope
    has no total.
    A DENIED GetCustomer NOW COSTS 1 AUDIT WRITE in addition to the resolution attempt, under
    the 2026-09-02 ruling. The SUCCESS path — the busy one — takes no new write and the
    figures above are unchanged for it.
    THE FIGURES ABOVE ASSUME A HEALTHY SYSTEM AND DO NOT BOUND AN ATTACKED ONE. Every denied
    read is a write into the shared single-threaded database, nothing rate-limits an
    authenticated caller, and the projection has no term for a probing campaign because the
    campaign's size is the attacker's choice rather than a usage estimate. This is an OPEN
    RISK that MUST BE BOUNDED BEFORE AZ2 — audit.deniedReadAudit.writeAmplification and
    README.md §10 CD-17. It is not costed here because a number would imply a ceiling that
    does not currently exist.
    THE AUTHORIZED BUSINESS SET IS NOT A PER-ACTION QUERY. It belongs to the authorization
    decision and arrives with the authenticated context. If Core must instead read it per
    invocation that is +1 query on every Action in this App — still far below 50, but it is
    a per-request cost on the busiest path in the product and it should be a deliberate
    choice rather than something discovered in profiling.
  purgeJobBudget: >-
    NEW COST, NEW ALLOWANCE. The 30-day purge needs a scheduled Worker (Cloudflare cron
    triggers, part of the approved Workers service — no new product). It runs per tenant
    and its predicate is indexed on (status, deletion_scheduled_at) within the tenant, so
    it reads a queue that is empty on almost every run. Empty runs are the normal case and
    cost one query per tenant per run; a daily schedule at 10 Organizations is ~300 Worker
    invocations a month against the free daily allowance, which is negligible. What is NOT
    negligible is the failure mode: a purge job whose predicate is wrong deletes rows, and
    under 0006 Option A there is no infrastructure boundary to stop it doing so across
    Organizations.
  atTheLimit: >-
    A per-Organization customer count quota is REQUIRED before external Organizations are
    admitted, so that reaching it returns quota_exceeded — a first-class declared error on
    CreateCustomer — rather than silently consuming the shared ceiling. The VALUE of that
    quota is a product decision and is NOT set here; 10,000 per Organization is the
    recommendation. At 85% of the 500 MB ceiling, onboarding of new Organizations stops
    (§7.5).
    CUSTOMER DATA IS NEVER DELETED TO STAY WITHIN A FREE TIER, AND THE CD-8 DECISION MAKES
    THAT SHARPER RATHER THAN SOFTER. Now that a purge mechanism exists, the temptation to
    reach for it under storage pressure exists too. It must not be: the only path to purge
    is an explicit authorized deletion followed by 30 days, and running out of free storage
    is a reason to stop onboarding, never a reason to schedule a deletion nobody requested.
  cost: "USD 0 / BD 0 per month. No new service, no new product, no paid feature. Cron triggers are part of the already-approved Workers service."

# ---------------------------------------------------------------------------
# versioning
# ---------------------------------------------------------------------------
versioning:
  contractVersion: 1
  apiVersion: v1
  changeClass: additive
  note: >-
    This is the first version of a contract with no consumers, so it is additive by
    definition. Changes that would be BREAKING once either client ships: moving the base
    path to the flat namespace, changing the default status filter, changing the sort or
    pagination semantics, narrowing customer_type, making an optional field required,
    changing an Action's permission or scope, and adding a required version token to
    UpdateCustomer. Changes that remain additive: a new optional request field, a new
    response field, a new Action, a new error code for a NEW condition, and adding 'mcp' to
    an Action's exposure.
  thisRevision: >-
    STILL v1 AND STILL ADDITIVE, BECAUSE NOTHING CONSUMES IT YET — and that window is
    exactly why both decisions were worth making now. Had either client shipped first,
    EVERY ONE of these would have been breaking under API_STANDARD.md §6: a new required
    request field (business_id on create), a new required response field on two shapes, two
    new members in the customerStatus enumeration that a client switching on status would
    not handle, a new member in statusFilter, and a change to every Action's evaluated
    scope from 'organization' to 'business'. The scope change alone is the kind
    API_STANDARD.md §6 calls out, and it would have required /api/v2 for a decision that
    costs nothing today. This is the concrete form of the CD-7 timing argument: decide
    contract shape before either client is written.
  auditRulingIsNotAWireChange: >-
    THE 2026-09-02 DENIED-READ AUDIT RULING CHANGES NO SHAPE AND IS NOT EVEN ADDITIVE ON THE
    WIRE — it is invisible there. No request field, no response field, no status code, no
    error code and no message string changes; customer-directory-v1.schema.json was not
    edited; neither client is affected and no client-side work follows from it. It is a
    server-side control, and requirement 1 of the ruling is precisely that the external
    surface stay identical.
    THAT IS ALSO WHY IT COULD BE MADE NOW AND COULD BE MADE LATER. Unlike CD-2 and CD-8, this
    one would not have been breaking after either client shipped. It was made now because the
    contract's statement of the accepted risk was FALSE, not because the window was closing.
  futureBreaking: >-
    Additionally breaking once either client ships, from this revision's additions:
    changing customerDeletionRetentionDays from 30 (it changes a legally meaningful
    deadline both clients display), returning RestoreDeletedCustomer to 'active' instead of
    'archived', allowing DeleteCustomer directly from 'active', and making business_id
    optional on create with a server-side default. Additive: a per-Business quota, an
    optional business_id filter on further Actions, and a PurgeScheduled event.
