# Apps never modify Core UI. An App naming an unknown location fails installation
# rather than silently rendering nowhere. (APP_STANDARD.md §8)
# ---------------------------------------------------------------------------
uiExtensionLocations:
  - id: Dashboard.Widget
    status: proposed
    phase: 2
    description: "A card on the tenant dashboard."
  - id: Customer.Profile.Tab
    status: proposed
    phase: 2
    description: "A tab on a customer profile page."
  - id: Navigation.Menu
    status: proposed
    phase: 2
    description: "An entry in primary navigation."
  - id: Business.Settings
    status: proposed
    phase: 2
    description: "A settings panel within a Business."
  - id: Search.Provider
    status: proposed
    phase: 2
    description: "A source contributing results to platform search."
  - id: ActivityTimeline.Item
    status: proposed
    phase: 2
    description: "A renderer for an activity timeline entry."

# ---------------------------------------------------------------------------
# reservedApiPathSegments — the flat /api/v1/<resource> namespace.
#
# Reserved for Core and registered official Apps. Every other App is served under
# /api/v1/apps/<app_id>/... Two Apps never hold one path. (API_STANDARD.md §5)
# ---------------------------------------------------------------------------
reservedApiPathSegments:
  - segment: apps
    owner: core
    status: proposed
    description: "The namespace under which every non-reserved App is served. Permanently reserved."
  - segment: platform
    owner: core
    status: proposed
    description: >-
      ADDED 2026-09-05, REQUIRED BY platform-operator-v1. The fourth request class — platform
      routes — is served here. Reserving the segment makes assertNoReservedPathCollision refuse any
      App route table that could resolve onto it, which matters more here than for any other
      segment: AN App THAT COULD SERVE A PATH UNDER /api/v1/platform COULD PRESENT ITSELF AS THE
      ADMIN CONSOLE and harvest an operator's actions.
      The route block is additionally mounted ONLY on the admin host, and a request to
      /api/v1/platform/** on app.dudo.work or api.dudo.work answers 404 rather than 403 — but that
      host binding is defence in depth and this reservation is the structural control.
