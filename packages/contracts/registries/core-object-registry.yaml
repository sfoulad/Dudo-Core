# ---------------------------------------------------------------------------
# namingRuling2026-09-05 — the inner unit is renamed. architecture-agent's ruling, made on
# the Team Lead's explicit delegation. IT IS A BREAKING CHANGE TO A PROPOSED CONTRACT and
# therefore needs a decision record before it is applied; nothing below is applied yet.
# ---------------------------------------------------------------------------
namingRuling2026-09-05:
  ruling: >-
    THE TENANT STAYS `Organization`. THE INNER UNIT BECOMES `Workspace`. `Branch` IS UNCHANGED.
    AND NO USER-FACING STRING IS EVER THE INTERNAL NAME — every level carries a display label
    that a business type may set, so a school shows "Campus", a shop "Branch", a clinic "Site",
    and a software company "Team". The rename is for developers and the public API; the label is
    for users. EITHER HALF ALONE IS INSUFFICIENT: a label alone leaves `business_id` in the API a
    third-party App author reads, and a rename alone leaves a school looking at the word
    "Workspace".
  whyWorkspaceAndNotBranchOrLocationOrSite: >-
    `Branch` COLLIDES — it is already a declared level BELOW this one, and taking the name would
    collapse two levels into one to fix a word. `Location` and `Site` BOTH IMPLY PREMISES, and
    Dudo's stated market is startups and SMEs including software companies that have none; a
    name that is wrong for a fifth of the market is not neutral. `Workspace` is ALREADY THE
    RECORDED ALTERNATIVE in this file — the description has read "A Business/Workspace inside an
    Organization" since it was written — so this selects between two names Dudo already uses
    rather than inventing a third. It is free of industry nouns, which CORE_BOUNDARIES.md §6 rule
    1 requires of any identifier in Core, and it reads correctly for a campus, a clinic site, a
    retail branch and a team with no premises.
  whyTheTenantIsNotRenamed: >-
    The user's own phrasing — "business admin, business managers, business staff" — uses
    "business" for the TENANT, which is the other half of the collision. It is not fixed by
    renaming Organization. `organizationId`, `organization_membership`, the `organization` table
    and the `organization` SCOPE are the most deeply embedded identifiers in the platform, and
    "Organization" is the settled industry term for a tenant. The user's word is served by the
    tenant's own display label — "School Group", "Practice", "Company" — at no schema cost.
  surfaceAffected: >-
    packages/contracts/core/organization/business-read-v1 (both files and its README) ·
    packages/contracts/apps/customers (business_id throughout) · permission-catalog.yaml
    (core.business.read, core.business.create, core.business.update, and the six customers.*
    permissions declaring `business` scope) · the `business` scope VALUE in the scope ladder ·
    platform/core (authorizedBusinessIds, businessScope, authorizeSuppliedBusiness,
    business-directory.ts, business-read.ts, the business table and customer.business_id) ·
    platform/web · Dudo-Apple. NOT `Branch`, and NOT the Organization.
  whyNow: >-
    THIS IS THE CHEAPEST IT WILL EVER BE, AND THE WINDOW IS SHORT. No contract in this directory
    is Accepted, the Customer Directory slice has not passed step 7, and there are two
    Organizations on the platform. Every one of those facts stops being true soon. A public API
    name is the canonical example of a decision that is trivial before customers and permanent
    after them.
  sequencing: >-
    NOT FIRST, AND NOT LAST. It must land BEFORE onboarding and business types, because both
    write the inner unit and would otherwise be built on the old name and renamed twice. It must
    land AFTER the current slice reaches step 7 — accepted or abandoned — because platform/web is
    being edited against the old name right now and a rename mid-slice destroys in-flight work
    for no gain. It does NOT depend on business types: ship it with default labels and let types
    supply per-type labels additively.

