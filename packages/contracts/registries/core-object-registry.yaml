---
# Dudo Core Object Registry
#
# Every object Core owns. If it is not here, Core does not own it — it belongs to an App
# or a Capability. Adding an entry requires passing the four-question inclusion test in
# docs/architecture/standards/CORE_BOUNDARIES.md §2, with the answers recorded in the task
# specification.
#
# Governed by: docs/architecture/standards/CORE_BOUNDARIES.md
# Owner:       architecture-agent authors; Team Lead accepts.
#
# STATUS OF THIS FILE
# Every entry is status "proposed", which means NOT YET BUILT — it does not mean optional
# or unapproved. These are the objects entailed by Core's declared responsibilities
# (CORE_BOUNDARIES.md §3) and the App lifecycle (APP_STANDARD.md §9), recorded so Phase 1
# builds against a reviewed set. No entry here is a data model.
#
# "No code and no schema exist" was true when this file was written and IS NO LONGER TRUE.
# As of 2026-09-05, Principal, Organization, OrganizationMembership, Session, AuthCredential,
# Business, AuditEvent and TenantDirectoryEntry all have reviewed schemas under
# platform/core/migrations/**, and several have running code. The `status: proposed` values
# below have not been individually re-verified against that code and should not be read as
# current build state. Correcting them is a separate pass; the tenancy correction recorded
# under spec was made now because the classification was WRONG rather than merely stale.
#
# The tenancy model is DECIDED: docs/decisions/0006-tenancy-model.md is Accepted (user,
# 2026-09-01) — one shared production D1 database with mandatory indirection, for the
# Zero-Cost MVP while 0008 is active. Every tenant-scoped object below therefore carries
# tenant_id on every row and every query, and isolation is enforced entirely in code.

registryVersion: 1
updated: "2026-09-05"

# ---------------------------------------------------------------------------
# spec
# ---------------------------------------------------------------------------
spec:
  entryRequiredFields: [name, domain, tenancy, appAccess, status, phase, description]
  tenancyValues:
    tenant-scoped: "Belongs to exactly one tenant (Organization). Every access carries tenant scope."
    tenant-independent: "Platform-owned. Contains no tenant business data. Stored separately from tenant data."
    control-plane: >-
      Names a tenant but is not stored inside one. It lives in the control-plane database
      (docs/decisions/0014 §C), carries NO tenant_id column, and is read BEFORE any
      Organization is known. This value was added 2026-09-05 because the two existing values
      could not describe these objects and the registry therefore described them wrongly —
      see the correction note below.
  tenancyCorrection2026-09-05: >-
    FOUR ENTRIES BELOW WERE MARKED tenant-scoped AND WERE WRONG. Principal, Organization,
    OrganizationMembership and Session are all control-plane objects under docs/decisions/0014
    §C, Accepted. `platform/core/migrations/control-plane/0001_principal.sql` states the rule
    for the whole directory — "NO TABLE IN THIS DIRECTORY HAS A tenant_id COLUMN, AND NONE MAY
    GAIN ONE" — and `0003_organization_membership.sql` names this file specifically: "THAT
    ENTRY IS WRONG, and it is wrong in a way that cannot be patched by adding a column... The
    registry is architecture-agent's file. The correction is reported, not made here." This is
    that correction, made.
    WHY IT WAS WRONG IS THE PART WORTH KEEPING: the classification was circular. A
    tenant-scoped read requires a tenant-scoped store handle; a handle requires an
    Organization; and these four objects are precisely what is read to DISCOVER the
    Organization. An entry that cannot be read without the answer it produces is not a
    tenancy classification, it is a deadlock written as one.
    IT CHANGES NO CODE. `platform/core/**` already implements the corrected classification;
    only this file disagreed with it.
  appAccessValues:
    none: "Apps cannot reach it at all."
    read-via-contract: "Readable through a published Core contract, subject to permission."
    write-via-contract: "Readable and writable through a published Core contract, subject to permission."
  note: >-
    appAccess NEVER means direct storage access. Apps reach Core only through explicit,
    versioned contracts. There is no exception for first-party Apps.

# ---------------------------------------------------------------------------
# objects
# ---------------------------------------------------------------------------
objects:

  # --- tenancy ----------------------------------------------------------------
  - name: TenantDirectoryEntry
    domain: tenancy
    tenancy: tenant-independent
    appAccess: none
    # "proposed" means not yet built. It does NOT mean optional or unapproved:
    # this object is REQUIRED by an accepted decision.
    status: proposed
    phase: 1
    requiredBy: "docs/decisions/0006-tenancy-model.md §0.2 — Status: Accepted (user decision, 2026-09-01)."
    description: >-
      Maps an Organization to the storage binding that holds its data. Read only by Core's
      server-controlled TenantStoreResolver. Under the decided model every Organization
      resolves to the same production binding — the mapping exists anyway, so that moving
      to pooled shards later changes no business-domain code and no public contract.
    notes: >-
      REQUIRED, not conditional. 0006 §0.2 is Accepted and makes the TenantStoreResolver
      indirection binding by explicit user decision — the opposite of the earlier situation,
      in which this entry was blocked because the indirection rested only on a
      recommendation (MAJ-21, now resolved). Apps, plugins, Connectors, and clients cannot
      select a database or binding; an unknown Organization mapping FAILS CLOSED; the
      resolver returns only Core-configured bindings; business services never touch D1
      directly. This entry is a resolver-owned mapping, never an App-reachable object, and
      it is itself an isolation boundary: a principal in one Organization must not resolve,
      receive, or cache another's binding, and that needs its own test
      (MULTITENANCY_STANDARD.md §7.2, §8). Also binding, and separate: 0003 constraint 2 —
      storage sits behind a Core-owned port — which is an interface rule, not an object.

  # --- identity ---------------------------------------------------------------
  - name: User
    domain: identity
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A person. Identity is platform-level; membership binds a user to tenants."
    notes: >-
      A user may belong to more than one Organization, so the User record itself cannot be
      tenant-scoped. Everything ABOUT a user within a tenant hangs off OrganizationMembership,
      which is. Getting this backwards leaks the tenant list of a shared user.

  - name: OrganizationMembership
    domain: identity
    tenancy: control-plane
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "Binds a User to an Organization, with status and the role that Organization grants them."
    notes: >-
      CORRECTED 2026-09-05 from tenant-scoped. The question it answers at login — "which
      Organizations may this principal enter" — SPANS TENANTS BY CONSTRUCTION, so no single
      tenant scope can answer it. Built as `control-plane/0003_organization_membership.sql`.
      IT CARRIES THE GRANT (docs/decisions/0019): a `role` column, a closed union, mapped to a
      frozen permission list in Core. The role is per-Organization BECAUSE it sits here rather
      than on Principal — a principal belonging to several Organizations must not carry
      authority across them. It carries NO business assignment: for an organization-scope
      principal the authorized Business set is read from the TENANT database after the store
      resolves (docs/decisions/0020).
      A PROFILE STILL DOES NOT LIVE HERE. The registry's original claim that the per-tenant view
      of a user hangs off membership stands as intent, but no profile column exists and adding
      one is organization-structure work with its own contract.

  - name: Session
    domain: identity
    tenancy: control-plane
    appAccess: none
    status: proposed
    phase: 1
    description: "An authenticated session bound to one principal, with an OPTIONAL active tenant."
    notes: >-
      CORRECTED 2026-09-05 from tenant-scoped, which was circular: a session is read to
      discover the tenant. docs/decisions/0014 §C.1 makes it PRINCIPAL-scoped;
      `control-plane/0004_session.sql` is the schema.
      `activeOrganizationId` IS NULLABLE AND THAT IS THE DESIGN. A session begins with no
      Organization selected and there is deliberately no "first membership wins" fallback,
      because a silent default is an ambient tenant. Selection is a separate authenticated
      request in its own route class (docs/decisions/0021).

  - name: AuthCredential
    domain: identity
    tenancy: tenant-independent
    appAccess: none
    status: proposed
    phase: 1
    description: "A user's authentication material. Never readable, never returned, never logged."

  - name: MfaFactor
    domain: identity
    tenancy: tenant-independent
    appAccess: none
    status: proposed
    phase: 1
    description: "A registered second factor. MFA-ready architecture from the start."

  - name: Invitation
    domain: identity
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A pending invitation into a tenant."

  # --- organization structure -------------------------------------------------
  - name: Organization
    domain: organization
    tenancy: control-plane
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "The tenant. The isolation boundary. Owns the data and holds the subscription."
    notes: >-
      CORRECTED 2026-09-05 from tenant-scoped. The Organization record IS the tenant boundary
      and therefore cannot sit inside one; `control-plane/0002_organization.sql` holds it, with
      an identifier and a status and deliberately nothing else — no name, no country, no plan.
      Tenant = Organization is still a recommendation pending Team Lead confirmation
      (MULTITENANCY_STANDARD.md MT1).
      THE MISSING NAME IS A LIVE PRODUCT CONSEQUENCE, not a schema detail: an Organization
      picker can list 22-character opaque identifiers and nothing a human can choose between.

  # RENAME PROPOSED 2026-09-05: Business -> Workspace. The entry keeps its current name until
  # the Team Lead records the decision, because renaming it here before the record exists would
  # be the object registry deciding a breaking contract change on its own authority. The full
  # ruling and its cost are in the `namingRuling2026-09-05` block at the foot of this file.
  - name: Business
    domain: organization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A Business/Workspace inside an Organization. An authorization scope, not an isolation boundary."
    notes: >-
      THE NAME IS WRONG AND THE USER FOUND IT, NOT THE TEAM. "Business" is Dudo's word for a unit
      INSIDE a tenant, and it is every customer's word for the tenant itself — so a form reading
      "which of your Businesses is this customer filed under" appears to ask which COMPANY the
      customer belongs to when it means which branch. The collision is not confined to UI copy:
      it is in `core.business.read`, `authorizedBusinessIds`, `businessScope`, `customer.business_id`
      and the `business` table, which is to say in the public API a third-party App author will
      read. See namingRuling2026-09-05. THE OBJECT AND ITS SEMANTICS DO NOT CHANGE — it remains
      an authorization scope and never an isolation boundary.

  - name: Branch
    domain: organization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A Branch/Location inside a Business. Optional in use, never optional in the model."
    notes: >-
      UNCHANGED BY THE 2026-09-05 NAMING RULING, AND ITS EXISTENCE IS WHY THAT RULING DID NOT
      SIMPLY RENAME Business TO Branch. `Branch` is ALREADY TAKEN and already means a level below
      the one being renamed. Renaming Business to Branch would have collapsed two declared levels
      into one and silently deleted a level of the model to fix a word. Nothing is built here yet
      — no table, no code, only three catalogued permissions — so the level is cheap to keep and
      would be expensive to reintroduce.

  - name: Team
    domain: organization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A first-class object with a manager, members, roles, permissions, and a branch. Can be a principal."

  - name: TeamMembership
    domain: organization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "Binds a principal to a Team. Membership grants the Team's permissions."

  # --- principals and authorization -------------------------------------------
  - name: Principal
    domain: authorization
    tenancy: control-plane
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "The uniform subject of authorization: user, team, service-account, ai-agent, or iot-device."
    notes: >-
      CORRECTED 2026-09-05 from tenant-scoped. `control-plane/0001_principal.sql` is
      platform-wide by construction — an identifier, a type and a status, with no tenant_id, no
      credential material, no email address and no list of Organizations, each omission
      recorded there as security design rather than as scope.
      A PRINCIPAL MAY HOLD ZERO MEMBERSHIPS, and that state is reachable today: it
      authenticates (credentials hang off `principal_credential`, which is also tenant-free) and
      can then obtain no tenant store, so every business Action answers `failed_precondition`.
      That is the structural reason a platform operator cannot read tenant data — see
      openQuestions CO4, which is about the authority such a principal would need and does not
      have anywhere to hold.

  - name: ServiceAccount
    domain: authorization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A machine principal for integrations. Never a shared human account."

  - name: AiAgentPrincipal
    domain: authorization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 8
    description: >-
      An AI principal, optionally acting on behalf of a user. Effective permission is the
      intersection of its grants and the user's — never the union.

  - name: IotDevicePrincipal
    domain: authorization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 5
    description: "A device principal, narrowly scoped — usually branch or resource, usually one permission."

  - name: ApiCredential
    domain: authorization
    tenancy: tenant-scoped
    appAccess: none
    status: proposed
    phase: 1
    description: >-
      A credential bound to exactly one principal with an explicit permission set — never
      "everything its creator has", which silently grows as the creator's role grows.
      Listable and revocable, with last use visible.

  - name: Role
    domain: authorization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A named bundle of permissions at a scope. Customer-definable; never hardcoded."

  - name: RoleAssignment
    domain: authorization
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "Grants a Role to a Principal at a Scope. Revocation takes effect on the next call."

  - name: PermissionDefinition
    domain: authorization
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "The declared permission, sourced from permission-catalog.yaml and each App's manifest."

  - name: AppPermissionGrant
    domain: authorization
    tenancy: tenant-scoped
    appAccess: none
    status: proposed
    phase: 2
    description: >-
      A tenant's grant of a declared permission to an installed App. Enforced by Core on
      every invocation — not once at load, not by the SDK, not by the App.

  # --- platform billing -------------------------------------------------------
  - name: Plan
    domain: billing
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A platform subscription tier with its quotas."

  - name: Subscription
    domain: billing
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: >-
      A tenant's platform subscription and status. Billing for USING Dudo — never a tenant's
      own business payment processing, which belongs to the Payment Capability and an App.

  - name: Quota
    domain: billing
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "A limit derived from the tenant's plan. Exceeding one returns quota_exceeded."

  - name: UsageRecord
    domain: billing
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "Metered usage per tenant, App, and principal — including AI token and cost attribution."

  - name: MarketplaceCharge
    domain: billing
    tenancy: tenant-scoped
    appAccess: none
    status: proposed
    phase: 6
    description: "A charge for a paid marketplace item. Carries no payment instrument data."

  # --- core platform services --------------------------------------------------
  - name: Notification
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: write-via-contract
    status: proposed
    phase: 1
    description: "A message delivered to a principal. Core is the default provider of the Notifications capability."

  - name: File
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: write-via-contract
    status: proposed
    phase: 1
    description: >-
      A stored object. Key is prefixed t/<tenant_id>/<app_id>/ — ownership is in the key,
      not only in metadata, so listing cannot cross a tenant even by mistake.

  - name: AuditEvent
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: >-
      Append-only record of a sensitive or critical operation, success or denial. Contains
      identifiers and decisions, never the business data itself. Never updated or deleted
      by application code.

  - name: ActivityEntry
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: write-via-contract
    status: proposed
    phase: 1
    description: "A user-visible timeline item. Distinct from AuditEvent, which is a security record."

  - name: Setting
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: write-via-contract
    status: proposed
    phase: 1
    description: "Tenant configuration at organization, business, or branch scope."

  - name: FeatureFlag
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 1
    description: "Per-tenant feature state."

  - name: SearchIndexEntry
    domain: platform-services
    tenancy: tenant-scoped
    appAccess: write-via-contract
    status: proposed
    phase: 1
    description: "An indexed record. The index is tenant-partitioned — a shared index is a shared data store."
    notes: "Blocked: no search engine is approved (MULTITENANCY_STANDARD.md MT5)."

  # --- app runtime and marketplace ---------------------------------------------
  - name: App
    domain: marketplace
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 2
    description: "A registered App and its marketplace identity."

  - name: AppVersion
    domain: marketplace
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 2
    description: "One published version of an App, with its validated manifest."

  - name: Installation
    domain: marketplace
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 2
    description: >-
      An App installed into a tenant, with its lifecycle state and configuration. The record
      a webhook resolves its tenant from — never a payload field.

  - name: CapabilityDefinition
    domain: capability
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 5
    description: "A registered capability version and its actions, errors, and semantics."

  - name: CapabilityProvider
    domain: capability
    tenancy: tenant-independent
    appAccess: none
    status: proposed
    phase: 5
    description: "A Connector declaring it implements one capability version for one vendor."

  - name: ProviderConfiguration
    domain: capability
    tenancy: tenant-scoped
    appAccess: none
    status: proposed
    phase: 5
    description: >-
      A tenant's selection and configuration of a provider, including credential references.
      Never visible to an App — an App that can read a payment credential can move money
      outside the platform.

  - name: EventTypeDefinition
    domain: events
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 2
    description: "A registered event type and version, sourced from event-catalog.yaml."

  - name: EventSubscription
    domain: events
    tenancy: tenant-scoped
    appAccess: none
    status: proposed
    phase: 2
    description: "An App's subscription to an event type within a tenant, from its manifest."

  - name: WorkflowDefinition
    domain: workflow
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 2
    description: "A registered long-running process definition. Core owns the runtime; the App owns the process."

  - name: WorkflowRun
    domain: workflow
    tenancy: tenant-scoped
    appAccess: read-via-contract
    status: proposed
    phase: 2
    description: >-
      One execution, carrying tenant and correlation id on the run and every step. No step
      widens the tenant scope. Carries identifiers and progress, not business records.

  - name: McpToolRegistration
    domain: mcp
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 8
    description: >-
      An Action exposed to AI, derived from the Action definition. There is no MCP-only
      code path. Discovery is filtered per principal, because a tool list is a description
      of the system.

  - name: Template
    domain: marketplace
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 1
    requiredBy: "docs/decisions/0025 decision 2 (Accepted). Contract: packages/contracts/core/platform/template-v1."
    description: >-
      A business type. A name and the display labels each structural level carries for
      Organizations adopting it. ARCHITECTURE.md §1's fifth extension type, arriving in phase 1
      rather than phase 6 — a scheduling change, not a new concept.
    notes: >-
      THE INCLUSION TEST IS RECORDED IN template-v1.contract.yaml theBoundary, as
      CORE_BOUNDARIES.md §2 requires. Four yeses; the one that does the work is §2.3, and it turns
      on a distinction: RULE 6.1 GOVERNS TYPES, TABLES, COLUMNS, FUNCTIONS AND ROUTES, NOT ROWS. A
      row reading "Dental Clinic" is data; a `dental_clinic` column is a defect.
      A TEMPLATE MAY NAME Apps AND CARRY LABELS. IT MAY NEVER CONTAIN LOGIC — no workflow, no
      validation rule, no pricing rule, no expression in any field. The moment it carries one,
      business-specific behaviour is inside Core permanently and cannot be removed.
      IT CARRIES NO ROLE VOCABULARY IN VERSION 1 (permission-catalog.yaml AZ11), and no Apps list
      while there is one App. Both are additive later.

  - name: PlatformOperator
    domain: authorization
    tenancy: control-plane
    appAccess: none
    status: proposed
    phase: 1
    requiredBy: "docs/decisions/0025 decision 1 (Accepted). Closes CO4 and AZ9."
    description: >-
      Binds a principal to a platform role. ITS EXISTENCE IS THE AUTHORITY — there is no flag on
      Principal, no membership row, and no platform value in MembershipRole.
    notes: >-
      A SEPARATE TABLE RATHER THAN A COLUMN, AND THE REASON IS AN INVARIANT: 0024 requires a
      platform principal to hold ZERO membership rows, and AN INVARIANT THAT DEPENDS ON NOBODY
      ADDING A ROW IS NOT AN INVARIANT. Two tables make "appears in both" a question a machine can
      ask, checked on write AND at authorization, FAILING CLOSED — a principal in both is refused
      everywhere, never resolved in favour of either.
      NO ROUTE CREATES ONE. Bootstrapping is an out-of-band operator action, and there is
      deliberately no core.platform-operator.create in permission-catalog.yaml. This table keeps
      the property credential-reset-v1 gives up for principal_credential: no request, authenticated
      or not, can create or change a row here.
      THE MUTUAL EXCLUSION IS WHY A PLATFORM OPERATOR CANNOT READ TENANT DATA. No membership means
      no Organization selection, which means no tenant store, which means no row behind
      whereWithTenant. Break-glass access remains AZ3 and is not decided by 0025.

  - name: PlatformOperatorAuditRecord
    domain: authorization
    tenancy: control-plane
    appAccess: none
    status: proposed
    phase: 1
    requiredBy: "platform-operator-v1 P4 and auditModel. NEEDS ITS OWN DECISION RECORD — PO-1 — before it is built."
    description: >-
      An append-only record of one platform-operator action: actor, platform role, action id,
      target organization_id or principal_id, outcome, timestamp, correlation id.
    notes: >-
      IT IS NOT THE LOG control-plane/0003_organization_membership.sql REFUSED, AND THE CONSTRAINT
      IS WHAT MAKES IT A DIFFERENT OBJECT: that refusal was of an append-only log of tenant BUSINESS
      events spanning every tenant. This holds only who acted, what they did, which Organization or
      principal they named, and when. NO BUSINESS DATA OF ANY KIND — no customer, no field value,
      no name, and NO CREDENTIAL. A COLUMN CARRYING TENANT BUSINESS DATA MAY NEVER BE ADDED HERE,
      and that sentence is normative rather than descriptive.
      IT IS THE PLATFORM'S HALF OF A TWO-HOME AUDIT MODEL. The other half is a record in the
      affected Organization's own tenant-scoped audit_event, because a trail only the platform can
      read is a trail kept by the party being audited. Both are required; see platform-operator-v1
      auditModel for the ordering and the partial-failure behaviour.

  - name: Developer
    domain: developer
    tenancy: tenant-independent
    appAccess: none
    status: proposed
    phase: 3
    description: "A registered developer or publisher."

  - name: MarketplaceListing
    domain: marketplace
    tenancy: tenant-independent
    appAccess: read-via-contract
    status: proposed
    phase: 6
    description: "The public listing for an App, Capability, Connector, AI Skill, or Template."

  - name: ReviewSubmission
    domain: marketplace
    tenancy: tenant-independent
    appAccess: none
    status: proposed
    phase: 6
    description: "A submission moving through draft, automated validation, security review, moderation, approval, publication."

# ---------------------------------------------------------------------------
