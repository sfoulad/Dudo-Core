openQuestions:
  - id: CO1
    question: "User is tenant-independent while OrganizationMembership is tenant-scoped. Cross-tenant users are a real product case but a real isolation hazard."
    recommendation: "Confirm explicitly. A user's list of Organizations must never be visible to any of them."
    blocks: "Phase 1 schema"
  - id: CO2
    question: "No entry here is a data model. Column shapes, keys, and indexes still have to be designed."
    recommendation: >-
      MT2 is now closed — 0006 is Accepted, so the placement is known: one shared
      production database, tenant_id on every tenant-scoped row and every query. A schema
      may now be designed from this file, but the schema itself is separate work and no
      table shape is recorded here.
    blocks: "Nothing. The tenancy blocker is resolved."
  - id: CO3
    question: "SearchIndexEntry assumes a search engine. None is approved."
    recommendation: "Blocked pending an ADR. Whatever is chosen, the index is tenant-partitioned."
    blocks: "Phase 1 search"

  # -------------------------------------------------------------------------
  # CO4-CO6 recorded 2026-09-05, from the super-admin / business-type request. RECORDED,
  # NOT RESOLVED — architecture-agent proposes and the Team Lead records (docs/decisions/README.md).
  # -------------------------------------------------------------------------
  - id: CO4
    question: >-
      A PLATFORM OPERATOR HAS AN IDENTITY AND NO AUTHORITY, AND THERE IS NOWHERE TO PUT THE
      AUTHORITY. The identity is not the gap: `Principal` is control-plane and a principal with
      zero memberships already exists, authenticates, and reaches nothing. The gap is that
      EVERY GRANT IN DUDO IS REACHED THROUGH A MEMBERSHIP ROW — docs/decisions/0019 puts the
      role there, `grantsForRole` is called only from the membership-backed source, and a
      principal with no membership therefore holds no permission by any path at all. There is no
      platform-tier carrier, no object here that could be one, and `MembershipRole` is a closed
      union of two organization-scope values.
      THE DANGEROUS FIX IS THE OBVIOUS ONE. Giving the operator a membership row with a wide
      role works immediately and is a cross-tenant breach assembled entirely out of legitimate
      parts: `authorization/scope.ts` ranks `platform` above every other scope, so a
      platform-tier grant on a membership row would satisfy every Action at every scope, and the
      storage boundary would scope it to that Organization without complaint. Repeat per
      Organization and the isolation guarantee is gone with no rule broken and no code changed.
    recommendation: >-
      A SEPARATE CONTROL-PLANE OBJECT holding platform authority, never a value of
      MembershipRole and never a column on a row an Organization can cause to be written. Two
      invariants belong with it and are both checkable: a principal holding platform authority
      has ZERO membership rows, and `MembershipRole` never gains a platform-tier value —
      `assertRoleMappingIsCoherent` already rejects any grant outside `organization` scope and
      is the natural place for the second. Reaching tenant BUSINESS data stays closed and is
      AZ3 break-glass, which is a different decision and must not be solved by this one.
      Needs its own decision record; not invented here.
    blocks: "Any platform-operator capability, including the business-type registry (CO5)."
  - id: CO5
    question: >-
      "BUSINESS TYPE" ALREADY EXISTS IN THE ARCHITECTURE UNDER ANOTHER NAME AND IN A LATER
      PHASE. ARCHITECTURE.md §1 records **Template** as the fifth extension type — "a
      pre-configured combination of Apps and settings for a business type: Salon, Dental Clinic,
      Gym. Carries no code" — with "the user selects a business type, not a set of technical
      modules" as the promise it keeps. It is scheduled for Phase 6 and has no standard, no
      object here, and no permission in permission-catalog.yaml. So a platform-authored business
      type is not a new concept; it is Template arriving early, and §1 also records that the five
      extension types are closed and a sixth is a Constitution amendment.
      THE CORE BOUNDARY QUESTION IS SHARPER THAN IT LOOKS. A REGISTRY of named configurations
      passes CORE_BOUNDARIES.md §2 — it is the same shape for a clinic and a freight company,
      and rule 6.1's "no industry nouns" governs types, tables, columns, functions and routes,
      NOT the rows a customer or operator writes into them. A row named "Dental Clinic" is data;
      a `dental_clinic` column is a defect. THE BOUNDARY IS BEHAVIOUR: the moment a business type
      carries a workflow, a validation rule, a pricing rule or anything else executable, it stops
      being data and puts business-specific behaviour inside Core, permanently.
    recommendation: >-
      Decide whether the business-type registry IS Template pulled forward from Phase 6 or a
      distinct object, and say which — two names for one concept is how a fork starts. If it is
      built, constrain it to data: it may NAME Apps and CARRY labels, and it may never contain
      logic. Whether it also carries a role vocabulary is permission-catalog.yaml AZ11, not this
      entry. Tenant-independent either way, and it touches no Organization's rows, which is why
      it is the one platform-operator capability buildable without AZ3.
    blocks: "Nothing today. It is the first capability requested of a platform operator, and CO4 blocks that."
  - id: CO6
    question: >-
      A RELATIONSHIP BETWEEN TWO RECORDS IS NOT A ROLE AND HAS NO OBJECT HERE. The case is a
      parent and a student: the parent needs full authority over ONE student's records and none
      over any other's. That is not a tier — a parent is not a weaker teacher — and it is not
      expressible by anything in this registry. `Role` and `RoleAssignment` grant a permission at
      a SCOPE; they cannot say "these records, because of who this person is to that person."
      AND `own` SCOPE IS NOT THE ANSWER, WHICH IS THE PART MOST LIKELY TO BE GOT WRONG.
      AUTHORIZATION_STANDARD.md VAL-OWN resolves `own` through an `ownershipField` ON THE TARGET
      ENTITY ITSELF, whose value is the acting principal. A student's record carries the
      STUDENT's identifier; the parent is a different principal, one hop away, and clause 4
      states that an ownershipField on any other entity "contributes nothing, at all, ever."
      Making `own` traverse a link would reopen precisely the substitution gap VALIDATOR-AZ7 was
      written to close (CWE-863).
    recommendation: >-
      Model it as an explicit delegation edge — a first-class object binding one principal to
      another (or to a record) with a bounded permission set — rather than as a scope value or a
      role. TWO CONSTRAINTS ARE ALREADY BINDING ON WHATEVER IS BUILT: the edge is TENANT DATA and
      belongs in the tenant database behind the storage boundary, never in the control plane,
      because a platform-wide map of who is related to whom is the same class of target as the
      user directory `control-plane/0001_principal.sql` refused; and docs/decisions/0007 D11
      applies unchanged, so a delegation can never carry more than the delegating principal holds.
      Needs its own decision record. Do not approximate it with a role in the meantime — an
      approximation here grants a parent access to every student.
    blocks: "Any business type whose participants include non-staff related to one another — the school case."
  - id: CO7
    question: >-
      NOTHING CAN CREATE AN ORGANIZATION, AND ONBOARDING HAS NO AUDITABLE HOME. There is no
      CreateOrganization and no CreateBusiness anywhere in Core, the Apps or the contracts. Every
      Organization on the live system exists because an operator ran SQL by hand. So the honest
      answer to "how does a new customer start using Dudo" is that a human edits the database.
      ONBOARDING IS SIX OBJECTS, NOT ONE: organization, principal, principal_credential,
      organization_membership, tenant_directory, and at least one inner unit in the TENANT
      database. Five of the six are control-plane writes and the sixth is not, so the operation
      spans two databases and CANNOT BE ATOMIC — the batching device that makes a mutation and
      its audit row one unit does not cross a database boundary.
      THE AUDIT PROBLEM IS THE HARD PART AND IT IS CIRCULAR AS RECORDED. `identity/
      control-plane-admission.ts` states it: the audit record cannot go into the new
      Organization's tenant audit log, because reaching that log needs a tenant store handle,
      which needs the tenant_directory entry the same operation is still creating. Ordering the
      directory write first breaks the circle, but leaves a window in which an Organization
      exists with no record of who created it — and `0007` rule 9 requires privilege changes to
      be audited, while security.md §6 names tenant membership changes specifically.
      AND THERE IS A SECOND, DEEPER GAP: an operator action spans tenants by nature, so a purely
      tenant-side trail gives the PLATFORM no record of what its own operators did. `control-plane/
      0003_organization_membership.sql` deliberately refused an append-only log spanning every
      tenant in the control plane, and that refusal was about tenant BUSINESS events. Whether a
      platform-OPERATOR action log is the same object or a different one is undecided.
    recommendation: >-
      Order the writes so the tenant directory exists before the audit write, and write the
      operator's audit record to BOTH homes: the affected Organization's tenant log, so the
      customer can see who acted on their account, and a platform-operator action log in the
      control plane holding only operator actions — actor, action, target Organization,
      timestamp, correlation id, and NO tenant business data of any kind. That constraint is
      what distinguishes it from the log 0003 refused. Decide the partial-failure behaviour
      explicitly and fail closed: an onboarding whose audit write fails is reported failed, not
      completed quietly.
      CORRECT THE COST WHILE RECORDING IT — see costCorrection2026-09-05 below.
    blocks: "Self-service and operator-driven customer acquisition. It is the capability that decides whether Dudo can take a customer at all."
  costCorrection2026-09-05: >-
    ONBOARDING IS NOT 6 ROW-WRITES. `identity/control-plane-admission.ts` records "onboarding is
    6", counting organization 2 + tenant_directory 2 + organization_membership 2. THAT FIGURE
    ASSUMES THE ADMIN PRINCIPAL AND THEIR CREDENTIAL ALREADY EXIST, which is exactly what is NOT
    true when a new customer arrives. A first-time onboarding is organization 2 + principal 2 +
    principal_credential 2 + organization_membership 2 + tenant_directory 2 = 10 control-plane
    row-writes, plus the first inner unit (2) and the audit record (5) in the TENANT database,
    drawn from a different allocation.
    IT IS STILL COMFORTABLY AFFORDABLE and the correction is not an objection: 10 against the
    3,000/day control-plane sub-ceiling is 300 onboardings a day platform-wide, and against the
    600/day per-principal ceiling it is 60 per operator per day. The correction is recorded
    because docs/decisions/0021 records what happens when a number that depends on an unsettled
    design is published as though it were arithmetic — this one was published as 6 and is 10, and
    the difference is precisely the two objects nobody was counting.
