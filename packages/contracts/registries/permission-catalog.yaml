---
# Dudo Permission Catalog
#
# Every permission in Dudo. A permission string that does not appear here does not exist:
# code referencing one fails validation. An undeclared permission is a typo waiting to
# become an authorization bypass — or, worse, an authorization failure that someone
# "fixes" by removing the check.
#
# Governed by: docs/architecture/standards/AUTHORIZATION_STANDARD.md
# Owner:       architecture-agent authors; Team Lead accepts.
#
# STATUS OF THIS FILE
# "No code exists" was true when this was written and is NO LONGER TRUE: as of 2026-09-05
# `core.business.read` and the seven granted `customers.*` permissions are enforced by running
# code, and `authorization/roles.ts` grants them. The `status: proposed` values below have not
# been re-verified entry by entry and must not be read as current build state.
# Every entry is status "proposed". Most are the permissions entailed by
# Core's declared responsibilities (CORE_BOUNDARIES.md §3) and the App lifecycle
# (APP_STANDARD.md §9), so that Phase 1 and Phase 2 build against a reviewed set rather
# than accreting one.
#
# THE CATALOG IS NOT A CORE-ONLY FILE. As of 2026-09-02 it also holds the nine
# 'customers.*' permissions of the Customer Directory App. That is what "a permission
# string that does not appear here does not exist" requires: an App's permissions are
# registered centrally and enforced by Core, while the App's LOGIC stays outside Core.
# Registering a permission here does not accept the contract that requests it, does not
# grant it to anyone, and does not make its Action reachable on its own.
#
# AUTHORIZATION_STANDARD.md §1-§10 constitutes the "logical permission model" that
# docs/decisions/0001 requires as its own decision record BEFORE implementation. THAT RECORD
# NOW EXISTS: docs/decisions/0007, Accepted by the user 2026-09-01 subject to ten binding
# rules. This paragraph previously ended "That record does not exist yet. Nothing implements
# against this catalog until it does", and 0007 §5 consequence 5 required it to stop saying so.
# Implementation may proceed against this catalog, under 0007's ten rules — of which rule 3
# (no wildcards anywhere) and rule 4 (unregistered means non-existent) govern this file most
# directly.

catalogVersion: 1
updated: "2026-09-05"

# ---------------------------------------------------------------------------
# model
# ---------------------------------------------------------------------------
model:
  formula: "Principal + Role + Permission + Scope = Access"
  default: deny
  rules:
    - "Default = Deny. Not 'deny after the checks fail' — deny unless a check explicitly passed."
    - >-
      A ROUTE WITH NO DECLARED PERMISSION IS UNREACHABLE, NOT OPEN — UNLESS it is registered in
      one of TWO closed, Core-owned, enumerated sets, NEITHER OF WHICH IS MANIFEST-DECLARABLE:
        docs/decisions/0014 §B's `PreAuthEntryPoint` registry — FIVE routes: login start, login
          completion, session refresh, logout, and a health endpoint carrying no tenant or user
          data. `0014` §B AMENDS `0007` D1 rather than contradicting it, and a route enters that
          registry by a decision, never by declaring itself.
        docs/decisions/0021's session class, which resolves a session and STOPS — no tenant, no
          permission, and `0021` states that "widening it is a decision, not a refactor".
      *** docs/decisions/0025's PLATFORM CLASS IS NOT AN EXCEPTION AND MUST NOT BE LISTED AS
      ONE. *** EVERY route in that class declares a permission — stated as a property rather
      than as a count, because THIS SENTENCE SAID "ALL FOURTEEN" AND THE CLASS IS FIFTEEN.
      `platform.organizations.identity.update` landed 2026-09-07 and the figure rotted the same
      day; the CLAIM stayed true, which is exactly why nobody noticed. Measured 2026-09-08 by
      counting `id:` entries in `platform-routes.ts`'s frozen ROUTES array: fifteen.
      THE PROPERTY DOES NOT ROT AND IT IS ALREADY ENFORCED, WHICH IS WHY THE NUMBER WAS NEVER
      LOAD-BEARING: `platform-routes.ts::assertEveryRoutePermissionIsReachable` fails the build
      if a route declares a permission no role can reach, and `PlatformRoute.permission` is a
      REQUIRED field, so a route with no declared permission does not typecheck.
      NAMING WHICH SIDE THAT IS TRUE OF, because a dismissal that does not is how these survive
      review (.claude/rules/architecture.md §3b): it is true of DECLARATION. The `from-body`
      variant can still RESOLVE to no permission at request time — `platform.confirmations.request`
      does exactly that for an unknown `action_id` — and the dispatcher then refuses with
      `invalid_argument` rather than falling back to a permission of its own. Declaration is what
      this rule is about; resolution is refused separately.
      A COUNT HERE ADDS NOTHING THAT A REQUIRED FIELD AND A BUILD FAILURE DO NOT ALREADY SAY. What distinguishes that class is that it evaluates a permission WITHOUT A
      TENANT, which is an exception to tenant scoping and not to this rule. A PERMISSIONLESS
      PLATFORM ROUTE IS NOT LEGITIMATE AND CORE REFUSES TO BUILD ONE.
      *** THIS ENTRY PREVIOUSLY READ: "An entry point with no declared permission is
      unreachable, not open." *** True of the Action pipeline and false of two request classes
      that exist because decisions put them there. IT IS A WORSE DEFECT THAN THE WITHDRAWN
      WILDCARD RULE ABOVE, AND IN THE OPPOSITE DIRECTION: THE WILDCARD ENTRY PERMITTED SOMETHING
      FORBIDDEN; THIS ONE FORBADE SOMETHING REQUIRED. A validator author following it literally
      would build something that refuses the login route.
    - "Authorization is decided in Core, at every entry point, on every call."
    - "No caller is trusted to have already checked — not a client, not an App, not another service."
    - "UI hiding is presentation, never security."
    - "No decision is cached beyond its scope. A cached yes that outlives a revoked role cannot be revoked."
    - "Permissions are additive. There are no negative permissions and no deny rules."
    - >-
      NO WILDCARD PERMISSION ANYWHERE. Not in a role, not in an App manifest, not in a grant.
      docs/decisions/0007 binding rule 3, Accepted by the user 2026-09-01.
      *** THIS ENTRY PREVIOUSLY READ: "Wildcards may appear in ROLE definitions. Never in an App
      manifest." IT IS WITHDRAWN, AND IT IS KEPT VISIBLE RATHER THAN DELETED BECAUSE THE REASON
      IT EXISTED IS STILL WORTH KNOWING. *** It was written when `0007` D6 left wildcard
      EXPANSION SEMANTICS undecided, and it was an attempt to bound where an undecided thing
      could appear. `0007`'s acceptance closed the question by removing the construct instead of
      defining it: there are no expansion semantics because there is nothing left to expand.
      WHY IT IS STRUCK HERE AND NOT ONLY IN THE PROSE ABOVE `defaultRoles`. That correction sits
      hundreds of lines below this one — no count, because a line number in a comment rots for
      the same reason the withdrawn rule did — and A READER WHO FINDS THIS RULE HAS ALREADY GOT
      WHAT THEY CAME FOR: they will not read on to discover it was withdrawn. `model.rules` is the
      MACHINE-READABLE half, nothing in this repository executes it, and the reader most likely
      to act on it literally is whoever eventually writes the validator, who will be reading
      this list PRECISELY BECAUSE it is the machine-readable form. Prose describes; a rule
      instructs (.claude/rules/workflow.md §12).
      `authorization/roles.ts::assertRoleMappingIsCoherent` enforces the prohibition in code, at
      module load, and names this file as where a wildcard would otherwise be smuggled back in.
    - >-
      An App manifest may never request a permission at 'platform' scope. 'platform' is
      reserved to platform principals; a manifest declaring it must FAIL VALIDATION and the App
      must not install — not accepted-then-trimmed, because an App installed in a state where it
      will fail unpredictably at runtime is worse than one that did not install.
      *** WHAT ENFORCES THIS TODAY: NOTHING. IT IS A REVIEW OBLIGATION. *** Corrected 2026-09-06;
      this entry previously ended "Enforced structurally by app-manifest.schema.json
      ($defs/appRequestableScope), not by review", and that sentence was false in the way the
      whole corpus keeps being false.
      NAMING WHICH SIDE IT IS FALSE ABOUT, because a dismissal that does not is how this
      survives review (.claude/rules/architecture.md §3b). THE SCHEMA EXPRESSES THE CONSTRAINT
      CORRECTLY — `$defs/appRequestableScope` is `$defs/scope` minus `platform`, and
      `permissions[].scope` `$ref`s it. NOTHING EXECUTES IT. `packages/contracts/README.md`:
      "Nothing in this directory is executed. There is no JSON Schema implementation in this
      repository ... every schema here is normative and hand-checked, never machine-validated."
      `0009` approved ONE zero-dependency validator, for the AZ7 relation family only, and it
      does not look at scopes. AND THERE IS NO MANIFEST-ADMISSION PATH AT ALL: no SDK, no App
      runtime, nothing that parses a manifest. `apps/customers` is compiled in rather than
      installed, and `authorization/authorizer.ts` enforces the declared-scope CEILING at call
      time against an `AppPermissionEnvelope` A CORE AUTHOR TRANSCRIBED BY HAND.
      SO THE REVIEW OBLIGATION IS CONCRETE AND HAS AN OWNER: whoever writes an
      `AppPermissionEnvelope` is the last check that no App reaches 'platform' scope, because
      the constraint that would have refused the manifest never runs.
      WHY THE OVERSTATEMENT WAS WORSE THAN THE GAP: it told the next reader the hazard was
      handled, which stops the person who would otherwise build the thing that closes it. What
      would make the original sentence true is a manifest-admission path that executes this
      schema — `AS1`/`TS1` and the App permission and trust ADR, neither of which exists.
    - >-
      An Action declaring scope 'own' on an entity that declares no ownershipField FAILS
      VALIDATION (rule VAL-OWN, AUTHORIZATION_STANDARD.md §4). It is never accepted and
      then evaluated as unrestricted — 'own' without an ownership relation grants
      everything while presenting as the narrowest scope in the system.
    - >-
      An Action declaring scope 'own' MUST name its targetEntity, that entity must be
      declared in the same manifest, and that entity must itself declare a valid
      ownershipField. An ownershipField on an unrelated entity satisfies nothing. Missing,
      unknown, malformed or ambiguous targetEntity fails closed (VAL-OWN clauses 2 and 3,
      AUTHORIZATION_STANDARD.md §4 and §4.1). The schema enforces clauses 1 and 2; clause
      3 is a cross-array comparison JSON Schema cannot express and is owed by the
      registry-aware validator as VALIDATOR-AZ7. That validator exists and has been
      executed against the recorded fixtures:
      packages/contracts/validation/app-manifest-relations.mjs, approved by ADR 0009. JSON
      Schema execution and integration into a production manifest-admission path have not
      yet been implemented — no JSON Schema implementation is present in this repository,
      and nothing invokes the relation validator automatically. See the AZ7 entry under
      openQuestions for the measured result and its scope.
    - >-
      Ownership is declared in the manifest, never asserted at invocation. A client, an
      App, an SDK caller or an AI principal cannot supply a targetEntity, an ownership
      field or an owner identifier with a call to decide what 'own' means for that call.
    - "list is a separate permission from read. Enumeration is its own disclosure."
    - "export is always separate from read. Reading one record and downloading the book are different risks."

naming:
  format: "<namespace>.<resource>.<action>"
  namePattern: "^(core|[a-z][a-z0-9-]{1,62}[a-z0-9])\\.[a-z][a-z0-9-]*\\.[a-z][a-z0-9-]*$"
  rules:
    - "namespace is 'core' or an App id."
    - "resource is singular, kebab-case."
    - "action is a verb: read, list, create, update, delete, export, approve, assign, revoke."

principalTypes:
  - id: user
    description: "A person with a session."
  - id: team
    description: "First-class. Permissions may be held by a team; membership grants them."
  - id: service-account
    description: "Machine identity for integrations. Never a shared human account."
  - id: ai-agent
    description: >-
      An AI acting on behalf of a user or organization. A principal, not an exception. Its
      effective permission is the INTERSECTION of its own grants and the acting user's —
      never the union.
  - id: iot-device
    description: "Narrow, usually single-purpose, usually branch-scoped."

scopes:
  - id: platform
    grants: "Everything. Platform operators only. Rare and always audited."
    note: >-
      The only scope that spans organizations. It never grants access to tenant BUSINESS
      data without an explicit, audited, time-bounded elevation. See openQuestions AZ3.
      THAT ELEVATION MECHANISM DOES NOT EXIST YET (AZ3 is unresolved), so until it is
      recorded and built, NO platform-scope role has a path to tenant business data at
      all: only two permissions are declared at 'platform' scope —
      core.principal.grant-platform-scope and core.marketplace.moderate — and neither
      platform-scope seed role holds anything outside that pair. This is deliberate and
      fail-closed; a control that exists only as an English sentence is not a control.
      marketplace-moderator previously carried core.app.read (declared scopes:
      [organization, business]) and it has been REMOVED: a platform-scope role holding a
      tenant-scoped permission is a cross-tenant read under the union reading and an
      invalid role definition under the intersection reading drafted as 0007 D6. The
      platform-scope view of published Apps that moderation actually needs is
      openQuestions AZ8 and is deliberately not declared here.
  - id: organization
    grants: "One Organization and everything beneath it. The tenant boundary."
  - id: business
    grants: "One Business/Workspace."
  - id: branch
    grants: "One Branch/Location."
  - id: team
    grants: "Resources belonging to one Team."
  - id: own
    grants: "Records the principal created or is assigned to."
    note: "Requires a defined ownership relation on the entity. Without one, 'own' grants everything."
  - id: resource
    grants: "One named resource."

sensitivityClasses:
  - id: read
    requires: [permission]
  - id: write
    requires: [permission]
  - id: sensitive
    requires: [permission, audit]
    examples: "Export data, change permissions, change membership, view payroll, send on the tenant's behalf."
  - id: critical
    requires: [permission, audit, confirmation]
    examples: "Move money, delete data irreversibly, rotate credentials, grant platform scope."

elevation:
  mechanisms: [user-confirmation, approval-workflow, mfa, step-up]
  rules:
    - "Elevation is per operation, never per session."
    - "A confirmation is single-use, short-lived, and states exactly what will happen."
    - "For AI principals, confirmation is collected by the platform from the human. A model asserting the user agreed is not a confirmation."

# ---------------------------------------------------------------------------
# permissions
# ---------------------------------------------------------------------------
permissions:

  # --- identity ---------------------------------------------------------------
  - id: core.user.read
    group: identity
    description: "View a user profile within the tenant."
    sensitivity: read
    scopes: [organization, business, branch, team, own]
    status: proposed
    phase: 1
  - id: core.user.list
    group: identity
    description: "Enumerate users. Separate from read because the list itself is information."
    sensitivity: read
    scopes: [organization, business, branch, team]
    status: proposed
    phase: 1
  - id: core.user.invite
    group: identity
    description: "Invite a person into the tenant."
    sensitivity: sensitive
    scopes: [organization, business, branch]
    status: proposed
    phase: 1
  - id: core.user.update
    group: identity
    description: "Modify a user profile."
    sensitivity: write
    scopes: [organization, business, own]
    status: proposed
    phase: 1
  - id: core.user.deactivate
    group: identity
    description: "Withdraw a user's access to the tenant."
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: core.session.list
    group: identity
    description: "View active sessions for a principal."
    sensitivity: sensitive
    scopes: [organization, own]
    status: proposed
    phase: 1
  - id: core.session.revoke
    group: identity
    description: "End a session. Takes effect immediately."
    sensitivity: sensitive
    scopes: [organization, own]
    status: proposed
    phase: 1

  # --- organization structure -------------------------------------------------
  - id: core.organization.read
    group: organization
    description: "View the Organization record."
    sensitivity: read
    scopes: [organization]
    status: proposed
    phase: 1
  - id: core.organization.update
    group: organization
    description: "Modify Organization settings."
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1
  - id: core.organization.delete
    group: organization
    description: "Delete the Organization and everything in it."
    sensitivity: critical
    scopes: [organization]
    status: proposed
    phase: 1
  - id: core.business.read
    group: organization
    description: "View a Business/Workspace."
    sensitivity: read
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: core.business.create
    group: organization
    description: "Create a Business/Workspace inside the Organization."
    sensitivity: write
    scopes: [organization]
    status: proposed
    phase: 1
  - id: core.business.update
    group: organization
    description: "Modify a Business/Workspace."
    sensitivity: write
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: core.branch.read
    group: organization
    description: "View a Branch/Location."
    sensitivity: read
    scopes: [organization, business, branch]
    status: proposed
    phase: 1
  - id: core.branch.create
    group: organization
    description: "Create a Branch/Location."
    sensitivity: write
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: core.branch.update
    group: organization
    description: "Modify a Branch/Location."
    sensitivity: write
    scopes: [organization, business, branch]
    status: proposed
    phase: 1

  # --- teams ------------------------------------------------------------------
  - id: core.team.read
    group: team
    description: "View a Team."
    sensitivity: read
    scopes: [organization, business, branch, team]
    status: proposed
    phase: 1
  - id: core.team.create
    group: team
    description: "Create a Team."
    sensitivity: write
    scopes: [organization, business, branch]
    status: proposed
    phase: 1
  - id: core.team.update
    group: team
    description: "Modify a Team."
    sensitivity: write
    scopes: [organization, business, branch, team]
    status: proposed
    phase: 1
