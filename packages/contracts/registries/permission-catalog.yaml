---
# Dudo Permission Catalog
#
# Every permission in Dudo. A permission string that does not appear here does not exist:
# code referencing one fails validation. An undeclared permission is a typo waiting to
# become an authorization bypass — or, worse, an authorization failure that someone
# "fixes" by removing the check.
#
# Governed by: docs/architecture/standards/AUTHORIZATION_STANDARD.md
# Owner:       architecture-agent authors; Team Lead accepts.
#
# STATUS OF THIS FILE
# "No code exists" was true when this was written and is NO LONGER TRUE: as of 2026-09-05
# `core.business.read` and the seven granted `customers.*` permissions are enforced by running
# code, and `authorization/roles.ts` grants them. The `status: proposed` values below have not
# been re-verified entry by entry and must not be read as current build state.
# Every entry is status "proposed". Most are the permissions entailed by
# Core's declared responsibilities (CORE_BOUNDARIES.md §3) and the App lifecycle
# (APP_STANDARD.md §9), so that Phase 1 and Phase 2 build against a reviewed set rather
# than accreting one.
#
# THE CATALOG IS NOT A CORE-ONLY FILE. As of 2026-09-02 it also holds the nine
# 'customers.*' permissions of the Customer Directory App. That is what "a permission
# string that does not appear here does not exist" requires: an App's permissions are
# registered centrally and enforced by Core, while the App's LOGIC stays outside Core.
# Registering a permission here does not accept the contract that requests it, does not
# grant it to anyone, and does not make its Action reachable on its own.
#
# AUTHORIZATION_STANDARD.md §1-§10 constitutes the "logical permission model" that
# docs/decisions/0001 requires as its own decision record BEFORE implementation. THAT RECORD
# NOW EXISTS: docs/decisions/0007, Accepted by the user 2026-09-01 subject to ten binding
# rules. This paragraph previously ended "That record does not exist yet. Nothing implements
# against this catalog until it does", and 0007 §5 consequence 5 required it to stop saying so.
# Implementation may proceed against this catalog, under 0007's ten rules — of which rule 3
# (no wildcards anywhere) and rule 4 (unregistered means non-existent) govern this file most
# directly.

catalogVersion: 1
updated: "2026-09-05"

# ---------------------------------------------------------------------------
# model
# ---------------------------------------------------------------------------
model:
  formula: "Principal + Role + Permission + Scope = Access"
  default: deny
  rules:
    - "Default = Deny. Not 'deny after the checks fail' — deny unless a check explicitly passed."
    - "An entry point with no declared permission is unreachable, not open."
    - "Authorization is decided in Core, at every entry point, on every call."
    - "No caller is trusted to have already checked — not a client, not an App, not another service."
    - "UI hiding is presentation, never security."
    - "No decision is cached beyond its scope. A cached yes that outlives a revoked role cannot be revoked."
    - "Permissions are additive. There are no negative permissions and no deny rules."
    - "Wildcards may appear in ROLE definitions. Never in an App manifest."
    - >-
      An App manifest may never request a permission at 'platform' scope. 'platform' is
      reserved to platform principals; a manifest declaring it FAILS VALIDATION and the App
      does not install. Enforced structurally by app-manifest.schema.json
      ($defs/appRequestableScope), not by review.
    - >-
      An Action declaring scope 'own' on an entity that declares no ownershipField FAILS
      VALIDATION (rule VAL-OWN, AUTHORIZATION_STANDARD.md §4). It is never accepted and
      then evaluated as unrestricted — 'own' without an ownership relation grants
      everything while presenting as the narrowest scope in the system.
    - >-
      An Action declaring scope 'own' MUST name its targetEntity, that entity must be
      declared in the same manifest, and that entity must itself declare a valid
      ownershipField. An ownershipField on an unrelated entity satisfies nothing. Missing,
      unknown, malformed or ambiguous targetEntity fails closed (VAL-OWN clauses 2 and 3,
      AUTHORIZATION_STANDARD.md §4 and §4.1). The schema enforces clauses 1 and 2; clause
      3 is a cross-array comparison JSON Schema cannot express and is owed by the
      registry-aware validator as VALIDATOR-AZ7. That validator exists and has been
      executed against the recorded fixtures:
      packages/contracts/validation/app-manifest-relations.mjs, approved by ADR 0009. JSON
      Schema execution and integration into a production manifest-admission path have not
      yet been implemented — no JSON Schema implementation is present in this repository,
      and nothing invokes the relation validator automatically. See the AZ7 entry under
      openQuestions for the measured result and its scope.
    - >-
      Ownership is declared in the manifest, never asserted at invocation. A client, an
      App, an SDK caller or an AI principal cannot supply a targetEntity, an ownership
      field or an owner identifier with a call to decide what 'own' means for that call.
    - "list is a separate permission from read. Enumeration is its own disclosure."
    - "export is always separate from read. Reading one record and downloading the book are different risks."

naming:
  format: "<namespace>.<resource>.<action>"
  namePattern: "^(core|[a-z][a-z0-9-]{1,62}[a-z0-9])\\.[a-z][a-z0-9-]*\\.[a-z][a-z0-9-]*$"
  rules:
    - "namespace is 'core' or an App id."
    - "resource is singular, kebab-case."
    - "action is a verb: read, list, create, update, delete, export, approve, assign, revoke."

principalTypes:
  - id: user
    description: "A person with a session."
  - id: team
    description: "First-class. Permissions may be held by a team; membership grants them."
  - id: service-account
    description: "Machine identity for integrations. Never a shared human account."
  - id: ai-agent
    description: >-
      An AI acting on behalf of a user or organization. A principal, not an exception. Its
      effective permission is the INTERSECTION of its own grants and the acting user's —
      never the union.
  - id: iot-device
    description: "Narrow, usually single-purpose, usually branch-scoped."

scopes:
  - id: platform
    grants: "Everything. Platform operators only. Rare and always audited."
    note: >-
      The only scope that spans organizations. It never grants access to tenant BUSINESS
      data without an explicit, audited, time-bounded elevation. See openQuestions AZ3.
      THAT ELEVATION MECHANISM DOES NOT EXIST YET (AZ3 is unresolved), so until it is
      recorded and built, NO platform-scope role has a path to tenant business data at
      all: only two permissions are declared at 'platform' scope —
      core.principal.grant-platform-scope and core.marketplace.moderate — and neither
      platform-scope seed role holds anything outside that pair. This is deliberate and
      fail-closed; a control that exists only as an English sentence is not a control.
      marketplace-moderator previously carried core.app.read (declared scopes:
      [organization, business]) and it has been REMOVED: a platform-scope role holding a
      tenant-scoped permission is a cross-tenant read under the union reading and an
      invalid role definition under the intersection reading drafted as 0007 D6. The
      platform-scope view of published Apps that moderation actually needs is
      openQuestions AZ8 and is deliberately not declared here.
  - id: organization
    grants: "One Organization and everything beneath it. The tenant boundary."
  - id: business
    grants: "One Business/Workspace."
  - id: branch
    grants: "One Branch/Location."
  - id: team
    grants: "Resources belonging to one Team."
  - id: own
    grants: "Records the principal created or is assigned to."
    note: "Requires a defined ownership relation on the entity. Without one, 'own' grants everything."
  - id: resource
    grants: "One named resource."

sensitivityClasses:
  - id: read
    requires: [permission]
  - id: write
    requires: [permission]
  - id: sensitive
    requires: [permission, audit]
    examples: "Export data, change permissions, change membership, view payroll, send on the tenant's behalf."
  - id: critical
    requires: [permission, audit, confirmation]
    examples: "Move money, delete data irreversibly, rotate credentials, grant platform scope."

elevation:
  mechanisms: [user-confirmation, approval-workflow, mfa, step-up]
  rules:
    - "Elevation is per operation, never per session."
    - "A confirmation is single-use, short-lived, and states exactly what will happen."
    - "For AI principals, confirmation is collected by the platform from the human. A model asserting the user agreed is not a confirmation."

