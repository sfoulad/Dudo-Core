  # different object from a tenant's INSTALLED Apps; the platform-scope permission for
  # that does not exist and is openQuestions AZ8. Do not repair this by widening
  # core.app.read's scopes to include 'platform' — that pushes a tenant-scope permission
  # above the tenant boundary.
  - id: marketplace-moderator
    scope: platform
    status: proposed
    description: "Reviews marketplace submissions. Holds no tenant-scoped permission, so it currently has no view of Apps at all — see openQuestions AZ8."
    permissions: [core.marketplace.moderate]
  - id: developer
    scope: organization
    status: proposed
    description: "Builds and submits extensions."
    permissions: [core.developer.register, core.marketplace.submit, core.app.read]
  # ===========================================================================================
  # THE PROPERTY, AND IT REPLACED THREE COUNTS ON 2026-09-08
  # ===========================================================================================
  #
  # *** EVERY PERMISSION BELOW DECLARES 'organization' AMONG ITS OWN 'scopes'. ***
  # That is the whole of what this role promises, it is the only half that is a SAFETY property,
  # and it does not rot.
  #
  # WHAT WAS HERE BEFORE, AND WHY IT IS INSTRUCTIVE RATHER THAN EMBARRASSING. This comment read
  # "59 of the 62 CORE permissions", listed "the three core permissions omitted", and closed
  # "Total for this role: 68 of the 71 catalogued permissions". MEASURED 2026-09-08: there are
  # 71 core and 9 customers = 80 catalogued, this role holds 68, and it omits TWELVE core
  # permissions, not three. ALL THREE FIGURES ROTTED AND THE ROLE NEVER CHANGED — 0025 through
  # 0031 added platform-scope permissions above, and every one of them widened the gap between
  # "core permissions that exist" and "core permissions this role may hold".
  #
  # *** THE PART WORTH KEEPING: THE FIX WAS ALREADY APPLIED ONE BLOCK UP AND WAS NOT PROPAGATED
  # HERE. *** The defaultRoles preamble above replaced a count with a property and said so in
  # terms — "A COUNT IN A COMMENT IS AN ASSERTION THAT ROTS EVERY TIME A DECISION ADDS AN ENTRY,
  # AND NOTHING GOES RED WHEN IT DOES". The identical construct twenty lines below it was left
  # alone. .claude/rules/workflow.md §12: BUDGET FOR MORE HOMES THAN YOU FIND — a claim worth
  # stating once is a claim somebody restated, and the instance you did not fix is the one the
  # next reader finds.
  #
  # THE TWELVE OMITTED, ENUMERATED RATHER THAN COUNTED, because a category absorbs the entry
  # that does not belong to it:
  #   ELEVEN declared scopes: [platform] — a tenant role must never reach platform scope, and
  #   this is the CRITICAL escalation the preamble's invariant exists to forbid:
  #     core.principal.grant-platform-scope   core.marketplace.moderate
  #     core.organization.create              core.organization.list
  #     core.platform-organization.update     core.template.read
  #     core.template.list                    core.template.create
  #     core.principal.revoke-platform-scope  core.platform-audit.read
  #     core.credential.reset
  #   ONE declared scopes: [own] — core.notification.read. Held at 'own', not at 'organization'.
  #   Reading one's own notifications is not an organization-scope power; see openQuestions AZ5.
  #
  # *** THE TWO DIRECTIONS ARE NOT THE SAME CLAIM, AND CONFLATING THEM IS WHAT THE COUNT DID. ***
  # A count asserts both at once and can be satisfied by neither being checked.
  #   SAFETY (this role over-grants nothing):    every permission listed here declares
  #     'organization' among its own scopes. A SAFETY INVARIANT. It fails loudly the day someone
  #     adds a platform-scoped permission to this list, and qa-agent can assert it today.
  #   COMPLETENESS (this role holds everything eligible): every organization-scoped permission
  #     appears here. THIS IS A PRODUCT POLICY, NOT AN INVARIANT, and it must NOT be turned into
  #     a check without a decision — doing so would AUTO-GRANT every future organization-scoped
  #     permission to the most privileged tenant role, which is a grant nobody made. It happens
  #     to hold today; see the note below on why that is an observation.
  #
  # OWED AS A MECHANICAL CHECK — qa-agent, registry-coherence.ts, THE SAFETY DIRECTION ONLY:
  #   For every permission named in this role, assert it resolves in `permissions` and declares
  #   'organization' among its own scopes. REPORT THE POPULATION EXAMINED and fail when it is
  #   zero. THE KNOWN-FAILING INPUT IT MUST SHIP WITH: a fixture business-owner holding one
  #   platform-scoped permission — core.template.list will do — which must turn it RED. A check
  #   handed only passing input has been observed, not verified (workflow.md §11a).
  #
  # PLUS ALL NINE customers.* PERMISSIONS, added on 2026-09-02 on the Team Lead's accepted
  # seed-role ruling. Every one of the nine declares 'organization' among its own scopes, so
  # the intersection rule admits all nine at this role's scope — including
  # customers.customer.delete, which is CRITICAL. This is the deliberate outcome: the
  # Organization's owner is the party that owns the customer data and answers for it, and
  # somebody must be able to authorize an erasure request. Holding the permission is still
  # not sufficient to invoke the Action — the confirmation mechanism §7 requires for a
  # critical Action does not exist, so DeleteCustomer remains unreachable.
  #
  # *** THE STATEMENT ABOVE IS NOW MORE PRECISE THAN IT WAS, AND THE CORRECTION MATTERS. ***
  # The Action-side gate DOES exist: `action/pipeline.ts` branches on
  # `requiresConfirmation(action.permission)` and its `confirmations?` dependency is fail-closed
  # — "ABSENT MEANS EVERY `critical` OPERATION IS REFUSED". What does not exist is the
  # ACTION-CLASS CHALLENGE ROUTE, so no tenant caller can OBTAIN a confirmation to present.
  # `confirmation-v1` §whereItLIVES.theTWOCHALLENGEROUTES requires TWO — "one Action, one
  # platform route" — and only the platform one is registered. DeleteCustomer is unreachable
  # because the key cannot be minted, not because the lock is missing.
  #
  # THIS COMMENT ENDED "Total for this role: 68 of the 71 catalogued permissions" AND THE FIGURE
  # ROTTED: 80 are catalogued, and 68 is still the size of the list below. Deleted rather than
  # corrected — the list IS the source, and a total restated beside it is a second copy that can
  # disagree with the first. See the property block above this role for the check that is owed.
  - id: business-owner
    scope: organization
    status: proposed
    description: "Owns the tenant. The most privileged tenant role — and strictly a TENANT role: it holds no platform-scope permission."
