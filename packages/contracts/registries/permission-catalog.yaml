  #
  # Contract:  packages/contracts/apps/customers/customer-directory-v1.contract.yaml
  #            (status: proposed — registration here does not accept that contract)
  #
  # THE SCOPE SPLIT IS LOAD-BEARING AND IS NOT A STYLE CHOICE. The first six are declared
  # [organization, business] because the Customer entity carries a required business_id, so
  # a business-scope grant has a real predicate to narrow against. The last three are
  # [organization] ONLY: a move spans TWO Businesses and a business-scope grant is authority
  # over ONE, so declaring move at business scope would let the holder of one side reach
  # across the boundary it is standing on. Permanent deletion and its reversal are
  # irreversible data governance over the Organization's own records.
  #
  # customers.customer.export is DELIBERATELY ABSENT and must stay absent. This slice has no
  # export Action; §3.2 keeps export separate from read, and the way to keep it separate is
  # not to declare it until an export Action exists. Adding it here would create a grantable
  # permission over a capability nothing implements.
  - id: customers.customer.create
    group: customer
    description: "Create a customer in a named Business of the Organization's directory."
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.read
    group: customer
    description: >-
      View one customer's full record, including its address and notes. Separate from list:
      the list projection deliberately omits both sensitive-personal free-text fields, so
      reading a whole record is a distinct disclosure.
    sensitivity: read
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.list
    group: customer
    description: >-
      Enumerate and search customers. Separate from read because enumeration is its own
      disclosure. Search SHARES this permission rather than having its own — search IS
      enumeration, and a separate customers.customer.search would let a role reach the same
      information through a second door.
    sensitivity: read
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.update
    group: customer
    description: >-
      Modify a customer's details. Cannot change status — archiving is its own permission —
      and cannot change business_id, which is customers.customer.move.
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.archive
    group: customer
    description: >-
      Withdraw a customer from active use. Data is retained INDEFINITELY; this is not a
      delete and it starts no countdown to one.
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.restore
    group: customer
    description: >-
      Return an archived customer to active use. Separate from archive: reinstating a record
      puts it back into every list and search the Organization can see, and a role that may
      tidy the directory is not automatically a role that may reinstate from it.
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.move
    group: customer
    description: >-
      Move a customer from one Business to another within the same Organization. Never at
      business scope: a move spans two Businesses and a business-scope grant is authority
      over one, so granting it there would let the holder of one side reach across the
      boundary it is standing on.
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1
  - id: customers.customer.delete
    group: customer
    description: >-
      Permanently delete a customer. Starts an explicit 30-day recovery window, after which
      the customer's personal data is purged and cannot be recovered. Reachable only from
      'archived'. CRITICAL, not sensitive: §6 classes irreversible data destruction as
      critical, which adds a mandatory explicit confirmation collected by the platform from
      the human — never a request field. That mechanism does not exist, so the Action this
      permission guards is unreachable even once granted, which is the correct fail-closed
      state for the one Action in this App that destroys tenant data.
    sensitivity: critical
    scopes: [organization]
    status: proposed
    phase: 1
  - id: customers.customer.restore-deleted
    group: customer
    description: >-
      Cancel a pending deletion within the 30-day window, returning the customer to
      'archived'. Separate from customers.customer.restore, which returns an ARCHIVED
      customer to active use: the authority to tidy a directory is not the authority to
      countermand a deletion an organization-level principal ordered.
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1

# ---------------------------------------------------------------------------
# defaultRoles — SEED DATA ONLY
#
# These ship as a starting point. They are data, never code: no role name may appear in a
# conditional in source. Customers create and modify their own roles freely.
#
# WILDCARDS: syntactically permitted in a role definition and nowhere else — but NO SEED
# ROLE USES ONE. What a wildcard expands to is not defined by any accepted decision: the
# rules above say only WHERE a wildcard may appear, never WHAT it expands to. The naive
# reading (expand to every matching permission regardless of the permission's own declared
# scopes) made 'business-owner' — a TENANT role — hold core.principal.grant-platform-scope,
# which is tenant-to-platform privilege escalation in the most commonly assigned role in
# the product. The seed roles below are therefore written as explicit lists that are safe
# under EVERY candidate expansion rule, and each list contains only permissions whose own
# declared 'scopes' include the role's 'scope'.
#
# The general expansion rule is a decision, not a schema detail, and IT IS NOW DECIDED —
# harder than D6 stated. docs/decisions/0007 was Accepted 2026-09-01 subject to ten binding
# rules, and RULE 3 PROHIBITS WILDCARD PERMISSIONS OUTRIGHT: "Not in roles, not in manifests,
# not in grants." So D6's intersection semantics govern nothing here, because there is nothing
# left to expand. The sentence above — "syntactically permitted in a role definition and
# nowhere else" — is superseded: a wildcard is permitted NOWHERE, and one must never be
# reintroduced here. `authorization/roles.ts::assertRoleMappingIsCoherent` enforces the same
# rule in code, at module load, and names this as the file where a wildcard would otherwise be
# smuggled back in.
# ---------------------------------------------------------------------------
defaultRoles:
  # ===========================================================================
  # THE PLATFORM ROLES, AND THE INVARIANT THAT SURVIVES THE SET GROWING
  # ===========================================================================
  #
  # THE INVARIANT: every permission held by a role whose own 'scope' is 'platform' declares
  # 'platform' among that permission's own 'scopes'. Equivalently — NO PLATFORM ROLE HOLDS A
  # TENANT-SCOPED PERMISSION. It follows that reaching tenant business data from a platform
  # role requires the AZ3 break-glass elevation, WHICH DOES NOT EXIST.
  #
  # IT IS STATED AS A PROPERTY RATHER THAN AS A COUNT, AND THAT IS A CORRECTION.
  # This comment previously read "those are the only two that are". THERE ARE ELEVEN. Eight
  # arrived with docs/decisions/0025 through 0028 and a ninth addition with 0031, and the
  # sentence was true when it was written — which is exactly the problem: A COUNT IN A COMMENT
  # IS AN ASSERTION THAT ROTS EVERY TIME A DECISION ADDS AN ENTRY, AND NOTHING GOES RED WHEN IT
  # DOES (.claude/rules/workflow.md §12). The property above does not rot. It stays true as the
  # set grows and it fails loudly the day it stops being true.
  #
  # THE COUNT MOVED WITHIN TWO DAYS OF BEING WRITTEN DOWN, WHICH IS THE ARGUMENT RATHER THAN AN
  # EMBARRASSMENT. `core.platform-organization.update` was added 2026-09-07 and the figure went
  # from ten to eleven; the PROPERTY above needed no edit at all.
  #
  # THE RECONCILIATION, because two counts disagreed and both were right about different
  # things: "count the string 'scopes: [platform]'" and "count the permission entries" will keep
  # giving different answers to whoever checks next, since the string also appears in prose
  # inside comments — this block among them. THE ENTRY COUNT IS THE NUMBER THAT MEANS ANYTHING.
  #
  # STATED IN docs/decisions/0033's FORM, because this figure has already moved once and will
  # move again. 0033 governs row-write costs; the device is general and this is the same failure
  # it was accepted for — a transcribed number in a file that cannot read its own source.
  #   shape:            the count of entries in `permissions` whose own `scopes` includes
  #                     `platform`. The entries are the source; this line is not.
  #   figureOn_2026-09-08: 11 — derived by enumerating those entries, not by counting a string.
  #   ifTheyDISAGREE:   THE ENTRIES ARE RIGHT AND THIS NOTE IS WRONG. Correct the note.
  #
  # WHAT WOULD MAKE THE NEXT DRIFT FAIL LOUDLY, since a figure nobody must move is a figure
  # nobody moves: nothing here can, and that is the honest answer — no YAML parser exists in this
  # repository, so this file cannot check itself. THE CHECK BELONGS WHERE A PARSER ALREADY RUNS.
  # `platform-permissions.ts` holds the same set twice over in TypeScript — PLATFORM_PERMISSION_
  # ENVELOPE (9) plus HELD_BUT_UNREACHABLE (2) — and 9 + 2 = 11 is an arithmetic identity a suite
  # CAN assert. qa-agent's registry-coherence.ts is where it goes, with the two guards this
  # repository has learned to demand: a floor that fails loudly when either list parses as empty,
  # and a known-failing input — a fixture with a twelfth platform permission in neither list,
  # which must go RED.
  #
  # *** THE READING THE OLD COMMENT INVITED WAS THE DANGEROUS PART, NOT THE ARITHMETIC. ***
  # "Only two" leaves a reader concluding the operator surface is tiny. It is not, and two of
  # them are severe on their own terms: core.credential.reset, which its own entry calls
  # "the most dangerous permission in this catalog that is not AZ3", and
  # core.principal.revoke-platform-scope, which can strip platform authority.
  # THE INVARIANT SAYS THE SURFACE DOES NOT CROSS THE TENANT BOUNDARY. IT SAYS NOTHING ABOUT
  # HOW MUCH POWER SITS ON THE PLATFORM SIDE OF IT, and it must not be read as though it did.
  #
  # TODAY platform-admin HOLDS ALL ELEVEN, and marketplace-moderator holds one of them
  # (core.marketplace.moderate). THAT IS AN OBSERVATION OF THE CURRENT STATE AND NOT A SECOND
  # INVARIANT — do not turn it into a set-equality check. This file already anticipates a
  # break-glass responder role holding REVOKE without GRANT, and a platform permission
  # deliberately withheld from platform-admin is precisely what that would look like.
  #
  # =====================================================================================
  # *** WITHDRAWN 2026-09-10, BEFORE IT WAS EVER IN FORCE. DO NOT IMPLEMENT ANY OF IT. ***
  # =====================================================================================
  # A CO-HOLDING INVARIANT (`coHoldingRequired`) WAS PROPOSED HERE ON 2026-09-09 AND WAS
  # REJECTED BY THE TEAM LEAD ON 2026-09-10 AFTER SECURITY REVIEW. IT IS KEPT RATHER THAN
  # DELETED BECAUSE THE TWO REJECTION ARGUMENTS ARE REUSABLE AND THE PROPOSAL IS NOT.
  # Nothing below is a request, an obligation, or a design. `coHoldingRequired` and
  # `coHoldingReason` ARE NOT KEYWORDS OF THIS FILE and no entry declares them.
  #
  # WHY IT WAS REJECTED — TWO ARGUMENTS, AND THE SECOND IS THE ONE TO CARRY ANYWHERE ELSE:
  #
  # (1) THE SUBJECT SET WAS WRONG AND IT WOULD HAVE PASSED ITS OWN GUARD. `organizations_using`
  #     is the declared response of FOUR operations under THREE permissions, not one. The
  #     invariant declared on one. Shipped as written it would have examined ONE declared pair,
  #     SATISFIED THE VACUITY GUARD ITS AUTHOR HAD INSISTED ON, printed a population of 1, and
  #     PASSED — covering a third of the surface while reading as complete. The guard catches a
  #     check handed NOTHING; this was a check handed HALF (workflow.md §11a).
  #     AND THE RATIONALE FAILED ONE LEVEL UP FROM WHERE IT LOOKED: the proposal argued
  #     declared-and-derived because a hardcoded pair is a transcribed fact. WHICH PERMISSIONS
  #     MUST DECLARE IT IS ITSELF A HAND-TRANSCRIBED FACT ABOUT A CONTRACT, in a file that
  #     cannot see that contract — the same defect the argument was written to avoid.
  #
  # (2) *** IT WAS A ROLE-COMPOSITION LINT, NOT AN AUTHORIZATION CONTROL, AND ITS RED STATE IS
  #     CLEARED BY GRANTING MORE. *** A co-holding REQUIREMENT can only ever be satisfied by
  #     WIDENING A ROLE. Someone defining a legitimately narrow role hits a red check and the
  #     mechanical fix in front of them is "add the other permission too". A CONTROL WHOSE
  #     REMEDY IS A BROADER GRANT PUSHES AGAINST LEAST PRIVILEGE, and the proposal never named
  #     that. security.md §2 puts the decision in Core, on every call; this was a checker over a
  #     YAML file at build time. The documentation-trigger benefit was real and it is the
  #     benefit of a TRIGGER, not of a CONTROL, and it must not be recorded as the latter.
  #
  # WHAT REPLACED IT: a dedicated permission, `core.template-adoption.read` at `sensitive`,
  # proposed by template-lifecycle-v1. Decided in Core on every call, fails as `forbidden`
  # under deny-by-default, and CLEARING A REFUSAL MEANS GRANTING THE COUNT DELIBERATELY rather
  # than widening a role. Opposite remedy, same finding.
  #
  # AND IF THE KEYWORD IS EVER REVIVED FOR SOMETHING ELSE, IT INHERITS A COVERAGE LIMIT NOBODY
  # HAD NAMED: platform roles are a FROZEN LIST Core maps from `platform_operator.platform_role`,
  # and docs/decisions/0007 D16 clause 3 stops a tenant principal ever holding a platform
  # permission — so a check over `defaultRoles` is coextensive with reality TODAY. That is a
  # property of the current design, not of the check. THE DAY PLATFORM ROLES BECOME DATA RATHER
  # THAN A FROZEN LIST, SUCH A CHECK SILENTLY STOPS COVERING THEM.
  #
  # ------------------------------------------------------------------------------------
  # THE ORIGINAL PROPOSAL FOLLOWS, UNEDITED, AS HISTORY. IT IS NOT IN FORCE.
  # ------------------------------------------------------------------------------------
  # PROPOSED 2026-09-09 by architecture-agent, on a Team Lead ruling, arising from
  # template-lifecycle-v1's platform.templates.usage route. IT IS A PERMISSION-MODEL
  # CONSTRAINT AND THEREFORE A SECURITY DECISION: it goes to security-agent with that
  # contract's three proposed permissions and it is NOT IN FORCE UNTIL IT IS APPROVED
  # AND MOVED OUT OF THIS COMMENT (security.md §8; 0007 rule 4's reasoning, applied to a
  # constraint rather than to a permission). NOTHING BELOW BINDS ANYTHING TODAY.
  #
  # THE FINDING IT ANSWERS — A PAIR DISCLOSES WHAT NEITHER MEMBER DISCLOSES ALONE.
  # platform.templates.usage returns a COUNT of Organizations adopting one Template. It is
  # gated by core.template.read and adds no new permission. A holder of core.template.read
  # WITHOUT core.organization.list therefore learns a LOWER BOUND on how many Organizations
  # exist — a fact about the platform's customer base, reached through a Template route.
  # NO RULE IS BROKEN AT EITHER STEP. Reading a Template is permitted; returning a count is
  # permitted; the disclosure is a property of the two being held together.
  # organization-detail-v1 records the identical shape in its
  # soTHEDISCLOSUREISNOTINEITHERPERMISSIONALONE, as reasoning rather than as a mechanism.
  #
  # WHY A CONDITION IN A COMMENT IS NOT GOOD ENOUGH, WHICH IS THE WHOLE RULING.
  # The safety rests on a property of TODAY'S ROLE SET — platform-admin is the only role
  # holding core.template.read and it also holds core.organization.list. ROLE SETS CHANGE,
  # and NOTHING GOES RED the day a role is created holding one and not the other. The person
  # creating that role is reading THIS FILE, not a usage route's contract.
  # architecture.md §3a and §3a-i both rule the same way: prefer the mechanism, and prefer
  # the guard whose DEFAULT catches the new case.
  #
  # THE PROPOSED SHAPE — DECLARED ON THE ENTRY, DERIVED BY THE CHECK, NEVER TRANSCRIBED.
  #   A permission entry may declare:
  #       coHoldingRequired: [<permission id>, ...]
  #       coHoldingReason:   "<why the pair discloses what neither does alone>"
  #   THE INVARIANT: for every entry declaring coHoldingRequired, every role holding that
  #   permission also holds every permission it names.
  #   FOR THIS CASE: core.template.read would declare coHoldingRequired:
  #   [core.organization.list], reason: "platform.templates.usage returns an aggregate over
  #   the Organization population; without the ability to enumerate Organizations, the count
  #   is a disclosure rather than a summary of what the holder may already see."
  #
  # WHY DECLARED-AND-DERIVED RATHER THAN A HARDCODED PAIR IN THE CHECK. A check holding the
  # pair itself is a second copy of a fact, in a file that cannot see the first — the same
  # class as a transcribed row-count or a transcribed line number (workflow.md §12), and it
  # goes stale the moment a permission is renamed. Deriving the pairs FROM THIS FILE also
  # scales: the next aggregate route declares its pair here and the check needs no edit.
  #
  # *** `coHoldingRequired` IS DIRECTIONAL. IT IS NOT `enumPolicyDivergence` AND MUST NEVER
  # BE MADE SYMMETRIC. ***
  # The two keywords arrive in the same week, do adjacent-sounding jobs — "these two
  # declarations are related, do not flag them" — and will sit near each other in a reader's
  # mind. THEY REQUIRE OPPOSITE THINGS AND HARMONISING THEM WOULD BE A REAL DEFECT:
  #
  #   enumPolicyDivergence   MUTUAL, and the mutuality is the safety. It SUPPRESSES a
  #                          finding, so a one-sided marker would be a suppression the other
  #                          file never agreed to — self-service silencing of a check.
  #   coHoldingRequired      ONE-WAY, and the asymmetry is the meaning. "Holding
  #                          core.template.read requires also holding core.organization.list"
  #                          is an implication, not an equivalence. It CREATES a finding
  #                          rather than suppressing one, so there is nothing for a second
  #                          party to consent to.
  #
  # WHAT SYMMETRY HERE WOULD ACTUALLY DO, stated concretely because "it would be wrong" is
  # not an argument anyone can act on: core.organization.list DOES NOT REQUIRE
  # core.template.read AND MUST NOT BE MADE TO. Forcing the reverse implication would give
  # the narrower permission a claim on the broader one and change the role model — every
  # role that may enumerate Organizations would be obliged to read Templates, which nobody
  # decided and which no disclosure argument supports. The aggregate leaks in ONE direction:
  # the count is a disclosure to a holder who cannot already enumerate. The reverse is not a
  # disclosure at all.
  #
  # THE MECHANICAL FORM, so a check cannot get this wrong by reading the prose: the relation
  # is a DIRECTED EDGE from the declaring entry to each id it names. A check that builds an
  # undirected pair set has already lost the meaning. And a cycle — two entries each naming
  # the other — is LEGAL and means genuine mutual requirement; it must not be special-cased
  # into symmetry for every pair.
  # (architecture.md §1a: this is a name read across a boundary. Two keywords, adjacent, one
  # mutual and one not, is exactly the shape somebody tidies into agreement.)
  #
  # *** THE VACUITY GUARD, AND IT IS NOT OPTIONAL: NO ENTRY DECLARES THIS FIELD TODAY. ***
  # A check shipped now would examine ZERO pairs and pass, perfectly and meaninglessly, and
  # a run where nothing was declared would render identically to one where every pair held.
  # SO THE CHECK MUST REPORT THE POPULATION OF DECLARED PAIRS AND SAY LOUDLY WHEN IT IS ZERO
  # (workflow.md §11a). ITS KNOWN-FAILING INPUT: a fixture role holding core.template.read
  # and not core.organization.list, which must go RED.
  #
  # *** AND IF THE INVARIANT IS WRONG, THE CHECK IS STILL THE RIGHT OUTCOME. *** If a
  # legitimate future role should read Templates and NOT enumerate Organizations, then the
  # disclosure is real for that role and the usage route needs a different answer — a
  # separate permission, or a count withheld. THE CHECK IS WHAT FORCES SOMEBODY TO HAVE
  # THAT ARGUMENT INSTEAD OF QUIETLY CREATING THE ROLE. That is the point of it failing
  # rather than being remembered, and it is why "the invariant might be wrong" is not an
  # objection to proposing it.
  #
  # NOT PROPOSED HERE, DELIBERATELY: whether organization-detail-v1's pair deserves the same
  # mechanism. It is the same shape and it is a different analysis, and folding it in would
  # be this proposal growing scope on its own authority. Named so it is not lost.
  #
  # *** AND THE SHARPER REASON, ADDED WITH THE WITHDRAWAL: THE TWO DISCLOSURES ARE INVERSES,
  # SO ONE KEYWORD COULD NEVER HAVE EXPRESSED BOTH. ***
  #   template usage        arises from holding template-read WITHOUT organization-list
  #                         -> the remedy is a co-holding REQUIREMENT
  #   organization-detail   arises from holding organization-list TOGETHER WITH a member-list
  #                         read -> the remedy is a co-holding PROHIBITION
  # `coHoldingRequired` is a DIRECTED EDGE THAT CREATES A FINDING. A mutual exclusion is the
  # OPPOSITE POLARITY, and folding them together would have been exactly the harmonisation
  # architecture.md §1a warns about — one layer above the enumPolicyDivergence/coHoldingRequired
  # pair the proposal already worried about. TWO KEYWORDS THAT LOOK RELATED AND REQUIRE OPPOSITE
  # THINGS IS THE SHAPE SOMEBODY TIDIES INTO AGREEMENT.
  #
  # AND THE RIGHT INSTRUMENT FOR THAT ONE IS NOT A PERMISSION CONSTRAINT AT ALL. The prohibition
  # is a RESERVATION — "there is no GET /organizations/{id}/members in this contract and one must
  # not be added" — so it belongs as a ROUTE-TABLE ASSERTION: no platform route returns a set of
  # principals for an Organization. That is core-agent's and the Team Lead is routing it
  # separately. TODAY IT LIVES ONLY IN CONTRACT PROSE, and workflow.md §12 is explicit that prose
  # describes while assertions instruct.
  # =====================================================================================
  #
  # *** THE HELD-BY-NOBODY STATE LASTED ONE DAY. *** On 2026-09-07 this said
  # `core.platform-organization.update` was declared and granted to nobody, "deliberate and
  # temporary". The user granted it the same day and this paragraph is the correction rather than
  # the argument — WHICH IS WHY IT WAS WRITTEN AS AN OBSERVATION AND NOT AS AN INVARIANT. A
  # set-equality check would have gone red on the intended state and green on the corrected one,
  # and somebody would have spent the day defending a number.
  # THE PROVENANCE OF THE GRANT IS BESIDE THE GRANT, in platform-admin's permission list, not
  # here: a reader asking "who approved this" is looking at the entry, not at a preamble.
  #
  # THE ORDERING THIS IMPOSES ON CORE, AND STEP 2 IS NOW THE OUTSTANDING ONE:
  #   1. DECLARED HERE. Done 2026-09-07.
  #   2. GRANTED BY THE USER. Done 2026-09-07. *** CORE HAS NOT YET TRANSCRIBED IT into
  #      platform/core/platform/platform-permissions.ts, and it must also go into that file's
  #      HELD_BUT_UNREACHABLE list, because no route serves it yet. ***
  #   3. THE ROUTE LANDS, and it leaves HELD_BUT_UNREACHABLE in the same change.
  #
  # *** BETWEEN 2 AND CORE'S TRANSCRIPTION, `registry-coherence.ts`'s "platform-admin holds
  # exactly what the catalog grants it" IS RED, BY DESIGN AND FAIL-CLOSED. *** That suite compares
  # this list against `grantsForPlatformRole('platform-admin')`, and its own header records which
  # direction each drift runs: a permission missing from the ROLE mapping denies an operator
  # something the catalog promises — a broken feature, never a broken boundary. IT IS THE
  # MECHANISM WORKING, and it goes green on the transcription.
  # assertEveryRoutePermissionIsReachable in platform-routes.ts is the other half and FAILS THE
  # BUILD when a route declares a permission no role can reach, so registering the route before
  # the transcription does not produce a `forbidden` somebody has to diagnose — it does not build.
  # That check exists because the revoke route shipped while its permission was still unreachable
  # and was `forbidden` to every operator alive.
  #
  # OWED AS A MECHANICAL CHECK — qa-agent, in suites/platform-operator/registry-coherence.ts,
  # because a hand-maintained assertion about this file is the kind this repository spent
  # 2026-09-05 learning not to trust:
  #   For every role whose scope is 'platform', assert that every permission it names resolves
  #   in this catalog AND declares 'platform' among its own scopes.
  #   REPORT THE POPULATION EXAMINED — how many platform roles, how many permissions checked —
  #   AND FAIL WHEN EITHER IS ZERO. A renamed key or a changed shape makes this check examine
  #   nothing and report success, which is the most confident wrong answer it can give.
  #   THE KNOWN-FAILING INPUT IT MUST SHIP WITH: a fixture platform role holding one
  #   tenant-scoped permission — core.audit.read will do — which must turn it RED. A check that
  #   has only ever been handed passing input has been observed, not verified
  #   (.claude/rules/workflow.md §11a).
  - id: platform-admin
    scope: platform
    status: proposed
    description: >-
      Platform operator. Holds no tenant-scoped permission and cannot read tenant business data.
      Support access to tenant data still awaits the AZ3 break-glass record — UNCHANGED BY EVERY
      PLATFORM-SCOPED PERMISSION ADDED SINCE, every one of which is control-plane or platform
      configuration. THE PROPERTY REPLACED A COUNT ON 2026-09-06: this read "the six permissions
      added 2026-09-05", the true figure could not be recovered from git history, and the claim
      is true whichever number is right because none of the additions grants tenant access. A
      number is decoration on a sentence whose job is to reassure, which is where a wrong figure
      costs the most.
      THIS ROLE IS NOW REACHABLE. Until docs/decisions/0025 it was seed data describing a role no
      principal could hold, because every grant path ran through organization_membership and a
      platform principal has no membership row (AZ9). `platform_operator.platform_role` is where
      this identifier is stored, and Core maps it to the frozen list below exactly as
      authorization/roles.ts maps a MembershipRole — same rules, same prohibition on wildcards,
      and a SEPARATE mapping, because a principal appearing in both tables is refused everywhere.
    permissions:
      - core.principal.grant-platform-scope
      - core.marketplace.moderate
      - core.organization.create
      - core.organization.list
      - core.template.read
      - core.template.list
      - core.template.create
      - core.credential.reset
      - core.platform-audit.read
      - core.principal.revoke-platform-scope
      # =======================================================================
      # GRANTED BY THE USER, 2026-09-07. Relayed by the Team Lead, who does not
      # approve — security.md §8 reserves the grant to the user and permits the
      # Team Lead only to relay it.
      #
      # WHAT THE USER WAS TOLD, recorded so the grant can be audited against the
      # approval rather than against somebody's memory of it. The request was
      # enumerated and named: THE PERMISSION; that it permits EDITING AN
      # ORGANIZATION'S DISPLAY NAME, COMMERCIAL REGISTRATION AND VAT
      # REGISTRATION; that it adds NO NEW TENANT REACH, NO NEW DATA ACCESS AND
      # NO NEW ROUTE beyond the identity update; and that it takes this role
      # FROM TEN PLATFORM PERMISSIONS TO ELEVEN.
      #
      # CHECKED AGAINST WHAT WAS DESCRIBED, AND IT MATCHES. The permission's own
      # entry above scopes it to the control-plane `organization` row, states
      # that it does not cover status, suspension or deletion, and
      # organization-identity-v1 publishes exactly one route for it.
      #
      # ONE THING THE DESCRIPTION DID NOT SAY, RECORDED RATHER THAN ABSORBED:
      # that route WRITES ONE AUDIT RECORD INTO THE CUSTOMER'S OWN TENANT
      # DATABASE — five row-writes from that Organization's daily allocation —
      # and READS NOTHING FROM IT. It is not tenant data ACCESS and it is a
      # tenant WRITE, so "no new tenant reach" is true of reads and needs the
      # qualification for writes. It exists because docs/decisions/0028 requires
      # the customer to be able to see what the platform did to them, so the
      # write is FOR the customer rather than at their expense — but it is the
      # kind of detail an approval should contain rather than acquire.
      # =======================================================================
      - core.platform-organization.update
  # core.app.read was removed from this role: it is declared scopes: [organization,
  # business], and a platform-scope role holding it reads every tenant's installed Apps
