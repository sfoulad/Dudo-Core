  # --- authorization ----------------------------------------------------------
  - id: core.role.read
    group: authorization
    description: "View roles and their permissions."
    sensitivity: read
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: core.role.create
    group: authorization
    description: "Create a custom role. Roles are never hardcoded."
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1
  - id: core.role.update
    group: authorization
    description: "Modify a role's permission set."
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1
  - id: core.role.assign
    group: authorization
    description: "Grant a role to a principal at a scope. Never grants more than the granter holds."
    sensitivity: sensitive
    scopes: [organization, business, branch, team]
    status: proposed
    phase: 1
  - id: core.role.revoke
    group: authorization
    description: "Withdraw a role. Effective on the principal's next call."
    sensitivity: sensitive
    scopes: [organization, business, branch, team]
    status: proposed
    phase: 1
  - id: core.principal.grant-platform-scope
    group: authorization
    description: "Grant platform scope. The broadest grant in the system."
    sensitivity: critical
    scopes: [platform]
    status: proposed
    phase: 1

  # --- platform operations (docs/decisions/0025) --------------------------------
  #
  # THE FIRST PERMISSIONS DECLARED AT 'platform' SCOPE SINCE THE CATALOG WAS WRITTEN, AND ONLY
  # THE THIRD, FOURTH, FIFTH AND SIXTH TO EXIST THERE AT ALL. Read the `platform` scope note
  # above before adding a seventh: platform scope is the only scope that spans Organizations, and
  # it NEVER grants access to tenant business data without the AZ3 break-glass elevation, which
  # does not exist. Every permission below obeys that line, and the line is what makes them
  # buildable now:
  #
  #   core.organization.create   writes control-plane rows. Touches no Organization's data,
  #                              because the Organization has none yet.
  #   core.organization.list     reads the control plane's organization table — identifiers and
  #                              status. NOT a tenant read, and NOT core.organization.read, which
  #                              is declared [organization] and stays there. Widening that one to
  #                              platform is the escalation AZ8 removed from marketplace-moderator
  #                              and must not be repeated here.
  #   core.template.*            reads and writes tenant-INDEPENDENT platform configuration.
  #   core.credential.reset      replaces a principal's credential. Touches no business record.
  #
  # NONE OF THEM READS A CUSTOMER, AN INVOICE, OR ANY ROW BEHIND whereWithTenant. That is not a
  # coincidence and it is not a coding style — it is the reason this whole surface could be built
  # before AZ3 rather than after it.
  - id: core.organization.create
    group: platform
    description: >-
      Create an Organization together with its first admin principal, credential, membership,
      tenant-directory entry and first Workspace. Platform operators only. Ten control-plane
      row-writes; see the onboarding contract. The Organization it creates is empty, so this
      permission never reads business data.
      RECLASSIFIED FROM `critical` TO `sensitive` ON 2026-09-05 BY docs/decisions/0026 DECISION 1 —
      in a record, never by a silent edit. Onboarding CREATES an empty tenant: nothing is
      destroyed, no money moves, and the credential it creates is THE TENANT'S FIRST, so there is
      no prior state to take over. §6's examples of critical are "move money, delete data
      irreversibly, rotate credentials" and this is none of them.
      core.credential.reset BELOW STAYS `critical`, and the split is the point: it replaces a
      credential a principal is ALREADY USING, which is account takeover with a legitimate front
      door. THE LADDER KEEPS ITS MEANING ONLY IF SOMETHING STAYS AT THE TOP. Do not read this
      reclassification as a precedent for reaching a route by lowering its class — 0026 took it
      only because the establishment-versus-takeover distinction survives scrutiny on its own.
      `sensitive` STILL REQUIRES AN AUDIT EVENT (§6), and onboarding writes two.
    sensitivity: sensitive
    scopes: [platform]
    status: proposed
    phase: 1
  - id: core.organization.list
    group: platform
    description: >-
      Enumerate Organizations — identifiers and status only, from the control plane. Separate
      from core.organization.read (declared [organization]), which is a TENANT principal reading
      its OWN Organization record. Two permissions rather than one widened one, because widening
      a tenant-scoped permission above the tenant boundary is the escalation AZ8 exists to record.
    sensitivity: sensitive
    scopes: [platform]
    status: proposed
    phase: 1
  - id: core.platform-organization.update
    group: platform
    description: >-
      Set an Organization's display name, its commercial registration and its VAT registration —
      the control-plane `organization` row, never anything behind whereWithTenant. Requested by
      organization-identity-v1 and docs/decisions/0031.
      IT IS SEPARATE FROM core.organization.update, which is declared [organization] and is a
      TENANT principal editing its OWN Organization record. Two permissions rather than one
      widened one, for the reason AZ8 records: widening a tenant-scoped permission above the
      tenant boundary is an escalation, not a convenience. THE TENANT PERMISSION HAS NO ROUTE AND
      CANNOT BE GIVEN ONE OVER THIS TABLE TODAY — `organization` is control-plane and an Action
      reaches no control-plane port — which is organization-identity-v1's OI-1 and is the reason
      the platform enters these values on the customer's behalf.
      IT DOES NOT COVER STATUS. Not suspension, not deletion, not activation. A suspend route,
      when it exists, is a separate permission and a separate argument — §3.2's splitting
      discipline applied before rather than after.
      NAMING: `core.platform-audit.read` is the only existing platform twin of a tenant permission
      and its convention is followed, the resource carrying `platform-`. THE ANALOGY IS IMPERFECT
      AND SAYING SO BEATS INVENTING A SECOND CONVENTION — there the two permissions cover
      DIFFERENT OBJECTS, here they cover the same Organization and differ in the caller class.
      SENSITIVE RATHER THAN WRITE, AND SENSITIVE RATHER THAN CRITICAL. It is above `write`
      because it is a platform principal editing a record inside a customer's own identity, which
      is not an ordinary record edit. IT INHERITS 0031's REASONING FOR NOT BEING CRITICAL: the
      ladder grades what the OPERATION does, and this one replaces a correctable field on a
      mutable record — nothing destroyed, no money moved, no authority changed, and a wrong value
      fixed by the same route that set it. If "a value that might later appear on a document"
      made it critical, so would the commercial registration and the display name, and the rung
      would stop sorting anything (0026, and 0031 Decision 2).
      A PERMISSION'S CLASSIFICATION IS NOT PER-ACTION AND WILL NOT TRACK ONE. It gates exactly one
      Action today; core.credential.reset already gates two of different shapes. IF THIS EVER
      GATES A CRITICAL ACTION, THE PERMISSION IS WHAT MUST BE REVISITED, because that is the level
      §7's confirmation requirement is read from.
    sensitivity: sensitive
    scopes: [platform]
    status: proposed
    phase: 1
  - id: core.template.read
    group: platform
    description: "View one Template — its name and its per-level display labels."
    sensitivity: read
    scopes: [platform]
    status: proposed
    phase: 1
  - id: core.template.list
    group: platform
    description: "Enumerate Templates. Separate from read, because enumeration is its own disclosure (§3.2)."
    sensitivity: read
    scopes: [platform]
    status: proposed
    phase: 1
  - id: core.template.create
    group: platform
    description: >-
      Create a Template — a business type. Carries a name and display labels and NEVER logic
      (docs/decisions/0025). Sensitive rather than write: a Template shapes what every
      Organization adopting it renders, so it is configuration with reach.
    sensitivity: sensitive
    scopes: [platform]
    status: proposed
    phase: 1
  - id: core.principal.revoke-platform-scope
    group: platform
    description: >-
      Remove a principal's platform authority. THE COUNTERPART TO
      core.principal.grant-platform-scope, AND DELIBERATELY A SEPARATE PERMISSION RATHER THAN THE
      SAME ONE — §3.2's logic that `list` is separate from `read` and `export` from `read` applies:
      granting and revoking the broadest authority in the system are different risks in opposite
      directions.
      THE SEPARATION BUYS SOMETHING CONCRETE: a break-glass responder role can hold REVOKE without
      GRANT, so the person reachable at 3am can cut off a compromised operator without themselves
      being able to create one. That role does not exist yet and this permission is what makes it a
      catalog edit rather than a redesign.
      CRITICAL, so confirmation applies (confirmation-v1) — which means SESSION THEFT ALONE CANNOT
      REVOKE ANYONE. There is no corresponding route for GRANT, deliberately: platform-operator-v1
      records that "a route that grants platform authority is the single most valuable target in the
      platform" and that "the frequency does not justify the surface."
    sensitivity: critical
    scopes: [platform]
    status: proposed
    phase: 1
