  - id: core.mcp.configure-external
    group: ai
    description: "Configure an external MCP server for the tenant. Everything it returns is untrusted."
    sensitivity: critical
    scopes: [organization]
    status: proposed
    phase: 8

  # --- developer and marketplace (Phase 3, 6) -----------------------------------
  - id: core.developer.register
    group: developer
    description: "Register as a Dudo developer."
    sensitivity: write
    scopes: [organization]
    status: proposed
    phase: 3
  - id: core.marketplace.submit
    group: marketplace
    description: "Submit an App, Capability, Connector, or Template for review."
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 6
  - id: core.marketplace.moderate
    group: marketplace
    description: "Approve or reject a marketplace submission. Platform operators only."
    sensitivity: critical
    scopes: [platform]
    status: proposed
    phase: 6

  # --- customers App: Customer Directory (Phase 1) ------------------------------
  #
  # THE FIRST NON-'core' NAMESPACE IN THIS CATALOG. These nine belong to the 'customers'
  # App, not to Core: no customer entity, status, retention constant or query path enters
  # platform/core/**. They are registered here because a permission that is not in this
  # catalog does not exist (0007 rule 4), so registration is what makes the Customer
  # Directory Actions reachable at all.
  #
  # Contract:  packages/contracts/apps/customers/customer-directory-v1.contract.yaml
  #            (status: proposed — registration here does not accept that contract)
  #
  # THE SCOPE SPLIT IS LOAD-BEARING AND IS NOT A STYLE CHOICE. The first six are declared
  # [organization, business] because the Customer entity carries a required business_id, so
  # a business-scope grant has a real predicate to narrow against. The last three are
  # [organization] ONLY: a move spans TWO Businesses and a business-scope grant is authority
  # over ONE, so declaring move at business scope would let the holder of one side reach
  # across the boundary it is standing on. Permanent deletion and its reversal are
  # irreversible data governance over the Organization's own records.
  #
  # customers.customer.export is DELIBERATELY ABSENT and must stay absent. This slice has no
  # export Action; §3.2 keeps export separate from read, and the way to keep it separate is
  # not to declare it until an export Action exists. Adding it here would create a grantable
  # permission over a capability nothing implements.
  - id: customers.customer.create
    group: customer
    description: "Create a customer in a named Business of the Organization's directory."
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.read
    group: customer
    description: >-
      View one customer's full record, including its address and notes. Separate from list:
      the list projection deliberately omits both sensitive-personal free-text fields, so
      reading a whole record is a distinct disclosure.
    sensitivity: read
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.list
    group: customer
    description: >-
      Enumerate and search customers. Separate from read because enumeration is its own
      disclosure. Search SHARES this permission rather than having its own — search IS
      enumeration, and a separate customers.customer.search would let a role reach the same
      information through a second door.
    sensitivity: read
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.update
    group: customer
    description: >-
      Modify a customer's details. Cannot change status — archiving is its own permission —
      and cannot change business_id, which is customers.customer.move.
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.archive
    group: customer
    description: >-
      Withdraw a customer from active use. Data is retained INDEFINITELY; this is not a
      delete and it starts no countdown to one.
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.restore
    group: customer
    description: >-
      Return an archived customer to active use. Separate from archive: reinstating a record
      puts it back into every list and search the Organization can see, and a role that may
      tidy the directory is not automatically a role that may reinstate from it.
    sensitivity: sensitive
    scopes: [organization, business]
    status: proposed
    phase: 1
  - id: customers.customer.move
    group: customer
    description: >-
      Move a customer from one Business to another within the same Organization. Never at
      business scope: a move spans two Businesses and a business-scope grant is authority
      over one, so granting it there would let the holder of one side reach across the
      boundary it is standing on.
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1
  - id: customers.customer.delete
    group: customer
    description: >-
      Permanently delete a customer. Starts an explicit 30-day recovery window, after which
      the customer's personal data is purged and cannot be recovered. Reachable only from
      'archived'. CRITICAL, not sensitive: §6 classes irreversible data destruction as
      critical, which adds a mandatory explicit confirmation collected by the platform from
      the human — never a request field. That mechanism does not exist, so the Action this
      permission guards is unreachable even once granted, which is the correct fail-closed
      state for the one Action in this App that destroys tenant data.
    sensitivity: critical
    scopes: [organization]
    status: proposed
    phase: 1
  - id: customers.customer.restore-deleted
    group: customer
    description: >-
      Cancel a pending deletion within the 30-day window, returning the customer to
      'archived'. Separate from customers.customer.restore, which returns an ARCHIVED
      customer to active use: the authority to tidy a directory is not the authority to
      countermand a deletion an organization-level principal ordered.
    sensitivity: sensitive
    scopes: [organization]
    status: proposed
    phase: 1

# ---------------------------------------------------------------------------
# defaultRoles — SEED DATA ONLY
#
# These ship as a starting point. They are data, never code: no role name may appear in a
# conditional in source. Customers create and modify their own roles freely.
#
# WILDCARDS: syntactically permitted in a role definition and nowhere else — but NO SEED
# ROLE USES ONE. What a wildcard expands to is not defined by any accepted decision: the
# rules above say only WHERE a wildcard may appear, never WHAT it expands to. The naive
# reading (expand to every matching permission regardless of the permission's own declared
# scopes) made 'business-owner' — a TENANT role — hold core.principal.grant-platform-scope,
# which is tenant-to-platform privilege escalation in the most commonly assigned role in
# the product. The seed roles below are therefore written as explicit lists that are safe
# under EVERY candidate expansion rule, and each list contains only permissions whose own
# declared 'scopes' include the role's 'scope'.
#
# The general expansion rule is a decision, not a schema detail, and IT IS NOW DECIDED —
# harder than D6 stated. docs/decisions/0007 was Accepted 2026-09-01 subject to ten binding
# rules, and RULE 3 PROHIBITS WILDCARD PERMISSIONS OUTRIGHT: "Not in roles, not in manifests,
# not in grants." So D6's intersection semantics govern nothing here, because there is nothing
# left to expand. The sentence above — "syntactically permitted in a role definition and
# nowhere else" — is superseded: a wildcard is permitted NOWHERE, and one must never be
# reintroduced here. `authorization/roles.ts::assertRoleMappingIsCoherent` enforces the same
# rule in code, at module load, and names this as the file where a wildcard would otherwise be
# smuggled back in.
# ---------------------------------------------------------------------------
defaultRoles:
  # Every permission below is declared at 'scopes: [platform]' in this catalog, and those
  # are the only two that are. This role holds NO tenant-scoped permission: reaching
  # tenant business data requires the AZ3 break-glass elevation, which does not exist yet.
  - id: platform-admin
    scope: platform
    status: proposed
    description: >-
      Platform operator. Holds no tenant-scoped permission and cannot read tenant business data.
      Support access to tenant data still awaits the AZ3 break-glass record — UNCHANGED by the six
      permissions added 2026-09-05, every one of which is control-plane or platform configuration.
      THIS ROLE IS NOW REACHABLE. Until docs/decisions/0025 it was seed data describing a role no
      principal could hold, because every grant path ran through organization_membership and a
      platform principal has no membership row (AZ9). `platform_operator.platform_role` is where
      this identifier is stored, and Core maps it to the frozen list below exactly as
      authorization/roles.ts maps a MembershipRole — same rules, same prohibition on wildcards,
      and a SEPARATE mapping, because a principal appearing in both tables is refused everywhere.
    permissions:
      - core.principal.grant-platform-scope
      - core.marketplace.moderate
      - core.organization.create
      - core.organization.list
      - core.template.read
      - core.template.list
      - core.template.create
      - core.credential.reset
      - core.platform-audit.read
      - core.principal.revoke-platform-scope
  # core.app.read was removed from this role: it is declared scopes: [organization,
  # business], and a platform-scope role holding it reads every tenant's installed Apps
  # across the tenant boundary. Moderation reviews PUBLISHED App versions, which is a
  # different object from a tenant's INSTALLED Apps; the platform-scope permission for
  # that does not exist and is openQuestions AZ8. Do not repair this by widening
  # core.app.read's scopes to include 'platform' — that pushes a tenant-scope permission
  # above the tenant boundary.
  - id: marketplace-moderator
    scope: platform
    status: proposed
    description: "Reviews marketplace submissions. Holds no tenant-scoped permission, so it currently has no view of Apps at all — see openQuestions AZ8."
    permissions: [core.marketplace.moderate]
  - id: developer
    scope: organization
    status: proposed
    description: "Builds and submits extensions."
    permissions: [core.developer.register, core.marketplace.submit, core.app.read]
  # Every permission below declares 'organization' among its own 'scopes'. This is the
  # former "core.*" expanded and then intersected with the role's scope: 59 of the 62
  # CORE permissions. The three core permissions omitted, and why:
  #   core.principal.grant-platform-scope  scopes: [platform] — CRITICAL escalation. A
  #                                        tenant role must never reach platform scope.
  #   core.marketplace.moderate            scopes: [platform] — same reason.
  #   core.notification.read               scopes: [own] — held at 'own', not at
  #                                        'organization'. Reading one's own
  #                                        notifications is not an organization-scope
  #                                        power; see the note in openQuestions AZ5.
  #
  # PLUS ALL NINE customers.* PERMISSIONS, added on 2026-09-02 on the Team Lead's accepted
  # seed-role ruling. Every one of the nine declares 'organization' among its own scopes, so
  # the intersection rule admits all nine at this role's scope — including
  # customers.customer.delete, which is CRITICAL. This is the deliberate outcome: the
  # Organization's owner is the party that owns the customer data and answers for it, and
  # somebody must be able to authorize an erasure request. Holding the permission is still
  # not sufficient to invoke the Action — the confirmation mechanism §7 requires for a
  # critical Action does not exist, so DeleteCustomer remains unreachable.
  # Total for this role: 68 of the 71 catalogued permissions.
  - id: business-owner
    scope: organization
    status: proposed
    description: "Owns the tenant. The most privileged tenant role — and strictly a TENANT role: it holds no platform-scope permission."
    permissions:
      - core.user.read
      - core.user.list
      - core.user.invite
      - core.user.update
      - core.user.deactivate
      - core.session.list
      - core.session.revoke
      - core.organization.read
      - core.organization.update
      - core.organization.delete
      - core.business.read
      - core.business.create
      - core.business.update
      - core.branch.read
      - core.branch.create
      - core.branch.update
      - core.team.read
      - core.team.create
      - core.team.update
      - core.team.manage-membership
      - core.role.read
      - core.role.create
      - core.role.update
      - core.role.assign
      - core.role.revoke
      - core.api-credential.list
      - core.api-credential.issue
      - core.api-credential.revoke
      - core.service-account.manage
      - core.subscription.read
      - core.subscription.change
      - core.usage.read
      - core.file.read
      - core.file.create
      - core.file.delete
      - core.notification.send
      - core.audit.read
      - core.audit.export
      - core.setting.read
      - core.setting.update
      - core.feature-flag.read
      - core.feature-flag.update
      - core.tenant.export
      - core.app.read
      - core.app.install
      - core.app.configure
      - core.app.grant-permission
      - core.app.revoke-permission
      - core.app.upgrade
      - core.app.disable
      - core.app.uninstall
      - core.capability.read
      - core.capability.configure-provider
      - core.ai.invoke
      - core.ai.configure
      - core.mcp.connect
      - core.mcp.configure-external
      - core.developer.register
      - core.marketplace.submit
      - customers.customer.create
      - customers.customer.read
      - customers.customer.list
      - customers.customer.update
      - customers.customer.archive
      - customers.customer.restore
      - customers.customer.move
      - customers.customer.delete
      - customers.customer.restore-deleted
  # The six customers.* permissions declared [organization, business] are held here; the
  # three declared [organization] only — move, delete, restore-deleted — are NOT, and the
  # intersection rule makes them impossible for a business-scope role to hold at all. That
  # is the intended outcome and not a gap to repair by widening their declared scopes: a
  # business-scope principal that could move a customer would be reaching across a boundary
  # it holds one side of, and one that could delete would be countermanding nobody.
  - id: business-admin
    scope: business
    status: proposed
    description: "Administers one Business without owning the Organization."
    permissions:
      - core.user.read
      - core.user.list
      - core.user.invite
      - core.user.update
      - core.business.read
      - core.business.update
      - core.branch.read
      - core.branch.create
      - core.branch.update
      - core.team.read
      - core.team.create
      - core.team.update
      - core.team.manage-membership
      - core.role.read
      - core.role.assign
      - core.role.revoke
      - core.setting.read
      - core.setting.update
      - core.audit.read
      - core.file.read
      - core.file.create
      - core.notification.send
      - core.app.read
      - core.app.configure
      - customers.customer.create
      - customers.customer.read
      - customers.customer.list
      - customers.customer.update
      - customers.customer.archive
      - customers.customer.restore
  # HOLDS NONE OF THE NINE customers.* PERMISSIONS, and the omission is the decision rather
  # than an oversight. The user's CD-2 ruling states that member reaches customers only
  # through explicitly registered permissions; granting nothing by default is the
  # fail-closed reading, and a member who needs directory access gets a custom role. Note
  # that member is ELIGIBLE for the six at business scope — eligibility is not a grant, and
  # nothing here grants it. 'developer', 'platform-admin' and 'marketplace-moderator'
  # likewise hold none: all nine are tenant-scoped, and a platform-scope role holding one is
  # the escalation removed from marketplace-moderator above.
  - id: member
    scope: business
    status: proposed
    description: "An ordinary user. Deliberately narrow — default = deny. Holds no customers.* permission."
    permissions:
      - core.user.read
      - core.business.read
      - core.branch.read
      - core.team.read
      - core.file.read
      - core.file.create
      - core.notification.read
      - core.setting.read

# ---------------------------------------------------------------------------
# openQuestions — recorded, not resolved. See AUTHORIZATION_STANDARD.md §13.
# ---------------------------------------------------------------------------
openQuestions:
  - id: AZ1
    question: "AUTHORIZATION_STANDARD.md §1-§10 is the logical permission model that 0001 requires as its own ADR."
    recommendation: "Team Lead records it; architecture-agent drafts on request. Nothing implements until then."
    blocks: "Phase 1"
  - id: AZ2
    question: "Authentication mechanism — sessions, tokens, OAuth/OIDC — is unrecorded."
    recommendation: "ADR alongside Phase 1 identity work. This catalog does not depend on the choice."
    blocks: "Phase 1"
  - id: AZ3
    question: "Platform-operator access to tenant business data. Support will eventually need it."
    recommendation: "Break-glass: explicit, time-bounded, reason-required, tenant-notified, always audited."
    blocks: "Phase 1 admin portal"
  - id: AZ4
    question: "Permission grouping for the App install consent screen. Unreadable consent is not consent."
    recommendation: "Group by the 'group' field above, with expandable detail. Product decision."
    blocks: "Phase 2"
  - id: AZ5
    # NAMING COLLISION, recorded 2026-09-05 so a reader does not conclude this entry is closed.
    # "AZ5" now names TWO different questions. docs/decisions/0019 and 0020 say they close
    # "AZ5", and they do — they close where a principal's GRANTS live and how the authorized
    # BUSINESS set is computed. THIS entry is a third question they do not touch: the grant path
    # for an 'own'-scope permission. docs/decisions/README.md still lists it as unwritten, item
    # 6, and that is correct. Both statements are true of different questions and the shared
    # label is what makes them look contradictory.
    question: >-
      How does a principal come to hold an 'own'-scope permission? core.notification.read
      is declared scopes: [own], so no role at organization, business, branch or team
      scope can legitimately carry it, yet every principal must be able to read their own
      notifications. Removing it from business-owner closed an invalid role definition and
      exposed the real gap: there is no defined grant path for an 'own'-scope permission.
    recommendation: >-
      Either a baseline self-role every principal holds at 'own' scope, or widen the
      permission's declared scopes. Both are model decisions and neither is made here.
      Fail-closed in the meantime: the permission is granted to nobody.
    blocks: "Phase 1"
  - id: AZ6
    question: >-
      What does a wildcard in a role definition expand to? The rules say only where a
      wildcard may appear, never what it expands to. The naive union reading is
      tenant-to-platform privilege escalation; the intersection reading is drafted as
      docs/decisions/0007 D6, which is Proposed and decides nothing.
    recommendation: >-
      Record 0007 (or D6 alone) as accepted, then add the catalog lint that recomputes
      every role's expanded set and fails on any permission whose declared scopes exclude
      the role's scope. Until then no seed role uses a wildcard and none may be added.
    blocks: "Phase 1; and the catalog lint check in CI"
  - id: AZ7
    question: >-
      Binding an Action to its target entity. PARTLY CLOSED. app-manifest.schema.json
      $defs/action now carries targetEntity and the schema requires it whenever scope is
      'own', so an 'own'-scoped Action can no longer borrow an unrelated entity's
      ownershipField to satisfy the manifest-level check. The referential clause is now
      ENFORCEABLE AND PROVEN AGAINST FIXTURES — NOT ENFORCED IN PRODUCTION. VALIDATOR-AZ7
      exists: packages/contracts/validation/app-manifest-relations.mjs, exporting
      validateManifestRelations(manifest) -> { valid, errors }, approved by ADR 0009. It
      runs WITHOUT selecting TS1 — that is the whole point of the 0009 exception: zero
      dependencies, the Node standard runtime only, no framework, no package.json. It
      enforces the contract relationships recorded today: targetEntity required for
      own-scoped Actions, resolution against the entities in the same manifest, rejection
      of missing, unknown, duplicate and ambiguous targets, and rejection when the
      RESOLVED entity lacks ownershipField — an ownershipField on an unrelated entity
      satisfies nothing. Measured on 2026-09-01 across the 19 active cases enumerated in
      packages/testing/fixtures/app-manifest/index.json at fixtureSetVersion 1, on Node
      v22.22.1, against packages/contracts/validation/app-manifest-relations.mjs: 16 PASS
      / 0 FAIL / 3 NOT RUN / 0 HARNESS ERROR — run twice, independently, identical both
      times. Read the scope before reading the number: all 16 passes are at the
      RELATION-VALIDATOR layer, EXECUTED. The JSON Schema layer was executed for ZERO
      cases and CANNOT be executed in Phase 0 — there is no JSON Schema implementation in
      the repository, no package.json and no node_modules, TS1 is undecided, and ADR 0009
      prohibits installing one — so every schema-layer verdict in the fixture set is
      DETERMINED BY INSPECTION, NOT EXECUTED. The three NOT RUN are runtime-obligation
      cases no static validator can decide. These counts are one measurement of one
      fixture-set version on one date, not a permanent invariant; they move whenever the
      fixture set does. az7-n4, the CWE-863 exploit, REJECTS with
      AZ7_TARGET_ENTITY_NOT_OWNED; az7-n8 REJECTS with
      AZ7_TARGET_OWNERSHIP_FIELD_UNDECLARED while its control az7-p2 ACCEPTS, and that
      pair is what proves the ownershipField lookup is scoped to the RESOLVED entity
      rather than to the manifest — the substitution gap az7-n8 was created to close.
      What remains open: (a) nothing runs the validator automatically — no CI job, no
      installation path, no runtime — so Phase 1 integration REMAINS MANDATORY before any
      installation or admission path ships; (b) this is a manifest-format change touching the SDK,
      Studio, APP_STANDARD.md and every future published manifest, so it needs its own
      decision record, which 0009 does NOT cover; (c) an Action targets exactly one entity
      — multi-entity targeting semantics are deliberately not invented here.
    recommendation: >-
      Team Lead records the manifest-format change as a decision — 0009 approves the
      validator, not the format. Wire VALIDATOR-AZ7 into CI and into the installation and
      admission paths in Phase 1; until it runs there, a manifest can reach installation
      without the referential check ever having been applied to it. Do not read the schema
      half as the whole rule — the split in §4.1 is load-bearing, and collapsing it is the
      overclaim that produced the original defect. 'Proven against fixtures' is not
      'enforced in production'; do not write the second.
    blocks: >-
      Automated enforcement of the referential clause of VAL-OWN, until VALIDATOR-AZ7 runs
      in CI and on the installation path.
  - id: AZ8
    question: >-
      Marketplace moderation has no permission it may legitimately hold. core.app.read
      was removed from marketplace-moderator because that role is platform-scope and the
      permission is declared scopes: [organization, business]. Moderation reviews
      PUBLISHED App versions and submissions, not a tenant's INSTALLED Apps, and no
      permission over the former is declared at any scope.
    recommendation: >-
      Declare a new permission at 'platform' scope covering published App versions and
      marketplace submissions. Do NOT widen core.app.read to include 'platform': that
      pushes a tenant-scope permission above the tenant boundary and recreates the
      escalation just removed. Declaring a new platform-scope permission is a model
      decision, so it is recorded here rather than invented. Distinct from AZ3 — this
      needs no tenant business data.
    blocks: "Phase 6 marketplace moderation"

  # ---------------------------------------------------------------------------
  # AZ9-AZ11 recorded 2026-09-05 from the super-admin / business-type request.
  # RECORDED, NOT RESOLVED. architecture-agent proposes; the Team Lead records.
  # ---------------------------------------------------------------------------
  - id: AZ9
    question: >-
      A PLATFORM PRINCIPAL HOLDS NO PERMISSION BY ANY PATH, AND THE MODEL HAS NO CARRIER FOR
      ONE. This catalog declares two permissions at 'platform' scope and two platform-scope seed
      roles to hold them, and NEITHER ROLE IS REACHABLE. docs/decisions/0019 put the grant on the
      organization_membership row; `authorization/roles.ts` is a closed union of two
      organization-scope roles; and a principal with no membership never reaches the mapping at
      all. So platform-admin and marketplace-moderator exist in this file as seed data and exist
      nowhere in the running system.
      THE OBVIOUS REPAIR IS AN ESCALATION AND MUST BE NAMED AS ONE. Adding a platform-tier value
      to MembershipRole, or seeding an operator a membership carrying one, would let
      `authorization/scope.ts` do the rest: 'platform' ranks above every other scope, so
      implies() admits it for every Action at every level, and the storage boundary then scopes
      the caller neatly into that Organization. Done once per Organization, that is cross-tenant
      access built from parts that individually break no rule. The property that holds today is
      structural and is worth stating exactly: NO MEMBERSHIP, NO TENANT STORE, NO ROWS.
    recommendation: >-
      Carry platform authority on a control-plane object of its own (core-object-registry.yaml
      CO4), never as a MembershipRole value and never on a row an Organization can cause to be
      written. Two invariants belong with it: a platform principal holds zero memberships, and
      MembershipRole never gains a platform-tier value. Reaching tenant BUSINESS data remains
      AZ3 and is deliberately NOT solved by this: platform CONFIGURATION — objects that name no
      Organization and touch no Organization's rows — is reachable without AZ3, and tenant data
      is not. Keep that line where it is; it is the whole reason a configuration capability can
      be built first.
    blocks: "Every platform-operator capability. Not AZ3, which is the separate and harder half."
  - id: AZ10
    question: >-
      RELATIONSHIP-BASED ACCESS HAS NO EXPRESSION IN THIS MODEL, AND 'own' IS NOT IT. The case:
      a parent must have authority over ONE student's records and none over any other's. That is
      not a tier — a parent is not a weaker teacher — and it is not a scope in the §4 ladder,
      because every scope there is a STRUCTURAL container (Organization, Business, Branch, Team)
      and a parent-student link is neither structural nor a container.
      'own' LOOKS LIKE THE ANSWER AND IS NOT. VAL-OWN clause 3 resolves 'own' through an
      ownershipField ON THE RESOLVED TARGET ENTITY, holding the ACTING principal's identifier. A
      student's record carries the student's identifier, not the parent's. Clause 4 states that
      an ownershipField on any other entity "contributes nothing, at all, ever", and rule 6
      forbids an owner identifier arriving with the call. Making 'own' traverse one hop to a
      related principal is exactly the substitution VALIDATOR-AZ7 rejects as
      AZ7_TARGET_ENTITY_NOT_OWNED, and az7-n8 is the fixture that exists to keep it rejected.
      So implementing the parent case through 'own' would reopen the CWE-863 gap by name.
    recommendation: >-
      An explicit delegation edge — principal to principal, or principal to record — carrying a
      bounded permission set, evaluated by Core as a fourth input alongside role and scope rather
      than smuggled into either. Binding on whatever is built: D11 applies unchanged, so a
      delegation can never carry more than the delegating principal holds; the edge is TENANT
      DATA and lives behind the tenant storage boundary, never in the control plane; and
      revocation is immediate under D12 like every other grant. Needs its own decision record.
      In the meantime FAIL CLOSED — there is no approximation of this using roles that does not
      grant a parent access to every student.
    blocks: "Any business type whose participants are related to one another rather than ranked — the school case, and every clinic with next-of-kin access."
  - id: AZ11
    question: >-
      PER-BUSINESS-TYPE ROLE VOCABULARIES CANNOT FIT A CLOSED TYPESCRIPT UNION, AND THE TRIGGER
      docs/decisions/0023 SET HAS ALREADY FIRED. 0023 records that this catalog's six seed roles
      and `authorization/roles.ts`'s two must be reconciled "before a second App exists". A
      per-business-type vocabulary — principal/teacher for a school, practice manager for a
      clinic — arrives ahead of that trigger and is a larger change than the one it anticipated,
      because a vocabulary is TENANT DATA (D7, D16.4) and a closed compile-time union cannot hold
      tenant data at all.
      D10 ALREADY SAYS THE ANSWER AND THE CODE ALREADY CONTRADICTS IT: "Roles are data, never
      code... Seed roles ship as a starting point and customers modify or replace them freely."
      `roles.ts` is that contradiction, chosen knowingly by 0019 on a row-write argument for a
      closed beta with no permission-editing surface. The argument was sound; the surface is now
      being asked for.
      THE QUESTION THE USER'S CASE ACTUALLY DECIDES: are per-business-type roles different LABELS
      over a fixed set of capabilities, or genuinely different CAPABILITY SETS? On the evidence
      of the school example, labels suffice for principal, teacher and student — the differences
      are structural scope (Organization, Team, own) that the ladder already expresses. They do
      NOT suffice for the parent, and the parent is not a labelling problem at all; it is AZ10.
    recommendation: >-
      Separate the label from the capability set. A tenant-owned role row carrying a display
      label and a reference to one of Core's FROZEN, code-owned permission sets keeps rule 3 (no
      wildcards) and rule 4 (explicit registration) intact by construction, costs one row per
      role rather than one per permission, and makes vocabulary a customisation rather than a
      fork. Opening per-tenant PERMISSION authoring is the larger step and drags in D11 and
      D16's four constraints; it is separable and should be decided separately. Either way the
      catalog's six seed roles and the code's two must stop being two vocabularies.
    blocks: "Per-business-type role vocabularies; and it is the third patch over the crack 0019, 0021 and 0023 each papered."
  - id: AZ12
    question: >-
      A CREDENTIAL RESET CONSOLE DELIBERATELY DESTROYS THE STRONGEST PROPERTY THE IDENTITY LAYER
      HAS, AND THAT MUST BE A DECISION RATHER THAN A SIDE EFFECT. `identity/credential-store.ts`
      states the property: "no `createCredential` and no `updateCredential`. Enrollment is an
      OPERATOR ACTION performed out of band, so the running Worker has no code path that writes a
      credential at all — which means no request, authenticated or not, can create or change one.
      That is the strongest form of 'registration is not built in this slice' available."
      ONBOARDING AND RESET BOTH REQUIRE BREAKING IT. Once the Worker can write
      `principal_credential`, the platform's account-takeover surface stops being "nothing" and
      becomes "whatever authorizes that write". Every control then rests on the authorization
      check rather than on the absence of the code path, which is a strictly weaker guarantee and
      should be adopted knowingly.
      WHAT IS NOT NEGOTIABLE, AND IS NOT A DESIGN CHOICE: THE PASSWORD CANNOT BE SHOWN, EVER.
      `principal_credential` holds identifier_hash, principal_id, algorithm, iterations, salt,
      verifier — no password column and no reversible form of one. The password never reaches
      Dudo; the client derives and the server stores a hash OF THE DERIVED VALUE. A "show the
      customer's password" feature is not withheld, it is arithmetically impossible, and any
      design that makes it possible has replaced the credential scheme. Recorded because the
      request WILL recur and the answer must not drift.
    recommendation: >-
      Specify credential write as its own narrow port with exactly two operations — enrol and
      replace — reachable only from the platform route class, never from an Action, and never
      from a tenant principal acting on another principal. Bind five constraints to it: the new
      value is machine-generated and shown EXACTLY ONCE, never stored and never re-displayable;
      the operation is `critical` under §6 and therefore needs audit AND explicit confirmation;
      it revokes every live session of the target principal on the next call, or the reset does
      not actually cut off an attacker who is already in; it draws
      PRINCIPAL_CREDENTIAL_ROW_WRITES from an allocation the slice must NAME, since
      `control-plane-admission.ts` records enrolment as costed-but-outside-the-budget; and it is
      rate limited, because an unbounded reset endpoint is a lockout weapon against every account
      on the platform. Do NOT specify anything that stores a recoverable password.
      NOTE THE ASYMMETRY WORTH KEEPING: a platform operator resetting a tenant admin's credential
      is a takeover of that account by design, and the tenant must be able to SEE it happened —
      which is a second reason the operator audit trail has to reach the tenant's own log
      (core-object-registry.yaml CO7) and not only a platform one.
    blocks: "Operator-driven onboarding and credential reset — the same code path serves both, and building them separately builds it twice."
