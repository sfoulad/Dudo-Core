---
# THE FLOOR FOR EVERY CASCADE CASE. Imports nothing, refuses nothing, must always be delivered.
#
# WITHOUT THIS FILE, "dep-v1.ts was not written" is indistinguishable from "the run delivered
# nothing at all" — which is the failure `.claude/rules/workflow.md` §11a calls the most confident
# wrong answer a check can give. Every assertion about a module NOT being written depends on some
# other module being written in the same run.

contractVersion: 1
apiVersion: v1
namespace: fixture
domain: cascade
status: proposed
updated: "2026-09-09"
documentsExistingImplementation: none

tenancy:
  scope: >-
    NONE. A generator test input. It binds to no route and reaches no store.

operations:

  - id: fixture.CascadeGood
    title: "An operation with no cross-schema dependency at all"
    description: >-
      Delivery is the assertion. If this module is missing, every negative case beside it is vacuous.
    request: { schemaRef: "urn:dudo:schema:cascadegood:1#/$defs/goodInput" }
    response: { schemaRef: "urn:dudo:schema:cascadegood:1#/$defs/goodOutput" }
    errors: [invalid_argument, internal]
    permission: fixture.cascade.invoke
    scope: none
    sensitivity: read
    idempotent: true
    maxRowWrites: 0
    httpStatusOnSuccess: 200
